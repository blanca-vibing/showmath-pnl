<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profit Calculator · 演出预算模拟器</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:#f4f5fb;color:#1a1a2e;font-size:14px}

/* ── LANDING ─────────────────────────────────────────────── */
#landing{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:20px;padding:40px;text-align:center}
.landing-logo{font-size:30px;font-weight:700;color:#2d3a8c;letter-spacing:-1px}
.landing-btns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:8px}
input[type=file]#file-input{display:none}

/* ── BUTTONS ─────────────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 22px;border-radius:6px;border:none;cursor:pointer;font-size:14px;font-weight:700;transition:.15s;text-decoration:none}
.btn-primary{background:#2d3a8c;color:#fff}.btn-primary:hover{background:#1e2a6e}
.btn-secondary{background:#fff;color:#2d3a8c;border:2px solid #2d3a8c}.btn-secondary:hover{background:#eef2ff}
.btn-ghost{background:#fff;color:#555;border:1px solid #e6e8f2}.btn-ghost:hover{background:#e4e7f5}
.btn-danger{background:#dc2626;color:#fff}.btn-danger:hover{background:#dc2626}
.btn-landing{background:#2d3a8c;color:#fff;font-size:15px;padding:12px 28px;border-radius:6px;min-width:160px;text-align:center;justify-content:center}.btn-landing:hover{background:#1e2a6e}
.tour-link{color:#aaa;font-size:13px;text-decoration:none}.tour-link:hover{color:#2d3a8c}

/* ── TOUR OVERLAY ─────────────────────────────────────────── */
#tour-overlay{display:none;position:fixed;inset:0;z-index:9980;pointer-events:none}
#tour-overlay.active{display:block;pointer-events:auto}
#tour-overlay.active:before{content:"";position:fixed;inset:0;background:transparent;pointer-events:none}
#tour-spotlight{position:fixed;background:transparent;box-shadow:0 0 0 9999px rgba(0,0,0,.65);border-radius:6px;z-index:9982;transition:none;pointer-events:none}
#tour-bubble{position:fixed;background:#fff;border-radius:12px;padding:20px 22px;max-width:320px;width:90vw;z-index:9990;box-shadow:0 8px 40px rgba(0,0,0,.3);pointer-events:all;visibility:hidden}
#tour-bubble.has-preview{max-width:390px}
.export-mi{display:block;width:100%;text-align:left;border:none;background:#fff;padding:10px 14px;font-size:13px;cursor:pointer;color:#2d3a8c;font-weight:650}.export-mi:hover{background:#eef2ff}
.file-menu-label{padding:9px 14px 5px;color:#8b93a7;background:#fff;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.file-menu-sep{height:1px;background:#e8eaf2;margin:4px 0}
.menu-danger{color:#b91c1c}
.tour-bubble-title{font-size:15px;font-weight:700;color:#2d3a8c;margin-bottom:8px}
#tour-arrow{position:absolute;left:24px;width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;display:none}
#tour-bubble.arr-up #tour-arrow{display:block;top:-9px;border-bottom:9px solid #fff}
#tour-bubble.arr-down #tour-arrow{display:block;bottom:-9px;border-top:9px solid #fff}
.tour-bubble-body{font-size:13px;color:#444;line-height:1.6;margin-bottom:14px}
.tour-section-preview{display:none;margin:10px 0 14px;padding:10px;background:#f7f8ff;border:1px solid #dbe2ff;border-radius:9px}
.tour-section-preview.visible{display:block}
.tour-preview-label{font-size:10px;color:#7c83a5;font-weight:700;letter-spacing:.08em;margin-bottom:7px}
.tour-preview-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tour-preview-item{display:flex;align-items:center;justify-content:center;min-height:34px;padding:5px 7px;border-radius:7px;background:#fff;border:1px solid #e3e7f5;color:#2d3a8c;font-size:11px;font-weight:700;text-align:center;line-height:1.3}
.tour-calendar-week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.tour-calendar-head{color:#8b93a7;font-size:8px;font-weight:700;text-align:center;padding-bottom:2px}
.tour-calendar-day{min-height:35px;padding:3px 1px;border-radius:5px;background:#fff;border:1px solid #e3e7f5;text-align:center;overflow:hidden}
.tour-calendar-date{display:block;color:#59617a;font-size:8px;line-height:1}
.tour-calendar-tag{display:block;margin-top:3px;color:#2d3a8c;font-size:8px;font-weight:700;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tour-calendar-day:nth-of-type(9) .tour-calendar-tag{color:#0f766e}.tour-calendar-day:nth-of-type(11) .tour-calendar-tag{color:#b45309}.tour-calendar-day:nth-of-type(12) .tour-calendar-tag{color:#7c3aed}
#tour-mini-tip{display:none;position:fixed;z-index:9988;width:250px;padding:11px 13px;background:#fff;border:1.5px solid #a5b4fc;border-radius:10px;box-shadow:0 8px 28px rgba(30,41,100,.25);pointer-events:none}
#tour-mini-tip.visible{display:block}
#tour-mini-tip:before{content:"";position:absolute;bottom:-7px;right:24px;width:12px;height:12px;background:#fff;border-right:1.5px solid #a5b4fc;border-bottom:1.5px solid #a5b4fc;transform:rotate(45deg)}
#tour-mini-tip.below:before{top:-7px;bottom:auto;border:0;border-left:1.5px solid #a5b4fc;border-top:1.5px solid #a5b4fc}
.tour-primary-highlight,.tour-secondary-highlight{position:relative!important;z-index:9987!important;background:#fff!important;border-radius:10px!important}
.tour-secondary-highlight{outline:3px solid #818cf8!important;box-shadow:0 0 0 7px rgba(129,140,248,.22),0 10px 32px rgba(30,41,100,.26)!important}
.tour-mini-title{font-size:12px;font-weight:700;color:#2d3a8c;margin-bottom:3px}
.tour-mini-body{font-size:11px;line-height:1.5;color:#555}
.tour-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tour-step-count{font-size:12px;color:#aaa;flex:1}
.tour-btn{padding:6px 14px;border-radius:6px;border:none;cursor:pointer;font-size:13px;font-weight:700}
.tour-btn-prev{background:#f0f2f8;color:#555}
.tour-btn-next{background:#2d3a8c;color:#fff}
.tour-btn-close{background:none;border:none;cursor:pointer;font-size:18px;color:#bbb;padding:0 4px;line-height:1}.tour-btn-close:hover{color:#555}
.tour-btn-mute{background:none;border:1.5px solid #c7d2fe;border-radius:6px;cursor:pointer;font-size:13px;padding:4px 8px;color:#888}.tour-btn-mute:hover{background:#f0f2f8}
.btn-sm{padding:6px 14px;font-size:13px}
.btn-xs{padding:4px 10px;font-size:12px}

/* ── APP HEADER ──────────────────────────────────────────── */
#app-wrap{display:none}
#app-wrap.visible{display:block}
#app-header{position:sticky;top:0;z-index:200;background:#2d3a8c;color:#fff;display:flex;align-items:center;gap:12px;padding:10px 20px;flex-wrap:wrap}
.hdr-title{font-weight:700;font-size:15px;flex:1;min-width:100px}
.hdr-meta{display:none} /* [v3.8.266] 艺人简称已包含在项目标题中，顶栏不重复显示 */
.hdr-rate{background:rgba(255,255,255,.15);border-radius:6px;padding:4px 10px;font-size:13px;cursor:pointer}.hdr-rate:hover{background:rgba(255,255,255,.25)}
.hdr-cur3{display:inline-flex;align-items:center;border:1px solid rgba(255,255,255,.3);border-radius:6px;overflow:hidden;font-size:13px;height:26px}.hdr-cur3 b{padding:0 9px;height:100%;display:inline-flex;align-items:center;cursor:pointer;font-weight:700;color:rgba(255,255,255,.7);border-right:1px solid rgba(255,255,255,.2)}.hdr-cur3 b:last-child{border-right:0}.hdr-cur3 b.on{background:#fff;color:#2d3a8c}
.cur2{color:#bbb;font-weight:400;font-size:.82em;white-space:nowrap}
.hdr-actions{display:flex;gap:8px;align-items:center}
.hdr-btn{background:rgba(255,255,255,.15);border:none;color:#fff;padding:4px 12px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:400}.hdr-btn:hover{background:rgba(255,255,255,.25)}.hdr-btn-disabled{background:rgba(255,255,255,.05)!important;color:rgba(255,255,255,.4)!important;cursor:not-allowed!important}
.hdr-menu-btn{width:92px;min-width:92px;justify-content:center;white-space:nowrap;font-size:13px;font-weight:400}

/* ── DEMO BANNER ─────────────────────────────────────────── */
#demo-banner{background:#2d3a8c;color:#fff;text-align:center;padding:8px;font-size:13px;font-weight:700;display:none}
#demo-banner.visible{display:block}

/* ── STEP NAV ────────────────────────────────────────────── */
#step-nav{position:sticky;top:49px;z-index:190;background:#fff;border-bottom:2px solid #e8eaf0;display:none;overflow-x:auto}
#step-nav.visible{display:flex}
.snav-item{padding:11px 16px;white-space:nowrap;cursor:pointer;font-size:13px;color:#999;border-bottom:3px solid transparent;font-weight:400;transition:.12s;margin-bottom:-2px}
.snav-item.active{color:#2d3a8c;border-color:#2d3a8c;font-weight:700}
.snav-item.done{color:#16a34a}

/* ── MAIN SCROLL AREA ────────────────────────────────────── */
/* 全宽两栏：左 1/5 常驻秀费锚点，右 4/5 现有步骤 */
#main-cols{display:flex;align-items:flex-start;gap:20px;max-width:1320px;margin:0 auto;padding:0 16px}
#fee-anchor{flex:0 0 21%;position:sticky;top:96px;align-self:flex-start;max-height:calc(100vh - 112px);overflow:auto;padding:24px 0 40px}
#scroll-area{flex:1 1 79%;min-width:0;padding:28px 8px 80px}
#pnl-rail{flex:0 0 232px;align-self:flex-start;position:sticky;top:96px;overflow:visible;padding:4px 0 40px}  /* [v3.8.252] 顶部空隙收窄 24→4 */  /* [v3.8.234] #4+#10 去内滚动条，两卡平铺 */  /* [v3.8.211] 恢复吸附:209误删sticky;滑轨仅超屏时出现 */
@media(max-width:900px){
  #main-cols{flex-direction:column;gap:0;padding:0 8px}
  #fee-anchor{position:static;flex-basis:auto;width:100%;max-height:none;padding:16px 8px 0}
  #pnl-rail{position:static;flex-basis:auto;width:100%;max-height:none;padding:8px 8px 0}
  #scroll-area{width:100%}
}
/* 秀费锚点卡片 */
.fa-card{background:#fff;border:1.5px solid #c7d2fe;border-radius:12px;padding:16px;box-shadow:0 2px 10px rgba(45,58,140,.06)}
.fa-title{font-size:13px;font-weight:700;color:#2d3a8c;display:flex;align-items:center;gap:6px;margin-bottom:10px}
.fa-big{font-size:26px;font-weight:700;line-height:1.1}
.fa-sub{font-size:12px;color:#888;margin-top:2px}
.fa-row{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;padding:4px 0;border-top:1px dashed #e6e8f2}
.fa-row b{font-weight:700}
.fa-bar{height:10px;border-radius:6px;background:#e6e8f2;overflow:hidden;margin:8px 0 4px;display:flex}
.fa-bar i{display:block;height:100%}

/* ── SECTION ─────────────────────────────────────────────── */
.section{margin-bottom:36px;scroll-margin-top:110px}
.section-header{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.section-num{width:28px;height:28px;border-radius:50%;background:#2d3a8c;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.section-title{font-size:17px;font-weight:700;color:#2d3a8c}

/* ── CARD ────────────────────────────────────────────────── */
.card{background:#fff;border-radius:12px;padding:20px 22px;margin-bottom:16px;border:1px solid #e6e8f2;box-shadow:none}
.card-title{font-size:14px;font-weight:700;color:#2d3a8c;margin-bottom:14px;display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.card-title .toggle-icon{margin-left:auto;font-size:12px;color:#aaa;transition:.2s}
.card-body{}
.card-body.collapsed{display:none}

/* ── FORM ────────────────────────────────────────────────── */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.form-grid.g3{grid-template-columns:1fr 1fr 1fr}
.form-grid.g1{grid-template-columns:1fr}
@media(max-width:600px){.form-grid,.form-grid.g3{grid-template-columns:1fr}}
/* [v3.8.252] 基本信息 + 票价与票档 两栏合并卡 */
.bi-split{display:grid;grid-template-columns:minmax(0,1fr) 430px;gap:24px;align-items:start}
.bi-right{border-left:1px solid #eef0f6;padding-left:24px}
@media(max-width:1080px){.bi-split{grid-template-columns:1fr;gap:18px}.bi-right{border-left:none;padding-left:0;border-top:1px solid #eef0f6;padding-top:16px}}
/* [v3.8.253] 一键摘取：弱化为「可选」小工具（subtle · 可收起 · 默认收起） */
.kx-card{background:#fbfbfe;border:1px solid #eceef5;border-radius:10px;padding:5px 14px;margin-bottom:14px}
.kx-head{display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;user-select:none}
.kx-title{font-size:12.5px;font-weight:600;color:#6b6f7d}
.kx-title .spark{color:#a5abf0}
.kx-opt{font-size:11px;font-weight:400;color:#aab0bd;margin-left:2px}
.kx-sub{font-size:11px;font-weight:400;color:#a0a4b0;margin-left:4px}
.kx-toggle{font-size:12px;color:#b6bac6;flex:0 0 auto;padding:2px 4px}
.kx-caution{font-size:12px;color:#b45309;background:#fffbeb;border:1px solid #fde68a;border-radius:6px;padding:6px 10px;margin:10px 0 0}
.kx-body{margin-top:10px}
.kx-body.collapsed{display:none}
.tp-head-row,.tp-tier-row{display:grid;grid-template-columns:46px 1fr 104px 26px;gap:10px;align-items:center}
.tp-head-row{padding:0 2px 6px;border-bottom:1px solid #eee;font-size:11px;font-weight:700;color:#6b7280}
.tp-tier-row{padding:7px 2px;border-bottom:1px solid #f4f4f8}
.tp-pn{font-family:ui-monospace,Menlo,monospace;font-size:14px;font-weight:700;color:#b6bac6;text-align:center;user-select:none}
.tp-tier-row input{font-family:inherit;font-size:14px;padding:8px 9px;border:1.5px solid #e5e7eb;border-radius:7px;background:#fff;color:#1a1a2e;width:100%}
/* [v3.8.252] Diamond 完成态摘要：统一字号(13)+强调数字统一靛蓝#4f46e5+标签#334155+状态淡绿小签 */
.dm-sum-row{display:flex;gap:10px;margin:6px 0;font-size:13px;line-height:1.7}
.dm-sum-k{flex:0 0 104px;font-weight:600;color:#334155}
.dm-sum-v{color:#475569}
.dm-sum-v b{font-weight:700;color:#4f46e5}
.dm-tag{display:inline-block;margin-left:8px;font-size:12px;font-weight:600;color:#059669;background:#ecfdf5;border:1px solid #d1fae5;border-radius:5px;padding:1px 7px}
.pnl-rail-compact{border:1px solid #e6e8f2;border-radius:12px;padding:12px 14px;background:#fafbff}
.pnl-rail-compact button{border:0;background:transparent;color:#4f46e5;font-size:11px;font-weight:700;cursor:pointer;padding:0}
.dm-city-decision{border:1px solid #e6e8f2;border-radius:12px;padding:14px 16px;margin-top:10px;background:#fff}
.dm-city-kpis{display:grid;grid-template-columns:repeat(3,minmax(105px,1fr));gap:8px;margin:10px 0}
.dm-city-kpi{border-radius:9px;padding:9px 10px;background:#f8fafc;text-align:center}
.dm-city-kpi b{display:block;font-size:20px;color:#4f46e5;margin-top:2px}
@media(max-width:640px){.dm-city-kpis{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:11px;font-weight:700;color:#666;text-transform:uppercase;letter-spacing:.4px}
.field input,.field select,.field textarea,.pp-input{padding:8px 11px;border:1.5px solid #c7d2fe;border-radius:6px;font-size:14px;color:#1a1a2e;outline:none;width:100%;transition:.12s;background:#fff;box-sizing:border-box}
.field input:focus,.field select:focus,.pp-input:focus{border-color:#2d3a8c;box-shadow:0 0 0 3px rgba(45,58,140,.08)}
.field input:disabled,.field select:disabled,.pp-input:disabled{background:#f7f8fc;color:#aaa;cursor:not-allowed}
.pp-input{text-align:center;-moz-appearance:textfield;appearance:textfield}
.pp-input::-webkit-inner-spin-button,.pp-input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.field .hint{font-size:11px;color:#aaa;margin-top:2px}
.field .ref{font-size:11px;color:#6b7fc4;margin-top:2px}

/* ── SEGMENTED CONTROL ───────────────────────────────────── */
.seg{display:inline-flex;border-radius:6px;overflow:hidden;border:1.5px solid #c7d2fe;background:#f7f8fc}
.seg button{border:none;padding:7px 16px;cursor:pointer;font-size:13px;font-weight:700;color:#888;background:transparent;transition:.12s}
.seg button.active{background:#2d3a8c;color:#fff}

/* ── NOTICE ──────────────────────────────────────────────── */
.notice{border-radius:6px;padding:10px 14px;font-size:13px;margin-bottom:14px}
.notice-yellow{background:#fffbe6;border:1px solid #f6d860;color:#7a5c00}
.notice-blue{background:#eef2ff;border:1px solid #b0b8e8;color:#2d3a8c}
.notice-red{background:#fff5f5;border:1px solid #fed7d7;color:#dc2626}
.notice-green{background:#f0fff4;border:1px solid #9ae6b4;color:#276749}
.notice-orange{background:#fff7ed;border:1px solid #fbd38d;color:#c05621}

/* ── TIER TABLE ──────────────────────────────────────────── */
.tier-table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:10px}
.tier-table th{background:#f4f5ff;padding:8px 10px;text-align:left;font-size:11px;font-weight:700;color:#666;border-bottom:2px solid #c7d2fe;white-space:nowrap}
.tier-table th.text-right,.tour-table th.text-right{text-align:right}
.tier-table td{padding:6px 8px;border-bottom:1px solid #f2f2f8;vertical-align:middle}
.tier-table tr:last-child td{border-bottom:none}
.tier-table input[type=number],.tier-table input[type=text]{width:100%;padding:5px 8px;border:1.5px solid #c7d2fe;border-radius:6px;font-size:13px}
.tier-table input:focus{border-color:#2d3a8c;outline:none}
.tier-table input:disabled{background:#f7f8fc;color:#aaa}
.tier-tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700;background:#eef2ff;color:#2d3a8c}
.remove-btn{background:none;border:none;cursor:pointer;color:#cc0000;font-size:16px;padding:2px 5px;line-height:1}
.remove-btn:hover{color:#900}

/* ── RESP TOGGLE ─────────────────────────────────────────── */
.resp-toggle{display:inline-flex;flex-direction:column;border-radius:6px;overflow:hidden;border:1.5px solid #c7d2fe;font-size:11px;width:100%;min-width:0;margin-left:0}
.resp-toggle button{border:none;padding:3px 5px;cursor:pointer;font-weight:700;transition:.1s;background:#f8f9ff;color:#888;text-align:center;width:100%}
.resp-toggle button.rp{background:#2d3a8c;color:#fff}
.resp-toggle button.ra{background:#e6520a;color:#fff}
.resp-toggle button.rv{background:#16a34a;color:#fff}

/* ── COST TABLE ──────────────────────────────────────────── */
.cost-group{margin-bottom:12px;border:1px solid #e8eaf0;border-radius:6px;overflow:hidden}
.cost-group-header{display:flex;align-items:center;justify-content:space-between;padding:9px 14px;background:#f8f9ff;cursor:pointer;user-select:none}
.cost-group-header:hover{background:#eef2ff}
.cost-group-title{font-size:13px;font-weight:700;color:#2d3a8c}
.cost-group-sub{font-size:12px;color:#888}
.cost-group-body{display:block}
.cost-group-body.collapsed{display:none}
.cost-line{display:grid;grid-template-columns:1fr 80px 60px 110px;gap:6px;align-items:center;padding:7px 14px;border-top:1px solid #f0f0f8}
.cost-line:first-child{border-top:none}
@media(max-width:650px){.cost-line{grid-template-columns:1fr;gap:6px}}
/* full-width layout for special cost lines (hotel/transport/visa/merch) to avoid grid misalignment */
.cost-line.wide{display:block}
.cost-line.wide .cl-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.cost-line.wide .cl-inputs{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px}
.cost-line.wide .cl-inputs input{padding:5px 8px;border:1.5px solid #c7d2fe;border-radius:6px;font-size:13px;text-align:right}
.cost-line.wide .cl-inputs input:focus{border-color:#2d3a8c;outline:none}
.cost-line-label{font-size:13px;color:#333}
.cost-line input[type=number]{width:100%;padding:5px 8px;border:1.5px solid #c7d2fe;border-radius:6px;font-size:13px;text-align:center;-moz-appearance:textfield;appearance:textfield}
.cost-line input[type=number]::-webkit-inner-spin-button,.cost-line input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.cost-line input:focus{border-color:#2d3a8c;outline:none}
.cost-line input:disabled{background:#f7f8fc;color:#aaa}
.cost-line-ref{font-size:11px;color:#9ba3c9}

.dm-chip.active{background:#4f46e5;color:#fff}
.dm-chip:hover{border-color:#4f46e5}
.dm-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.dm-score-row{display:grid;grid-template-columns:140px 1fr 30px;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #f4f5f9}
.dm-score-row .lbl{font-size:13px;font-weight:700;color:#333}
.dm-score-row .lbl small{display:block;font-size:10.5px;color:#999;font-weight:400;line-height:1.3}
.dm-score-row input[type=range]{width:100%;accent-color:#7c3aed}
.dm-score-row .val{font-size:15px;font-weight:700;color:#4f46e5;text-align:center}
.dm-field{margin:12px 0}
.dm-field label{font-size:12px;font-weight:700;color:#555;display:block;margin-bottom:5px}
.dm-field input[type=text],.dm-field select,.dm-field textarea{width:100%;border:1px solid #d8dbe8;border-radius:6px;padding:8px 10px;font-size:13px;font-family:inherit;box-sizing:border-box}
.dm-field input:focus,.dm-field select:focus,.dm-field textarea:focus{border-color:#7c3aed;outline:none;box-shadow:0 0 0 3px rgba(124,58,237,.1)}
.dm-btn{background:linear-gradient(120deg,#7c3aed,#4f46e5);color:#fff;border:none;border-radius:6px;padding:10px 18px;font-size:13px;font-weight:700;cursor:pointer;transition:.15s}
.dm-btn:hover{filter:brightness(1.08)}
.dm-btn-ghost{background:#f0f1f8;color:#555;border:1.5px solid #c7d2fe;border-radius:6px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer}
.dm-btn-ghost:hover{background:#e6e8f5}
.dm-verdict{background:linear-gradient(120deg,#faf5ff,#eef2ff);border:1px solid #ddd6fe;border-radius:12px;padding:20px 22px;margin-bottom:18px}
.dm-verdict .score-big{font-size:42px;font-weight:900;color:#4f46e5;line-height:1}
.dm-verdict .band{display:inline-block;padding:4px 14px;border-radius:20px;font-size:13px;font-weight:700;margin-left:10px;vertical-align:middle}
.dm-verdict p{font-size:13.5px;color:#3b3b52;line-height:1.75;margin:12px 0 0}
.dm-verdict .hl{font-weight:700;color:#4f46e5}
.dm-verdict .warn{font-weight:700;color:#c2410c}
.dm-dimbar{display:grid;grid-template-columns:130px 1fr 56px;align-items:center;gap:10px;padding:6px 0;font-size:12.5px}
.dm-dimbar .bar-bg{background:#e6e8f2;border-radius:6px;height:14px;position:relative;overflow:hidden}
.dm-dimbar .bar-fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:linear-gradient(90deg,#7c3aed,#4f46e5)}
.dm-dimbar .bar-spread{position:absolute;top:0;bottom:0;background:rgba(194,65,12,.22);border-left:1px dashed #c2410c;border-right:1px dashed #c2410c}
.dm-dimbar .avg{text-align:right;font-weight:700;color:#4f46e5}
.dm-spreadtag{font-size:11px;font-weight:700;padding:1px 7px;border-radius:10px}
.dm-op{border:1px solid #eceef5;border-radius:10px;padding:12px 14px;margin-bottom:10px}
.dm-op .op-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.dm-op .op-role{font-size:11px;color:#888;font-weight:700}
.dm-op .op-mini{display:flex;flex-wrap:wrap;gap:7px;margin:6px 0;font-size:11px;color:#555}
.dm-op .op-mini span{background:#f4f5f9;border-radius:6px;padding:2px 7px}
.dm-op .op-note{font-size:12.5px;color:#444;font-style:italic;background:#fafbff;border-radius:6px;padding:7px 10px;margin-top:4px}
.dm-ref{font-size:12px;color:#b0b4c0;line-height:1.7}
.dm-ref a{color:#4f46e5;text-decoration:none}.dm-ref a:hover{text-decoration:underline}
.dm-ref .dim-ref{margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid #f0f1f6}

<!-- ════ MODALS ════ -->
<div class="modal-overlay" id="guide-end-modal">

          <div><label style="font-size:11px">报批 · 国内af</label><input type="number" id="asm-tpl-af" min="0" placeholder="涉外固定3000"></div>
          <div><label style="font-size:11px">安保费率 元/人</label><input type="number" id="asm-tpl-sf" min="0" placeholder="空=默认300*"></div>
        </div>
        <label style="display:flex;align-items:center;gap:6px;margin-top:8px;font-size:12px;cursor:pointer"><input type="checkbox" id="asm-tpl-save" checked> 存入我的场馆库（本机保存，下次此城市下拉可选〔自建〕）</label>
      </div>
      <div id="asm-diy-del-wrap" style="display:none;margin-top:6px"><button type="button" class="btn" style="font-size:12px;padding:4px 10px" onclick="deleteDIYVenue()">🗑 从我的场馆库删除此自建场馆</button></div>

function translate(html){
  let out=html;
  if(lang==='en' || lang==='es'){   // [v3.8.49] 中文原样；英/西做整串替换
    const map = lang==='es' ? TR_ES : TR;
    const ck = lang==='es' ? '_keysEs' : '_keysEn';
    if(!translate[ck]) translate[ck]=Object.keys(map).sort((a,b)=>b.length-a.length);
    for(const k of translate[ck]){ if(out.indexOf(k)>=0) out=out.split(k).join(map[k]); }
  }
  // [v3.8.106] 单位描述符币种符号随 displayCur(如 ¥/人→$/人)。「¥/」只出现于单位描述,金额(¥123)/汇率(¥7.28/USD)均不含「¥/」,不会误伤
  if((state.displayCur||'CNY')!=='CNY') out=out.split('¥/').join(curSym()+'/');
  return out;
}

// All cost keys flattened — 并集（legacy 在前保留其 resp/unit，新增 V3 专有 key）
const ALL_COST_KEYS = (()=>{
  const seen={}, out=[];
  [...COST_GROUPS, ...COST_GROUPS_V3].forEach(g=>g.items.forEach(i=>{
    if(!seen[i.key]){ seen[i.key]=1; out.push({...i, group:g.key}); }
  }));
  return out;
})();

// [v3.8.2] 一次性巡演成本：金额始终 = 单价×人数 ÷ 场数（一笔费用平摊到每场，每场都显示自己那份）。目前仅签证。
const AMORTIZE_TOUR_KEYS={visa:1};
function amortizeTourCosts(){
  if(isDemo) return;   // demo 金额为定值，不重算（保住案例总额）
  const numShows=(state.shows||[]).length||1;
  // [v3.8.3] 签证为巡演级一次性成本：单价/人数取巡演级（国籍→单价、艺人方人数→人数），回填到每一场，
  //          保证「新增场次」也带上自己那份 ÷场数，不会出现某些场空白、整团少算的情况。
  // [v3.8.40] 签证按艺人方逐人国籍求和；单价取均价(总额/人数)以沿用 perHead(单价×人数÷场数)模型。国籍一致时＝原口径(保 golden master)。
  const _an=getNats('artist')[0]; if(_an) state.artistNationality=_an;   // 同步给报批涉外(v3.8.32)用
  const _vt=artistVisaTotal();
  const visaQty=_vt.cnt;
  const visaUnit=visaQty>0 ? _vt.total/visaQty : 0;
  (state.shows||[]).forEach(sh=>{
    const cs=sh.costs||{};
    const cv=cs.visa;
    if(cv && !cv._userEdited){ cv.unitPrice=visaUnit; cv.quantity=visaQty; }   // 未手改→按巡演级回填
    Object.keys(AMORTIZE_TOUR_KEYS).forEach(k=>{
      const c=cs[k];
      if(c && ((c.unitPrice||0)>0 || (c.quantity||0)>0)) c.amount=(c.unitPrice||0)*(c.quantity||0)/numShows;
    });
  });
}

function defaultCosts(){
  const c={};
  ALL_COST_KEYS.forEach(i=>{
    // [v3.7.21] 按人头项(安保/签证)数量默认 0 → 未选场馆/未填前显示空，不再误显示"1"；选场馆后由自动拉取按容量回填
    const perHeadKey=(i.key==='police'||i.key==='visa');
    const entry={amount:0, unitPrice:0, quantity:0, resp:i.resp};
    if(i.key==='mcsc') entry._enabled=true;            // [v3.8.36] 新建场次默认「计入」版权费(法定4%)；用户可关
    if(i.key==='wristband') entry.unitPrice=0.24;      // 手环单价默认¥0.24/个
    if(i.key==='lanyard')   entry.unitPrice=2.8;       // 挂牌套装默认¥2.8/套
    if(i.key==='visa') entry.visaRows=[{nationality:'',visaType:'',unitPrice:0,persons:0}];
    if(i.key==='merch_placeholder') entry.merchData={mode:'artist_self',items:[]};
    c[i.key]=entry;
  });
  return c;
}

function getCostSplitInfo(key, amount, capacity, bandSize){
  if(!amount) return null;
  const info = [];
  switch(key){
    case 'artist_catering':
      info.push(`艺人 ${fmt(amount/bandSize)}/人`);
      break;
    case 'tour_catering':
      info.push(`团队 ${fmt(amount/bandSize)}/人`);
      break;
    // 酒店按「房间数」录入、地面交通按「车型/服务」多行录入，明细已在各自输入行展示，此处不再拆分
    case 'airfares':
      info.push(`${bandSize}人 × ${fmt(amount/bandSize)}/人`);
      break;
    case 'visa':
      info.push(`${bandSize}人 × ${fmt(amount/bandSize)}/人`);
      break;
    case 'security':
      const secCount = Math.max(1, Math.floor(capacity/100));
      info.push(`${secCount}人 × ${fmt(amount/secCount)}/人`);
      break;
  }
  return info.length?info.join(' · '):null;
}

const CITY_REF={
  // city classification
  tier1:  new Set(['北京','上海']),
  tier1_5:new Set(['广州','深圳']),
  
  // hotel rates by [cityGroup][tier]  (CNY/room/night, weekday market rate)
  hotel:{
    tier1:  {mid:800, standard:1600, luxury:3500},
    tier1_5:{mid:700, standard:1600, luxury:3500},
    tier2:  {mid:500, standard:800,  luxury:null},  // luxury not available in tier2
  },
  
  // ground transport rates (CNY)
  transport:{
    coach:{pickup:700, dropoff:700, daily:1200},   // 考斯特 9-11座（接机/送机单程同价）
    gl8:  {pickup:500, dropoff:500, daily:700},     // GL8 6-7座
  },
  
  // flight reference (display only, not auto-filled)
  flight_eco_lo:525, flight_eco_hi:650,
  flight_biz_lo:1700, flight_biz_hi:2300,
};

// Helper: get city group key
function getCityGroup(city){
  if(CITY_REF.tier1.has(city)) return 'tier1';
  if(CITY_REF.tier1_5.has(city)) return 'tier1_5';
  return 'tier2';
}

// Helper: get hotel rate
function getHotelRate(city, tier){
  const g=getCityGroup(city);
  return CITY_REF.hotel[g][tier] || CITY_REF.hotel[g].mid;
}

// [v3.8.6 / #5] 每场票务平台（可多个）。无 platforms 数组时回退全局 state.platformFeeRate（demo/旧档守恒）。
function showPlatformRate(sh){
  const ps=sh&&sh.platforms;
  if(Array.isArray(ps)&&ps.length) return ps.reduce((a,p)=>a+(+p.rate||0),0);
  return state.platformFeeRate||0;   // legacy / demo 回退
}
// [v3.8.8 / #7] 本场票务平台费（绝对¥）= 各平台叠加：百分比平台=总票房×%，固定平台(如秀动LH)=固定¥/场。无 platforms→回退全局%。
function showPlatformFee(sh, gross){
  const ps=sh&&sh.platforms;
  if(Array.isArray(ps)&&ps.length){
    // [v3.8.233] 费率平台按「上架张数」占比分摊票房：份额=alloc÷本场总票数（票档合计,无票档回退容量）。
    // alloc 留空=该平台承接全部票房（旧口径,兼容旧档）。多平台各按自己上架占比计,不再都乘总票房。
    const _stock=(sh&&Array.isArray(sh.tiers)?sh.tiers.reduce((t,x)=>t+(+x.capCount||0),0):0)||(sh&&sh.capacity)||0;
    return ps.reduce((a,p)=>{
      const tp=TICKET_PLATFORMS.find(x=>x.k===p.k);
      if(tp&&tp.mode==='flat') return a + (p.flat!=null?(+p.flat||0):(tp.flat||0));   // 固定费
      let share=1;
      if(p.alloc!=null&&p.alloc!==''&&+p.alloc>0&&_stock>0) share=Math.min(1,+p.alloc/_stock);
      return a + gross*share*((+p.rate||0)/100);                                      // 百分比费×上架份额
    },0);
  }
  const _gtp=TICKET_PLATFORMS.find(x=>x.k===(state.ticketPlatform||'custom'));
  if(_gtp&&_gtp.mode==='flat') return _gtp.flat||0;   // [v3.8.178] 无 platforms 数组时：全局选了 flat 平台（秀动LH）→ 固定费，不再误按旧%费率
  return gross*((state.platformFeeRate||0)/100);   // legacy / demo 回退
}
function ensureShowPlatforms(sh){
  if(!Array.isArray(sh.platforms)||!sh.platforms.length){
    sh.platforms=[{k:state.ticketPlatform||'custom', rate:(state.platformFeeRate!=null?state.platformFeeRate:3)}];
  }
  return sh.platforms;
}
function onShowPlatform(si,pi,k){
  const sh=state.shows[si]; if(!sh) return; ensureShowPlatforms(sh);
  sh.platforms[pi].k=k;
  const tp=TICKET_PLATFORMS.find(x=>x.k===k);
  if(tp&&tp.mode==='flat') sh.platforms[pi].flat=(tp.flat!=null?tp.flat:0);   // [#7] 固定平台→带默认固定费
  else if(tp&&tp.rate!=null) sh.platforms[pi].rate=tp.rate;                    // 百分比平台→带默认费率
  render();
}
function onShowPlatformRate(si,pi,val){
  const sh=state.shows[si]; if(!sh) return; ensureShowPlatforms(sh);
  sh.platforms[pi].rate = val===''?0:+val;
  sh.platforms[pi].k='custom';   // 手改费率→自定义
  recomputeCalc();
}
function onShowPlatformAlloc(si,pi,val){   // [v3.8.233] 平台上架张数（费率分摊份额）
  const sh=state.shows[si]; if(!sh||!Array.isArray(sh.platforms)||!sh.platforms[pi]) return;
  sh.platforms[pi].alloc = (val===''?null:Math.max(0,Math.round(+val||0)));
  render();
}
function onShowPlatformFlat(si,pi,val){   // [#7] 手改固定费(¥/场)
  const sh=state.shows[si]; if(!sh) return; ensureShowPlatforms(sh);
  sh.platforms[pi].flat = val===''?0:+val;

  {key:'transport', zh:'后线运输',             en:'Backline Transport'},

// 巡演级 Backline（单一供应商全权负责，含器材+人员+物流+餐补）
// 逐日变动 × 总停留天数 + 一次性物流 = 巡演总价；每场 = 总价 ÷ 场数（共用）或 单场值（各自）。
function calcBacklineTour(){
  const cat=BACKLINE_CATALOG[state.artistLevel||'Livehouse']||BACKLINE_CATALOG.Livehouse;
  const cfg=state.backlineConfig||{};
  const n=k=>+cfg[k]||0;
  const shows=Math.max(1,(state.shows||[]).length);
  const days=Math.max(shows, shows + (state.logiDays||[]).length);  // 总停留天数(演出+行程日)
  const crew=n('crewCount');
  const gearCounts=n('drums')+n('keys')+n('guitarAmps')+n('iem');
  const configured = gearCounts>0 || crew>0;
  if(!configured) return {configured:false, perShow:0, tourTotal:0, days, shows};   // [v3.7.28] 未配置 Backline → 留空(0)，不再用级别均值 ¥22,000 兜底
  // 逐日变动
  const gearDaily = n('drums')*cat.drums + n('keys')*cat.keys + n('guitarAmps')*cat.guitarAmps + n('iem')*cat.iem + cat.foh + cat.cables; // 含 FOH+话筒/DI/线缆固定每日
  const crewDaily = crew*cat.techCrew;
  const pdRate = (cfg.perDiemRate!==''&&cfg.perDiemRate!=null)?+cfg.perDiemRate:300;
  const perDiemDaily = crew*pdRate;
  const variableDaily = gearDaily + crewDaily + perDiemDaily;
  const logistics = (cfg.logistics!==''&&cfg.logistics!=null)?+cfg.logistics:8000;  // 一次性往返物流
  const shared = cfg.shared!==false;
  let tourTotal, perShow;
  if(shared){ tourTotal=Math.round(variableDaily*days + logistics); perShow=Math.round(tourTotal/shows); }
  else { perShow=Math.round(variableDaily + logistics); tourTotal=perShow*shows; }  // 每城各自一套(单场)
  return {configured:true, shared, gearDaily, crewDaily, perDiemDaily, variableDaily, logistics, pdRate, crew, days, shows, tourTotal, perShow};
}

    date: date||'', city: city||'', venue: venue||'', capacity: cap||1000,
    tiers: _tiers,
    costs: defaultCosts(),
  };
}

// 把 demo 的 legacy 成本明细并桶到精简(V3)结构。只在同 resp(promoter)间搬运数值，
// 故每场 promoterCost 总额在数学上不变 → golden master 自动守住。airfares/freight(artist)保持原样。
function remapDemoCostsToV3(sh){
  const c=sh.costs;
  const add=(dst,src)=>{ if(c[dst]&&c[src]){ c[dst].amount=(c[dst].amount||0)+(c[src].amount||0); c[src].amount=0; c[src]._merged=true; } };
  // 市场：线下广告/KOL/印刷 → 其他市场费用(mkt_other)
  add('mkt_other','offline_ads'); add('mkt_other','kol'); add('mkt_other','print');
  // 场租：LED/其他场地费 → venue_rent
  add('venue_rent','led_rent'); add('venue_rent','rent_other');
  // 制作：音响/视频LED/灯光/Runners → Production Management(prod_mgmt)，backline 保留
  add('prod_mgmt','sound'); add('prod_mgmt','video_led'); add('prod_mgmt','lights'); add('prod_mgmt','runners_vans');
  // 人员：安保/消防检查/电工/清洁 → 唯一安保行 police（[v3.8.9/#8] 删 sec_venue 重复项后并入 police）
  add('police','security'); add('police','fire_inspect'); add('police','electrician'); add('police','cleaning');
  // digital_ads/design/stagehands/backline/prod_mgmt/artist_hotel/crew_hotel/ground_trans/visa 已是 V3 key，原样保留
}

// ══════════════════════════════════════════════════════════
//  CALCULATION ENGINE
// ══════════════════════════════════════════════════════════
function calcShow(show, overrideOcc){
  const cap = show.capacity;
  const tiers = show.tiers||[];
  let gross=0, artistVIPIncome=0, totalSellable=0;
  let tierDetails=[];

  const tierCounts = calcTierCounts(show);

  tiers.forEach((tier,ti)=>{
    const tierCap = tierCounts[ti];
    const isNewTier = (tier.sellable!==undefined&&tier.sellable!=='');   // [v3.7.44] Sellable 口径：填了即“预计售出”
    const effOcc = overrideOcc !== undefined ? overrideOcc/100 : (isNewTier ? 1 : (tier.occ||85)/100);
    const sold = Math.round(tierCap * effOcc);
    const rev = sold * (tier.price||0);
    gross += rev;
    totalSellable += tierCap;
    tierDetails.push({tierCap, effOcc, sold, rev, priceLift:0});
  });

  // [v3.8.254] Backend 分成：选定票档，金额 × (该档实际售出 − 起分点)，计入艺人所得（artistVIPIncome）。
  // 满场 potential（可售 − 起分点）在 UI 展示；此处按实际售出（随上座率）落损益。
  if(show.guaranteeType==='guarantee_backend' && show.beTier && (show.beAmt||0)>0){
    const _bti = tiers.findIndex(tt=>tt.name===show.beTier);
    if(_bti>=0){
      const _soldSel = tierDetails[_bti] ? tierDetails[_bti].sold : 0;
      const _over = Math.max(0, _soldSel - (show.beSplit||0));
      artistVIPIncome = (show.beAmt||0) * _over;
    }
  }

  const pfFee = showPlatformFee(show, gross);   // [#5/#7] 每场平台费：百分比叠加 + 固定费(秀动LH ¥10/场)
  const bizTax = vatOf(gross);                               // [v3.8.101] VAT除法：净=票面/(1+税率)
  const net = gross - bizTax;   // [v3.8.148] 前司口径：净票房=票面−税；平台费改列演出成本(不再netting)

  // costs
  let promoterCost=0, artistCost=0;
  const costs=show.costs||{};
  ALL_COST_KEYS.forEach(item=>{
    if(item.key==='ticket_commission'){ promoterCost += pfFee; return; }   // [v3.8.148] 平台费=真实成本(前司口径)，计入演出成本
    if(item.infoOnly) return;   // 其它仅展示项不计入成本
    const c=costs[item.key]||{amount:0,resp:item.resp};
    let amt=c.amount||0;
    if(item.key==='mcsc'){
      // [v3.8.36] 版权费法定口径：座位数(容量) × 平均票价 × 4%。开关「计入」默认仅新建场次开(newShow写_enabled=true)；关闭/旧档/demo 不计(仅展示)，保 golden master。
      const _avg = totalSellable>0 ? (tiers.reduce((a,t,ti)=>a+(t.price||0)*tierCounts[ti],0)/totalSellable) : 0;
      const _legal = Math.round((cap||0) * _avg * 0.04);
      const _amt = (!isDemo && c._enabled===true) ? _legal : 0;
      if(c.resp==='artist') artistCost+=_amt; else if(c.resp!=='venue') promoterCost+=_amt;
      return;
    }
    if(item.unit==='per_ticket'){
      // multiply by sold tickets
      const soldTotal=tierDetails.reduce((a,t)=>a+t.sold,0);
      amt=amt*soldTotal;
    } else if(item.unit==='pct_gross'){
      amt=gross*(amt/100);
    } else if(item.unit==='pct_expense'){
      // placeholder: % of fixed costs
      amt=promoterCost*(amt/100);
    }
    if(c.resp==='venue') { /* venue-provided: amount is 0 by default, but PM can set non-zero if venue charges */ }
    else if(c.resp==='promoter') promoterCost+=amt;
    else artistCost+=amt;
  });

  const gua = show._guarantee !== undefined ? show._guarantee : (state.guaranteeAmt||0);
  const gcur = show.guaranteeCur || state.guaranteeCur;                 // [v3.7.56] 每场各自货币
  const guaCNY = gcur==='USD' ? gua*state.exchangeRate : gua;
  const guaPerShow = guaCNY;                                            // 每场各自保底（不再 tour 平摊）
  const whtR = ((show.whtRate!==undefined?show.whtRate:state.whtRate)||0)/100;   // [v3.7.57] 艺人预扣税：主办需多付的税负差额 = G×r/(1−r)
  const whtDiff = (whtR>0&&whtR<1) ? guaCNY*whtR/(1-whtR) : 0;

  const sponsorship = show.sponsorship || 0;   // Net Sponsorship（模板 K19/K23）；demo 无此字段→0
  const netPotential = net + sponsorship - promoterCost;
  const promoterProfit = netPotential - guaPerShow - artistVIPIncome;   // [v3.7.59] WHT 不计入损益（从艺人款代扣，仅Offer条款）
  const promoterPct = netPotential!==0 ? (promoterProfit/netPotential)*100 : 0;

  const avgPrice = totalSellable>0 ? (tiers.reduce((a,t,ti)=>a+(t.price||0)*tierCounts[ti],0)/totalSellable) : 0;
  const soldTotal = tierDetails.reduce((a,t)=>a+t.sold,0);
  const netPerTicket = soldTotal>0 ? net/soldTotal : 0;
  const beCost = promoterCost + guaPerShow + artistVIPIncome;
  const beTickets = netPerTicket>0 ? beCost/netPerTicket : 0;
  const bePct = cap>0 ? (beTickets/cap)*100 : 0;

  return {cap, gross, pfFee, net, sponsorship, promoterCost, artistCost, artistVIPIncome,
    guaPerShow, whtDiff, netPotential, promoterProfit, promoterPct, bePct,
    avgPrice, soldTotal, tierDetails};
}

function calcTravelDays(){
  // Detect travel days between consecutive shows (sorted by date)
  const shows=[...state.shows].filter(s=>s.date).sort((a,b)=>a.date.localeCompare(b.date));
  if(shows.length<2) return {travelDays:0, travelCost:0, details:[]};
  const details=[];
  // Representative room count & per-room rate derived from the scheduled shows
  let roomsSum=0, rateSum=0, rateN=0, roomsN=0;
  shows.forEach(s=>{
    const hk=['artist_hotel','band_hotel','artist_staff_hotel','crew_hotel'];   // [v3.7.20] 四类汇总
    const rooms=hk.reduce((a,k)=>a+((s.costs[k]||{}).hotelPersons||0),0);
    const rate=hk.map(k=>(s.costs[k]||{}).hotelRate||0).find(r=>r>0)||0;
    if(rooms>0){roomsSum+=rooms;roomsN++;}
    if(rate>0){rateSum+=rate;rateN++;}
  });
  const roomsPerNight=roomsN>0?Math.round(roomsSum/roomsN):((state.bandSize||0)+(state.companyCrew||0));
  const hotelPerRoomNight=rateN>0?Math.round(rateSum/rateN):600; // fallback ¥600/room/night
  const transportPerDay=1200; // 考斯特包天 ¥1,200

  for(let i=0;i<shows.length-1;i++){
    const a=shows[i], b=shows[i+1];
    const dateA=new Date(a.date+'T00:00:00'), dateB=new Date(b.date+'T00:00:00');
    const gap=Math.round((dateB-dateA)/(86400000))-1; // nights between (excluding show days)
    const sameCity=(a.city===b.city);
    if(gap>0 && !sameCity){
      const hotelCost=hotelPerRoomNight*roomsPerNight*gap;
      const transCost=transportPerDay*gap;
      details.push({from:a.city, to:b.city, days:gap, hotelCost, transCost, total:hotelCost+transCost});
    }
  }
  const travelDays=details.reduce((a,d)=>a+d.days,0);
  const travelCost=details.reduce((a,d)=>a+d.total,0);
  return {travelDays, travelCost, details};
}

// [v3.7.23] 巡演级 Promoter Overhead = 巡演工作团队餐补（餐标 × 人数 × 总停留天数）。
// 总停留天数 = 演出日 + 行程日（非演出日）。Budget Assumptions 已删除；非演出日酒店由「行程日」卡逐日计、演出当晚酒店由四类酒店计。
// 艺人本人/艺人乐队/艺人工作人员 per diem 仍只算演出日（在「演出成本·餐饮」每场）。
function calcOverhead(){
  const nonShow=(state.logiDays||[]).length;
  const totalStay=(state.shows||[]).length + nonShow;
  // [v3.7.23] 巡演工作团队餐补已改为每场平摊(crew_meals 行)，不再在巡演级重复计；此处仅保留天数信息。
  return {tourCrewPerDiem:0, nonShow, totalStay, total:0, artistHotel:0, crewHotel:0, allowance:0};
}

function calcTour(overrideOcc){
  if(!state.shows.length) return null;
  const results=state.shows.map(s=>calcShow(s, overrideOcc));
  // 完整行程：有显式行程日则按其成本计；否则回退到 calcTravelDays 自动估算（兼容旧项目/Demo）
  const hasLogi=(state.logiDays||[]).length>0;
  const logi=hasLogi?calcLogistics():null;
  const travel=hasLogi?null:calcTravelDays();
  const overhead=calcOverhead();
  // [v3.7.23] 跨城物流/Travel Days 自动预估撤掉（通常含在 Backline 打包价里，不单列）。仅显式「行程日」仍计。
  const extraCost=(hasLogi?logi.cost:0)+overhead.total;
  return {
    results,
    totGross:   results.reduce((a,r)=>a+r.gross,0),
    totNet:     results.reduce((a,r)=>a+r.net,0),
    totPCost:   results.reduce((a,r)=>a+r.promoterCost,0),
    totVIP:     results.reduce((a,r)=>a+r.artistVIPIncome,0),
    totGua:     results.reduce((a,r)=>a+r.guaPerShow,0),
    totNetPot:  results.reduce((a,r)=>a+r.netPotential,0),
    totProfit:  results.reduce((a,r)=>a+r.promoterProfit,0) - extraCost,
    totPct(){return this.totNetPot!==0?this.totProfit/this.totNetPot*100:0},
    get totPromoterCost(){return this.totPCost + extraCost;},
    travel, logi, overhead, extraCost,
  };
}

// ── R1: 单一派生入口 ──────────────────────────────────────
// 所有渲染先经此得到 state.derived（唯一数据源的派生结果）。

          el.classList.toggle('active',i===idx);

// [v3.8.126] 一键摘取关键信息：规则解析中文/数字口述 → 自动填 人数 / 餐标 / 票价
function _cnNum(raw){
  if(raw==null) return null;
  let s=String(raw).trim().replace(/[０-９]/g,c=>'0123456789'['０１２３４５６７８９'.indexOf(c)]);
  if(s==='') return null;
  if(/^\d+(\.\d+)?$/.test(s)) return +s;
  const DIG={一:1,壹:1,二:2,两:2,贰:2,三:3,叁:3,四:4,肆:4,五:5,伍:5,六:6,陆:6,七:7,柒:7,八:8,捌:8,九:9,玖:9};
  const UNIT={十:10,拾:10,百:100,佰:100,千:1000,仟:1000};
  let total=0,section=0,num=0,seen=false,lastUnit=0,sawZero=false;
  for(const ch of s){
    if(/\d/.test(ch)){ num=num*10+(+ch); seen=true; }
    else if(ch==='零'||ch==='〇'){ sawZero=true; seen=true; }
    else if(DIG[ch]!=null){ num=DIG[ch]; seen=true; }
    else if(UNIT[ch]!=null){ section+=(num||1)*UNIT[ch]; lastUnit=UNIT[ch]; num=0; seen=true; }
    else if(ch==='万'||ch==='萬'){ total+=(section+num)*10000; section=0; num=0; lastUnit=10000; seen=true; }
    else if(ch==='亿'||ch==='億'){ total+=(section+num)*1e8; section=0; num=0; lastUnit=1e8; seen=true; }
  }
  // 口语省略尾位：三百五=350、两千五=2500（百/千后只剩一个数字、且无「零」）
  if(num>0 && lastUnit>=100 && !sawZero) num=num*(lastUnit/10);
  return seen?(total+section+num):null;
}

        const after=txt.slice(idx+w.length, idx+w.length+8);
        const mf=after.match(new RegExp('^[\\s:：有]*('+NT+'+)\\s*[位个名人]'));
        if(mf) n=_cnNum(mf[1]);
      }
      if(n!=null && n>0){
        state.people[rule.k].count=n;
        const el=id('pp-'+rule.k+'-count'); if(el) el.value=n;
        done.push(PEOPLE_META[rule.k].zh+' '+n);
        // 逐行餐标
        const pdm=line.match(new RegExp('(餐标|餐补|参标|参补|餐贴|per\\s*diem|餐费|伙食)\\s*[:：]?\\s*('+NT+'+)\\s*元?','i'));
        if(pdm){ const _pd=_cnNum(pdm[2]); if(_pd>0){ state.people[rule.k].pd=_pd; const pe=id('pp-'+rule.k+'-pd'); if(pe) pe.value=_pd; perLinePd[rule.k]=true; } }
        // 角色 + 国籍
        parseParen(line, rule.k, n);
      }
      break;
    }
  });
  // 2) 全局餐标（对未逐行填到的类别兜底）
  let pd=null;
  const pdKw=txt.match(/(餐标|餐补|参标|参补|餐贴|per\s*diem|餐饮补助|餐费|伙食)/i);
  if(pdKw){
    const fwd=txt.slice(pdKw.index, pdKw.index+18);
    const nm=fwd.match(new RegExp('('+NT+'+)\\s*元?'));
    if(nm) pd=_cnNum(nm[1]);
  }
  const anyPerLinePd=Object.keys(perLinePd).length>0;
  if(pd!=null && pd>0){
    PEOPLE_KEYS.forEach(k=>{ if(perLinePd[k]) return; state.people[k].pd=pd; const el=id('pp-'+k+'-pd'); if(el) el.value=pd; });
    state.globalArtistPD=pd; state.globalTourPD=pd;
    done.push(anyPerLinePd?'餐标（逐类，其余¥'+pd+'）':'餐标 ¥'+pd+'/人');
  } else if(!anyPerLinePd) missing.push('餐标');
  // 3) 票价 → globalPrices{fast,ga,vip}。同时支持两种语序 + 可选括号/元
  const pairs=[]; const seenPair={};
  const addPair=(p,lb)=>{ if(p==null||p<=0) return; const key=p+'|'+lb; if(seenPair[key]) return; seenPair[key]=1; pairs.push({p,lb:lb||''}); };
  // A) 金额 +（票档名）   例：380元（普通）
  let m; const reA=new RegExp('('+NT+'+)\\s*元?\\s*[（(]\\s*([^）)]+?)\\s*[）)]','g');
  while((m=reA.exec(txt))) addPair(_cnNum(m[1]), (m[2]||'').trim());
  // B) 票档名（+票）+ 金额   例：普通380元 / VIP 680 / 全价票 280元
  const reB=new RegExp('(普通票?|普票|标准票?|全价票?|全票|快通票?|快速票?|Fast\\s*Pass|Fastpass|早鸟票?|VIP票?|贵宾票?|GA票?)\\s*[:：为是=]?\\s*('+NT+'+)\\s*元?','gi');   // [v3.8.249/#8] 支持「GA为280元」「GA票280」句式
  while((m=reB.exec(txt))) addPair(_cnNum(m[2]), (m[1]||'').trim());   // [v3.8.253] 保留完整票档名（不再截掉「票」字，如"普票"）
  // C) 「票价分别为 380、280、680（对应 普通/全价/VIP）」——一串无内联标签的数字，按出现顺序归位
  if(pairs.length<2){
    const tkw=txt.search(/票价|票档|价格/);
    if(tkw>=0){
      const seg=txt.slice(tkw, tkw+60);
      const nums=seg.match(new RegExp(NT+'+','g'))||[];
      nums.slice(0,3).forEach(nn=>{ const p=_cnNum(nn); if(p!=null&&p>0) addPair(p,''); });
    }
  }
  if(pairs.length){
    // [v3.8.253] 票档摘取 → 保留口述的完整名称（如"普票"不再变"普"/不强改成"全价票"）；按金额从大到小 = P1↓。
    // 仅当项目已有场次时，才把名称对齐到既有票档桶（避免各城票档表重复档）；新建/摘取优先场景一律用口述原名。
    const bucket=(lb)=>{ const L=(lb||'').toUpperCase();
      if(/VIP|贵宾/.test(L)) return 'vip';
      if(/快通|快速|FAST|PASS/.test(L)) return 'fast';
      if(/全价|全票|GA|普通|普票|标准/.test(lb)) return 'ga';
      return null; };
    const hasShows=(state.shows||[]).length>0;
    const cur=Array.isArray(state.globalTiers)?state.globalTiers:[];
    const byBucket=b=>cur.find(t=>bucket(t.name)===b);
    const used={}; const list=[];
    pairs.forEach(o=>{ let nm=(o.lb||'票档');
      if(hasShows){ const b=bucket(o.lb); const ex=b?byBucket(b):null; if(ex&&ex.name) nm=ex.name; }
      if(used[nm]) return; used[nm]=1;
      list.push({name:nm, price:o.p});
    });
    list.sort((a,b)=>(+b.price||0)-(+a.price||0));   // 金额从大到小 = P1↓
    state.globalTiers=list; state._giMig=true;
    if(typeof syncGlobalCustomTiers==='function') syncGlobalCustomTiers();
    if(typeof mirrorGlobalPrices==='function') mirrorGlobalPrices(state);
    list.forEach((o,i)=>done.push('P'+(i+1)+' '+o.name+' ¥'+o.price));
  } else missing.push('票价');
  if(typeof propagateGlobalParams==='function') propagateGlobalParams(); else render();
  if(id('kx-input')){ id('kx-input').value=txt; kxAutoGrow(id('kx-input')); }   // 重渲染后回填原文(深色，不退回占位) + 自适应高度
  if(done.length){
    // [v3.8.253] 不再罗列已填明细（原蓝色长文案已删）；只给简短确认，核对靠上方提醒
    let msg='✓ 已填入，请逐项核对';
    if(missing.length) msg+='　<span style="color:#c2410c">（未识别：'+missing.join('/')+'）</span>';
    setRes(msg);
  } else setRes('没识别到可填字段，可手动填或调整措辞（人数/餐标/票价）','#c2410c');
}

// [v3.7.48] 演出卡 + 行程日卡 按日期合并排序渲染（用各自原始索引保 id/事件）
function renderDayCards(){
  const shows=state.shows||[], logis=state.logiDays||[];
  if(!shows.length && !logis.length) return renderShowCards();
  const items=[];
  shows.forEach((sh,i)=>items.push({k:'s',d:sh.date||'',i}));
  logis.forEach((ld,i)=>items.push({k:'l',d:ld.date||'',i}));
  items.sort((a,b)=>(a.d||'').localeCompare(b.d||''));
  return items.map(it=>it.k==='s'?renderShowCard(shows[it.i],it.i):renderLogiCard(logis[it.i],it.i)).join('');
}

// [v3.8.125] 月末自动翻到下月：落在真实当月、且当月剩余可选天数很少(≤7)、当月又没排任何日期时，
// 默认展示下个月(整月可选、不突兀)。用户手动翻月后(_calTouched)不再干预。
function maybeAutoAdvanceCal(){
  if(state._calTouched) return;
  const t=new Date(); const ty=t.getFullYear(), tm=t.getMonth();
  if(state.calYear!==ty || state.calMonth!==tm) return;        // 只在显示=真实当月时考虑
  const hasThisMonth=[...state.shows,...(state.logiDays||[])].some(s=>{ if(!s.date) return false; const d=new Date(s.date+'T00:00:00'); return d.getFullYear()===ty && d.getMonth()===tm; });
  if(hasThisMonth) return;                                      // 当月已排日期→留在当月
  const daysInMonth=new Date(ty,tm+1,0).getDate();
  const remaining=daysInMonth-t.getDate()+1;                    // 含今天的剩余可选天数
  if(remaining<=7){ state.calMonth=tm===11?0:tm+1; state.calYear=tm===11?ty+1:ty; }
}
function renderCalendar(){
  // [v3.8.134] 默认停在「当前日期所在月份」——不再月末自动翻下月（Blanca 要求）。今天锚点保留。
  const yr=state.calYear, mo=state.calMonth;
  const showDates=new Set(state.shows.map(s=>s.date));
  // 日类型映射：演出日 + 各物流日
  const dayMap={};
  state.shows.forEach(s=>{ if(s.date) dayMap[s.date]='show'; });
  (state.logiDays||[]).forEach(d=>{ if(d.date && !dayMap[d.date]) dayMap[d.date]=d.type; });
  const months=getCalMonths(yr,mo);
  const cals=months.map(({y,m})=>renderMonthCal(y,m,showDates,dayMap)).join('');
  return `<div class="card">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
    <span style="font-size:14px;font-weight:700;color:#2d3a8c">演出日历</span>

  <div class="text-muted" style="margin-top:4px">点击日期先选日类型：演出日排票房与场租；落地/移动/媒体/休息日计酒店·per diem·交通</div>

function getCalMonths(yr,mo){
  // check if any shows / 行程日 in next month too (cross-month)
  const allDated=[...state.shows, ...(state.logiDays||[])];
  const hasCrossMonth = allDated.some(s=>{
    if(!s.date) return false;
    const d=new Date(s.date+'T00:00:00');
    const nextY=mo===11?yr+1:yr, nextM=mo===11?0:mo+1;
    return d.getFullYear()===nextY && d.getMonth()===nextM;
  });
  const months=[{y:yr,m:mo}];
  if(hasCrossMonth){
    const ny=mo===11?yr+1:yr, nm=mo===11?0:mo+1;
    months.push({y:ny,m:nm});
  }
  return months;
}

function renderMonthCal(yr,mo,showDates,dayMap){
  dayMap=dayMap||{};
  const MONTHS_ZH=['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
  const MONTHS_EN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const monthName=lang==='zh'?`${yr}年${MONTHS_ZH[mo]}`:MONTHS_EN[mo]+' '+yr;
  const dayLabels=(lang==='zh'?['一','二','三','四','五','六','日']:['M','T','W','T','F','S','S'])
    .map(d=>`<div class="cal-day-label">${d}</div>`).join('');
  const first=new Date(yr,mo,1);
  let startDow=first.getDay(); // 0=Sun
  startDow=(startDow+6)%7; // shift so Mon=0
  const daysInMonth=new Date(yr,mo+1,0).getDate();
  const today=new Date(); const todayStr=`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
  let cells='';
  const _prevDays=new Date(yr,mo,0).getDate();
  for(let i=0;i<startDow;i++){ const _pd=_prevDays-startDow+1+i; cells+=`<div class="cal-day adjacent"><span class="cal-day-num">${_pd}</span></div>`; }
  for(let d=1;d<=daysInMonth;d++){
    const dateStr=`${yr}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const hasShow=showDates.has(dateStr);
    const dtype=dayMap[dateStr];
    const isToday=dateStr===todayStr;
    const isPast=dateStr<todayStr;   // [v3.8.42] 过去的日期：灰显且不可点(不可编辑)
    const cls=['cal-day', hasShow?'has-show':'', isToday?'today':'', isPast?'past':''].filter(Boolean).join(' ');
    // 演出日用原蓝点；行程日用对应类型色点
    const _meta=hasShow?dayTypeMeta('show'):(dtype?dayTypeMeta(dtype):null);
    const dot=_meta?`<div class="cal-dot" style="background:${_meta.color}"></div>`:'';
    const _lbl=_meta?`<div class="cal-lbl" style="color:${_meta.color}">${lang==='zh'?_meta.zh.replace(/日$/,''):_meta.en}</div>`:'';
    const click=isPast?'':`onclick="calDayClick('${dateStr}')"`;
    cells+=`<div class="${cls}" ${click} title="${isPast?'已过去·不可编辑':(_meta?_meta.zh:'')}"><span class="cal-day-num">${d}</span>${dot}${_lbl}</div>`;
  }
  const _tot=startDow+daysInMonth; const _trail=(7-_tot%7)%7;
  for(let _t=1;_t<=_trail;_t++){ cells+=`<div class="cal-day adjacent"><span class="cal-day-num">${_t}</span></div>`; }
  return `<div class="cal-month"><div class="cal-header"><h4>${monthName}</h4></div>
  <div class="cal-grid">${dayLabels}${cells}</div></div>`;
}

function buildVenueSelectHTML(idx, city, selectedVenue, dis){
  const venues = VENUE_DB[city];
  if(!venues || !venues.length){
    return `<input id="sh-venue-${idx}" value="${esc(selectedVenue||'')}" oninput="onShowField(${idx},'venue',this.value)" ${dis}>`;
  }
  let html = `<select id="sh-venue-${idx}" onchange="onVenueSelect(${idx},this.value)" ${dis}><option value="">— 选择场馆 —</option>`;
  // [v3.8.33] 去除 st 星标；有场租场馆在前，无场租(待更新)排末尾，中间加分割线
  const _hasRent = v => !!(v.rf||v.rs||v.ru||v.rw);
  const _opt = v => `<option value="${esc(v.n)}" ${v.n===selectedVenue?'selected':''}>${esc(v.n)} (${v.c}人)</option>`;
  venues.filter(_hasRent).forEach(v=>{ html += _opt(v); });
  const _noRent = venues.filter(v=>!_hasRent(v));
  if(_noRent.length){
    html += `<option disabled>──────── 以下需更新数据 ────────</option>`;
    _noRent.forEach(v=>{ html += _opt(v); });
  }
  html += `<option value="__other__">手动输入…</option></select>`;
  return html;
}

// Calculate ticket counts for all tiers (each tier has its own capCount)
function calcTierCounts(sh){
  // Sellable = Total Tickets(库存) − 锁票 − 预留 − 公关票（模板口径）。demo 票档无 K/H/C → 等于库存，基线不变。
  const tiers=sh.tiers||[];
  return tiers.map(t=>(t.sellable!==undefined&&t.sellable!=='')?Math.max(0,+t.sellable):Math.max(0,(t.capCount||0)-(t.kills||0)-(t.holds||0)-(t.comps||0)));
}

    bodyHtml=`
  <div class="notice notice-blue">主办成本合计：<b id="s4-promoterCost">${fmtY(r.promoterCost)}</b> &nbsp;|&nbsp; 艺人方成本：<b id="s4-artistCost">${fmtY(r.artistCost)}</b>

  <div style="font-size:17px;font-weight:700;color:#2d3a8c;margin:8px 0 12px">运营成本</div>
${groups}
<div style="margin-top:14px;font-size:12px;color:#888;border-top:1px dashed #e6e8f2;padding-top:10px">🎤 本场 P&L（票房 / 保底 / 分成 / 盈亏平衡 / 净票房随上座率）见第5步「损益结果」的<b>本场 P&L 大卡</b>。</div>`;
  }
  const _ac=state.activeCost; let _sd='', _sl='';
  if(_ac.k==='logi' && state.logiDays[_ac.i]){ const _ld=state.logiDays[_ac.i]; _sd=(_ld.date||'')+getWeekday(_ld.date); _sl=esc(logiTitle(_ld)); }
  else { const _si=(_ac.k==='show')?_ac.i:(state.activeShowIdx||0); const _s=state.shows[_si]||state.shows[0]; if(_s){ _sd=(_s.date||'')+getWeekday(_s.date); _sl='🎤 演出日：'+esc(_s.city||'')+(_s.venue?' · '+esc(_s.venue):''); } }
  const _mt=(_ac.k==='logi' && state.logiDays[_ac.i])?dayTypeMeta(state.logiDays[_ac.i].type):dayTypeMeta('show');
  const stickyBar=(_ac.k==='logi')?'':`<div style="position:sticky;top:96px;z-index:6;display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;border:1px solid #d8dbe8;border-left:5px solid ${_mt.color};border-radius:6px;padding:8px 12px;margin-bottom:10px"><span style="background:${_mt.color};color:#fff;font-weight:700;font-size:12px;padding:4px 10px;border-radius:6px;white-space:nowrap">${_sd}</span><span style="font-weight:700;color:#1a1a2e;font-size:14px">${_sl}</span></div>`;

<div class="card">
  <div class="show-tabs">${tabs}</div>

}
function ensureActiveCost(){
  if(!state.activeCost) state.activeCost={k:'show',i:state.activeShowIdx||0};
  const ac=state.activeCost;
  if(ac.k==='show' && ac.i>=(state.shows||[]).length) state.activeCost={k:'show',i:0};
  if(ac.k==='logi' && ac.i>=(state.logiDays||[]).length) state.activeCost={k:'show',i:0};
  if(!(state.shows||[]).length && (state.logiDays||[]).length && state.activeCost.k==='show') state.activeCost={k:'logi',i:0};
}
function setActiveCost(k,i){ state.activeCost={k,i:+i}; if(k==='show') state.activeShowIdx=+i; render(); }
function logiTabLabel(ld){
  const m=dayTypeMeta(ld.type);
  if(ld.type==='landing') return m.icon+' '+(ld.city||'落地');
  if(ld.type==='departure') return m.icon+' '+(ld.city||'离境');
  if(ld.type==='travel')  return m.icon+' '+(ld.fromCity||'?')+'→'+(ld.toCity||'?');
  if(ld.type==='media')   return m.icon+' '+(ld.keyword||'媒体');
  if(ld.type==='rest')    return m.icon+' '+(ld.keyword||'休息');
  if(ld.type==='soundcheck') return m.icon+' '+(ld.keyword||'试音');
  return m.icon+' '+(ld.city||'');
}

function renderCostLine(item, sh, showIdx, dis){
  const c=sh.costs[item.key]||{amount:0,unitPrice:0,quantity:1,resp:item.resp};
  const lbl=lang==='zh'?item.zh:item.en;
  const isP=c.resp==='promoter', isA=c.resp==='artist', isV=c.resp==='venue';
  const splitInfo=getCostSplitInfo(item.key, c.amount, sh.capacity, state.bandSize);
  const splitHint=splitInfo?`<span class="cost-line-ref">${splitInfo}</span>`:'';
  const unitLabel=item.unit==='per_ticket'?`(${lang==='zh'?'每张':'per ticket'})`:item.unit==='pct_gross'?`(% of gross)`:item.unit==='pct_expense'?`(% of exp)`:'';
  const respBtns=`<div class="resp-toggle">
    <button class="${isP?'rp':''}" onclick="onCostResp(${showIdx},'${item.key}','promoter')" ${dis}>${t('respLocal')}</button>
    <button class="${isA?'ra':''}" onclick="onCostResp(${showIdx},'${item.key}','artist')" ${dis}>${t('respArtist')}</button>
    <button class="${isV?'rv':''}" onclick="onCostResp(${showIdx},'${item.key}','venue')" ${dis}>${t('respVenue')}</button>
  </div>`;

  // [v3.7.18] per diem 四项由「人员与餐标」表驱动 → 只读展示（单价=餐标·数量=人数·金额=单价×数量）
  if(PEOPLE_BY_PD_ITEM[item.key]){
    const u=c.unitPrice||0, q=c.quantity||0, a=c.amount||0;
    const ro='disabled style="background:#f3f4f8;color:#777;cursor:not-allowed" title="在「项目信息 › 人员与餐标」修改"';
    const subhint = item.key==='crew_meals'
      ? '(餐标×人数·每场；行程日餐补在各行程日卡)'
      : '(餐标×人数 · 随人员表)';
    return `<div class="cost-line">
  <div style="flex:1;min-width:120px"><div class="cost-line-label">${esc(lbl)} <span class="text-muted">${subhint}</span></div></div>
  <input type="number" value="${u||''}" placeholder="${curSym()}0.00" ${ro}>
  <input type="number" value="${q||''}" placeholder="0" ${ro}>
  <input type="number" value="${a||''}" placeholder="0" ${ro}>
  
</div>`;
  }

  // 按人头：单价(¥/人) × 人数 = 金额（签证 / 安保）。优先于其他特殊布局。
  if(item.perHead){
    const up=c.unitPrice>0?c.unitPrice:'';
    const qty=c.quantity>0?c.quantity:'';
    const headLabel=item.headLabel||'人数';
    // [v3.8.2] 一次性巡演成本（签证）：金额 = 单价×人数 ÷ 场数。行内展示摊销过程，金额只读（由单价/人数驱动）。
    const fullAmt=(c.unitPrice||0)*(c.quantity||0);
    const nShows=(state.shows||[]).length||1;
    const showAmort=!!AMORTIZE_TOUR_KEYS[item.key] && fullAmt>0;
    const amortNote=showAmort
      ? `<div class="cost-line-ref">一次性：全程 ${cm(fullAmt)} ÷ ${nShows} 场 = ${cm(Math.round(fullAmt/nShows))}/场（计入本场）</div>`
      : '';
    const headExtra=showAmort?' ÷ 场数':'';
    // [v3.8.18] 安保费率默认提示：场馆无 sf → 默认 ¥300/人，打 * 提醒用户核实
    const _rateDefaulted = item.key==='police' && c._rateDefaulted && !c._userEdited;
    const defStar = _rateDefaulted ? `<span style="color:#c2410c;font-weight:700" title="数据库无该场馆安保费率，已采用默认 ¥300/人，请核实">*</span>` : '';
    const defRef = _rateDefaulted ? `<div class="cost-line-ref" style="color:#c2410c">* 数据库未登记该场馆安保费率，默认 ¥300/人（请核实）</div>` : '';
    const amtRO=showAmort?'disabled style="background:#f3f4f8;color:#777;cursor:not-allowed"':dis;
    const amtTitle=showAmort
      ? `全程 ${fmt(c.unitPrice||0)}/人 × ${fmt(c.quantity||0)} = ${cm(fullAmt)} ÷ ${nShows}场 = ${cm(Math.round(fullAmt/nShows))}/场（一次性成本自动摊销·只读，改单价/人数即可）`
      : `${fmt(c.unitPrice||0)}/人 × ${fmt(c.quantity||0)} = ${fmt(fullAmt)}`;
    return `<div class="cost-line">
  <div style="flex:1;min-width:120px"><div class="cost-line-label">${esc(lbl)}${defStar} <span class="text-muted">(¥/人 × ${headLabel}${headExtra})</span></div>${splitHint}${amortNote}${defRef}</div>
  <input type="number" id="unit-${showIdx}-${item.key}" placeholder="${curSym()}0.00" value="${mIn(up)}" min="0" step="10" ${dis} oninput="onCostUnit(${showIdx},'${item.key}',mWr(this.value))">

function _backendBonus(sh,r,o,_amort,occPct){

// ══ [v3.8.215] 资金流预测时间轴 Cash Flow Timeline ══
// 务实口径：金额全部来自现有 P&L 数据，不新增输入。时间规则（脚注展示）：
// 流出：保底按付款计划(默认演出前90天50%/前30天40%/演出日10%)；报批+签证=首演前permitDays(默认60)天；
//       场租30%订金=首演前45天、70%=各演出日；机票/货运=首演前21天；市场推广=首演前mktDays(默认14)天；
//       其余演出日成本=各演出日；行程日成本=行程日当日。
// 流入：每场票房回款=（净票房−平台费）×预期上座率，演出后7天(平台结算)；赞助=各演出日。
// WHT 为代扣代缴，不改变流出总额，不单列。
function _cfAddDays(ds,n){ const d=new Date(ds+'T00:00:00'); d.setDate(d.getDate()+n); const p=x=>String(x).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }   // [v3.8.225] 本地日期拼接：原 toISOString 在 UTC+8 会把所有资金流日期偏早一天
function _cfParsePlan(){
  const s=state.paymentPlan||''; const pre=[]; let showDayPct=0;
  const re=/(?:演出?前|T-)\s*(\d+)\s*天?\s*(\d+(?:\.\d+)?)\s*%/g; let m;
  while((m=re.exec(s))) pre.push({days:+m[1],pct:+m[2]});
  const md=s.match(/演出日\s*(\d+(?:\.\d+)?)\s*%/); if(md) showDayPct=+md[1];
  if(!pre.length&&!showDayPct){ pre.push({days:90,pct:50},{days:30,pct:40}); showDayPct=10; }
  return {pre,showDayPct};
}
function buildCashflow(){
  const tour=calcTour(); if(!tour||!(state.shows||[]).some(s=>s.date)) return null;
  const shows=state.shows.filter(s=>s.date).slice().sort((a,b)=>a.date<b.date?-1:1);
  const first=shows[0].date;
  const ev=[]; const add=(date,label,out,inn)=>{ if((out||0)<=0&&(inn||0)<=0) return; ev.push({date,label,out:out||0,inn:inn||0}); };
  const MKT=['digital_ads','offline_ads','kol','print','design','press_conf','mkt_other'];
  const FLY=['artist_airfare','band_airfare','artist_staff_airfare','crew_airfare','airfares','freight'];
  const amt=(sh,k)=>((sh.costs||{})[k]||{}).amount||0;
  // 保底
  const plan=_cfParsePlan(); const gua=tour.totGua||0;
  plan.pre.forEach(pp=>add(_cfAddDays(first,-pp.days),t('s3')+' '+pp.pct+'%',gua*pp.pct/100,0));
  if(plan.showDayPct){ const results=tour.results||[]; shows.forEach((sh,i)=>{ const g=(results[state.shows.indexOf(sh)]||{}).guaPerShow||gua/shows.length; add(sh.date,t('s3')+' '+plan.showDayPct+'%',g*plan.showDayPct/100,0); }); }
  // 报批+签证 / 机票货运 / 市场推广（跨场合并前置）
  let permits=0,fly=0,mkt=0;
  shows.forEach(sh=>{ permits+=amt(sh,'culture_permit')+amt(sh,'visa'); FLY.forEach(k=>fly+=amt(sh,k)); MKT.forEach(k=>mkt+=amt(sh,k)); });
  add(_cfAddDays(first,-(+state.permitDays||60)),'报批+签证',permits,0);
  add(_cfAddDays(first,-21),'机票+货运',fly,0);
  add(_cfAddDays(first,-(+state.mktDays||14)),'市场推广',mkt,0);
  // 场租 30/70
  let rentDep=0; shows.forEach(sh=>rentDep+=amt(sh,'venue_rent')*0.3);
  add(_cfAddDays(first,-45),'场租订金30%',rentDep,0);
  // 各演出日：场租70% + 其余成本 + 赞助流入
  const PREPAID={culture_permit:1,visa:1,venue_rent:1}; MKT.forEach(k=>PREPAID[k]=1); FLY.forEach(k=>PREPAID[k]=1);
  const results=tour.results||[];
  shows.forEach(sh=>{
    const i=state.shows.indexOf(sh); const r=results[i]||{};
    let day=amt(sh,'venue_rent')*0.7;
    Object.keys(sh.costs||{}).forEach(k=>{ if(!PREPAID[k]) day+=amt(sh,k); });
    add(sh.date,(sh.city||'')+' 演出日成本',day,0);
    if(r.sponsorship) add(sh.date,(sh.city||'')+' 赞助',0,r.sponsorship);
    const occ=(typeof getExpOcc==='function'?getExpOcc(sh):85)/100;
    const inflow=Math.max(0,((r.net||0)-(r.pfFee||0))*occ);
    add(_cfAddDays(sh.date,(+state.cfSettleDays||7)),(sh.city||'')+' 票务回款 · 预期'+Math.round(occ*100)+'%',0,inflow);   // [v3.8.226] 账期可编辑,命名去括号
  });
  // 行程日
  (state.logiDays||[]).forEach(ld=>{ if(!ld.date) return; const v=(typeof logiDayTotal==='function')?logiDayTotal(ld):0; add(ld.date,(ld.city||'')+' 行程日',v,0); });
  ev.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  let bal=0,peak=0,peakDate='',back=null;
  ev.forEach(e=>{ bal+=e.inn-e.out; e.bal=bal; if(bal<peak){peak=bal;peakDate=e.date;} });
  let seen=false; ev.forEach(e=>{ if(e.bal<0)seen=true; if(seen&&back===null&&e.bal>=0)back=e.date; });
  return {ev,peak,peakDate,back,end:bal};
}
// [v3.8.226] 回款前需预留资金：预算阶段唯一现金流数字 = 首笔票务回款前累计资金缺口峰值。构成按渠道分组，供向老板/财务解释口径。
function cfReserve(){
  if(typeof buildCashflow!=='function') return null;
  const cf=buildCashflow(); if(!cf||!cf.ev.length) return null;
  const fi=cf.ev.find(e=>e.inn>0);
  const total=Math.round(Math.abs(Math.min(0,cf.peak)));
  if(total<=0) return null;
  const MKT=['digital_ads','offline_ads','kol','print','design','press_conf','mkt_other'];
  const FLY=['artist_airfare','band_airfare','artist_staff_airfare','crew_airfare','airfares','freight'];
  const amt=(sh,k)=>(((sh.costs||{})[k]||{}).amount)||0;
  let venue=0,permit=0,flight=0,mkt=0;
  (state.shows||[]).forEach(sh=>{ venue+=amt(sh,'venue_rent'); permit+=amt(sh,'culture_permit')+amt(sh,'visa'); FLY.forEach(k=>flight+=amt(sh,k)); MKT.forEach(k=>mkt+=amt(sh,k)); });
  const artist=(calcTour()||{}).totGua||0;
  const exec=Math.max(0, total-artist-venue-permit-flight-mkt);
  return {total, cutoff:fi?fi.date:null, cat:{artist:Math.round(artist),venue:Math.round(venue),permit:Math.round(permit),flight:Math.round(flight),mkt:Math.round(mkt),exec:Math.round(exec)}};
}
function onCfSettleDays(v){ state.cfSettleDays=Math.max(0,Math.min(90,+v||7)); render(); }
function renderCashflowCard(){
  const cf=buildCashflow(); if(!cf||!cf.ev.length) return '';
  const maxAbs=Math.max(1,...cf.ev.map(e=>Math.abs(e.bal)));
  const rows=cf.ev.map(e=>{
    const w=Math.round(Math.abs(e.bal)/maxAbs*100);
    const barCol=e.bal<0?'#f87171':'#34d399';
    return `<tr><td style="white-space:nowrap">${e.date}</td><td>${esc(e.label)}</td><td style="text-align:right;color:#e05d6f">${e.out?cm(e.out):''}</td><td style="text-align:right;color:#2f9e6e">${e.inn?cm(e.inn):''}</td><td style="text-align:right;font-weight:600;color:${e.bal<0?'#e05d6f':'#2f9e6e'}">${cm(e.bal)}</td><td style="width:120px"><div style="height:8px;border-radius:4px;width:${w}%;background:${barCol}"></div></td></tr>`;
  }).join('');
  const chip=(lbl,val,col)=>`<div style="flex:1;min-width:150px;border:1.5px solid #c7d2fe;border-radius:10px;padding:10px 14px;background:#fafbff"><div style="font-size:11px;color:#888">${lbl}</div><div style="font-size:17px;font-weight:800;color:${col}">${val}</div></div>`;
  return `<div class="card" id="cashflow-card">
  <div style="font-weight:800;font-size:15px;margin-bottom:10px">💰 ${t('cfTitle')}</div>
  <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px">
    ${chip(t('cfPeak')+(cf.peakDate?' · '+cf.peakDate:''),cm(cf.peak),'#e05d6f')}
    ${chip(t('cfBack'),cf.back?cf.back:t('cfNever'),cf.back?'#2f9e6e':'#e05d6f')}
    ${chip(t('cfEnd'),cm(cf.end),cf.end>=0?'#2f9e6e':'#e05d6f')}
  </div>
  <table class="tour-table" style="width:100%"><thead><tr><th>${t('cfDate')}</th><th>${t('cfEvent')}</th><th style="text-align:right">${t('cfOut')}</th><th style="text-align:right">${t('cfIn')}</th><th style="text-align:right">${t('cfBal')}</th><th></th></tr></thead><tbody>${rows}</tbody></table>
  <div style="font-size:11px;color:#aaa;margin-top:8px">口径：金额全部取自现有 P&L，不新增输入。保底按付款计划；报批+签证=首演前${(+state.permitDays||60)}天；场租30%订金提前45天、70%演出日；机票提前21天；推广提前${(+state.mktDays||14)}天；票房回款=（净票房−平台费）×预期上座率、演出后7天平台结算；WHT为代扣不改变流出总额。</div>
</div>`;
}

function renderS5(){
  if(!state.shows.length) return `<div class="section-header"><div class="section-num">5</div><div class="section-title">${t('s5')}</div></div><div class="card"><div class="text-muted" style="text-align:center;padding:20px">请先添加演出场次</div></div>`;

  const sh=state.shows[state.activeShowIdx];
  // [v3.8.143] 新项目：S5 = 巡演实时 P&L 汇总行 + 本场 P&L 大卡（前司口径整合：票房瀑布+保底/分成+回本+净票房随上座率）。
  if(true){   // [v3.8.206] demo 与系统同路径（旧 demo 专属 S5 布局废弃）
    // [v3.8.152] 删去 S5 顶部「巡演实时 P&L」汇总条——与右侧栏「巡演实时 P&L」卡完全重复。
    return `<div class="section-header"><div class="section-num">5</div><div class="section-title">${t('s5')}</div></div>
<div class="card">
  <div class="show-tabs">${tabs}</div>
  ${renderShowPnlBig(sh, state.activeShowIdx)}
  <div style="font-size:11px;color:#aaa;margin-top:2px">巡演合计见右侧「巡演实时 P&L」卡；多城 P&L 与关键条款见第6步「汇总方案」。</div>
</div>`;
  }
  const r= isDemo ? calcShow(sh) : calcShow(sh, 100);
  // [行程日口径统一] 非演出日(行程日)成本按场分摊→折进每场，全系统(矩阵/BOX OFFICE/损益卡)一致
  const _nShS5=(state.shows||[]).length||1;
  const _amortS5=(typeof calcTour==='function')?((((calcTour()||{}).extraCost)||0)/_nShS5):0;
  const promoterCostD=r.promoterCost+_amortS5;

function _loadScript(src){ return new Promise((res,rej)=>{ const sc=document.createElement('script'); sc.src=src; sc.onload=res; sc.onerror=rej; document.head.appendChild(sc); }); }
async function exportMemoImage(fmt){
  if(!(state.shows||[]).length) return;
  try{
    if(!window.html2canvas) await _loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
    if(fmt==='pdf'&&!(window.jspdf&&window.jspdf.jsPDF)) await _loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
  }catch(e){ alert(translate('导出组件需联网加载，请检查网络后重试；离线时可用「下载 HTML」。')); return; }
  const src=document.querySelector('#memo-content .dm-doc')||document.querySelector('#memo-content');
  if(!src) return;
  try{
    const canvas=await window.html2canvas(src,{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false});
    const name=((state.projectName||'memo').replace(/[\/:*?"<>|\s]+/g,'_'))+((state.memoTab||'internal')==='deal'?'_DealMemo':'_InternalMemo');
    if(fmt==='png'){
      const a=document.createElement('a'); a.download=name+'.png'; a.href=canvas.toDataURL('image/png'); a.style.display='none'; document.body.appendChild(a); a.click(); setTimeout(()=>a.remove(),1000);
      _exportToast('✅ PNG 已开始下载');
    } else {
      const pdf=new window.jspdf.jsPDF({unit:'pt',format:'a4'});
      const pw=pdf.internal.pageSize.getWidth(), ph=pdf.internal.pageSize.getHeight();
      const ih=canvas.height*pw/canvas.width;
      const img=canvas.toDataURL('image/jpeg',0.92);
      let off=0, page=0;
      while(off<ih){ if(page>0) pdf.addPage(); pdf.addImage(img,'JPEG',0,-off,pw,ih); off+=ph; page++; if(page>60) break; }
      pdf.save(name+'.pdf');
      _exportToast('✅ PDF 已开始下载');
    }
  }catch(e){
    if(fmt==='pdf'){ printMemoTab(); }
    else alert('PNG 导出失败；请先使用“下载 HTML”，打开后可截图或打印。');
  }
}

const GUA_TERMS_DEFAULT='Landed + Rider + Hotels + Ground';

function _termsCanon(v){ return String(v||'').toLowerCase().split('+').map(x=>x.trim()).filter(Boolean).sort().join('|'); }
function offerGridCols(sh){
  const o=state.offer||{};
  const g=Math.round(computeOffer(sh).guaCNY||0);
  const gt=sh.guaranteeType||'';
  const isBk=gt==='guarantee_backend';
  const tc=calcTierCounts(sh);
  const bi=(sh.tiers||[]).findIndex(t=>t.name===sh.beTier);
  const hasTierBackend=isBk&&bi>=0&&(+sh.beAmt||0)>0;
  const bePot=isBk?Math.round(hasTierBackend
    ? (+sh.beAmt||0)*Math.max(0,(tc[bi]||0)-(+sh.beSplit||0))
    : dmShowBonus(sh)):0;
  let beText='';
  if(isBk){
    if(hasTierBackend){ beText=(sh.beTier||'指定票档')+'：超 '+fmt(+sh.beSplit||0)+' 张后 '+cm(+sh.beAmt||0)+'/张归艺人'; }
    else if(o.splitMode==='pct'){ beText='超起征点后净利 '+Math.max(0,100-(o.promoterPct||0))+'% 归艺人'; }
    else if((o.bonusPerTicket||0)>0){ const sp=(sh._splitTickets!=null&&sh._splitTickets!=='')?fmt(Math.round(+sh._splitTickets)):'—'; beText='超 '+sp+' 张后 '+cm(o.bonusPerTicket||0)+'/张归艺人'; }
    else beText='无 Backend 分成';
  }

    const urgency=(d)=>{const diff=(d-today)/86400000; return diff>30?'green':diff>15?'yellow':'red';};
    const badge=(d)=>{const _n=Math.round((d-today)/86400000);const _lab=_n<0?`${-_n} 天前`:`${_n} 天后`;return `<span class="deadline-badge badge-${urgency(d)}">${_lab}</span>`};   // [v3.8.234] #25 负数显 N天前
    // [v3.8.247/#26] 系统节点数组化，自定义节点（state.customDDL）合并按日期排序；日期列右对齐
    const sysNodes=[
      {n:'🔴 艺人必须 Approve Offer 截止', dt:approveDate},
      {n:'📋 报批资料提交截止', dt:prepDate},
      {n:'📨 文化报批递交', dt:permitDate},
      {n:'📢 预计官宣日', dt:announceDate},
      {n:'🎫 预计售票开始', dt:ticketsDate},
    ].map(x=>({n:x.n, d:x.dt.toISOString().slice(0,10), dt:x.dt, sys:true}));
    const cusNodes=(state.customDDL||[]).map((x,ci)=>({n:'📌 '+x.n, d:x.d, dt:new Date(x.d+'T00:00:00'), sys:false, ci}));
    const allNodes=sysNodes.concat(cusNodes).sort((a,b)=>(a.d||'').localeCompare(b.d||''));
    ddlContent=`
    <div class="notice notice-blue" style="margin-bottom:14px">最早演出：<b>${earliestShow.city} · ${earliestShow.date}${getWeekday(earliestShow.date)}</b></div>
    ${allNodes.map(x=>`<div class="deadline-row"><div class="deadline-label">${esc(x.n)}${x.sys?'':' <span style="font-size:10px;background:#eef2ff;color:#4f46e5;border-radius:8px;padding:1px 7px;font-weight:700">自定义</span>'}</div><div style="display:flex;gap:8px;align-items:center">${x.sys?'':`<span onclick="onDelCustomDDL(${x.ci})" style="color:#e64545;cursor:pointer;font-weight:700;padding:0 2px">✕</span>`}${badge(x.dt)}<span class="deadline-date" style="min-width:150px;text-align:right;display:inline-block">${x.d}${getWeekday(x.d)}</span></div></div>`).join('')}
    ${_pdfExpand?'':`<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid #e6e8f2">
      <input type="text" id="cddl-name" placeholder="节点内容，如：场馆押金付款截止" style="flex:1;min-width:200px;font-size:13px;padding:7px 11px;border:1.5px solid #c7d2fe;border-radius:8px">
      <input type="date" id="cddl-date" style="font-size:13px;padding:6px 9px;border:1.5px solid #c7d2fe;border-radius:8px;font-family:inherit">
      <button class="btn btn-primary btn-sm" onclick="onAddCustomDDL()">＋ 添加时间节点</button>
    </div>`}`;
  } else {
    ddlContent=`<div class="text-muted" style="padding:20px;text-align:center">请先添加演出日期</div>`;
  }
  return `
  <div class="form-grid g3" style="margin-bottom:16px">
    <div class="field"><label>${t('permitDays')}</label><input type="number" id="f-permit-days" value="${state.permitDays}" min="1" ${dis} onchange="state.permitDays=+this.value;rerenderS6()"></div>
    <div class="field"><label>${t('mktDays')}</label><input type="number" id="f-mkt-days" value="${state.mktDays}" min="1" ${dis} onchange="state.mktDays=+this.value;rerenderS6()"></div>
    <div class="field"><label>${t('prepDays')}</label><input type="number" id="f-prep-days" value="${state.prepDays}" min="1" ${dis} onchange="state.prepDays=+this.value;rerenderS6()"></div>
  </div>
  ${ddlContent}`;
}

function hotelTierFor(k){
  if(state.hotelSameHotel!==false) return state.hotelGlobalTier||'mid';

function applyPeopleHotel(sh){

const TRAVEL_ITEM_PEOPLE={artist_airfare:'artist',band_airfare:'band',artist_staff_airfare:'artistStaff',crew_airfare:'tourCrew',artist_train:'artist',band_train:'band',artist_staff_train:'artistStaff',crew_train:'tourCrew'};

const AIR_CABIN_PRICE={eco:800, biz:1900};

function ensureTravelClass(){
  if(!state.travelClass) state.travelClass={airCabin:'eco',trainSeat:'second',groundVehicle:'coach'};

}

// [v3.8.235/#11] 出行方式默认空（不勾选=本场不计交通）；旧档兼容：无显式值时按已有机票/高铁数量推断

    if(item._userEdited) return;                   // 整行手改过→不动（可单腿混搭）
    const mode=travelMode(ck), k=TRAVEL_ITEM_PEOPLE[ck];

function bindLiveInputs(){
  // [v3.7.7] 数字输入框聚焦时自动全选——首次输入即替换默认值（0/1/任意），根治"默认1时输 4 变 14""默认 0"等问题。事件委托，只挂一次。
  if(!window.__numSelectBound){
    window.__numSelectBound=true;
    document.addEventListener('focusin',e=>{
      if(window.__progFocus) return;   // [v3.8.128] 程序化还原焦点(render)时不全选——否则 type=number 多位输入会被清成最后一位
      const el=e.target;
      if(el && el.tagName==='INPUT' && (el.type==='number' || el.getAttribute('inputmode')==='numeric')){ try{ el.select(); }catch(_){ } }   // [v3.8.135] 含定价框(type=text inputmode=numeric)
    });
    // [v3.8.80] 防滚轮改数字 + 修 Magic Mouse 误触失焦：不再 blur(否则需重新点击)，改 preventDefault 阻止改值，并手动滚页、保持焦点
    document.addEventListener('wheel',e=>{
      const el=document.activeElement;
      if(el && el.tagName==='INPUT' && el.type==='number' && el===e.target){
        e.preventDefault();
        if(window.scrollBy) window.scrollBy(0, e.deltaY||0);
      }
    },{passive:false});
    // [v3.8.162] 「改错即还原」：聚焦任一输入框时快照其进入时的值；成本格额外快照整格状态(含锁)。
    // 按 ⌘/Ctrl+Z 或 Esc → 把这一格还原到刚点进去时的值，成本格同时解掉「已手改」锁。
    const _COST_ID=/^(unit|qty|amt|hrate|hrooms|rate)-(\d+)-(.+)$/;
    document.addEventListener('focusin',e=>{
      const el=e.target;
      if(!el||(el.tagName!=='INPUT'&&el.tagName!=='TEXTAREA')) return;
      el.__preVal=el.value;
      const m=(el.id||'').match(_COST_ID);
      const c=m&&state.shows&&state.shows[+m[2]]&&state.shows[+m[2]].costs&&state.shows[+m[2]].costs[m[3]];

// #7: 全局默认票价 → 按票档名称应用到所有场次（手动改过的票档不覆盖）
// [v3.8.252] 统一票档模型：globalTiers = 单一有序数组（P1↓）。首次从旧的 globalPrices{fast/ga/vip} 迁移出核心三档；
// globalPrices 降级为「派生镜像」，只为让下游（新场次默认价 applyGlobalTicketPrices / addShow）继续按名称联动，不再是编辑源。
function ensureGlobalTiers(s){
  if(!Array.isArray(s.globalTiers)) s.globalTiers=[];
  if(!s._giMig){
    const gp=s.globalPrices||{};
    const core=[
      {name:'快通票', price:(gp.fast===''||gp.fast==null)?'':+gp.fast},
      {name:'全价票', price:(gp.ga===''  ||gp.ga==null)  ?'':+gp.ga},
      {name:'VIP',    price:(gp.vip===''||gp.vip==null)?'':+gp.vip}
    ];
    const have=new Set(s.globalTiers.map(t=>(t.name||'').trim()));
    const prepend=core.filter(c=>!have.has(c.name));   // 已存在同名则不重复
    s.globalTiers=prepend.concat(s.globalTiers);
    s._giMig=true;
  }
  mirrorGlobalPrices(s);
}
function mirrorGlobalPrices(s){
  const gp=s.globalPrices||(s.globalPrices={fast:'',ga:'',vip:''});
  gp.fast=''; gp.ga=''; gp.vip='';
  (s.globalTiers||[]).forEach(t=>{ const n=t.name||''; if(t.price===''||t.price==null) return;
    if(/vip/i.test(n)){ if(gp.vip==='') gp.vip=+t.price; }
    else if(/快通|fast/i.test(n)){ if(gp.fast==='') gp.fast=+t.price; }
    else if(/全价|\bga\b/i.test(n)){ if(gp.ga==='') gp.ga=+t.price; }
  });
}
// [v3.8.55] 全局自定义票档：在「票价与票档」卡 + 号添加，自动下发到所有演出日的票档表，计入收益。
function syncGlobalCustomTiers(){
  const gts=(state.globalTiers||[]).filter(gt=>(gt.name||'').trim());
  (state.shows||[]).forEach(sh=>{
    if(!Array.isArray(sh.tiers)) sh.tiers=[];
    gts.forEach(gt=>{
      const nm=gt.name.trim();
      let tr=sh.tiers.find(t=>t.name===nm);
      if(!tr){ tr={name:nm, price:'', capCount:'', occ:85}; sh.tiers.push(tr); }
      if(!tr._priceEdited && gt.price!==''&&gt.price!=null) tr.price=+gt.price;
    });
  });
}
function addGlobalTier(){ if(!Array.isArray(state.globalTiers)) state.globalTiers=[]; state.globalTiers.push({name:'', price:''}); state._giMig=true; syncGlobalCustomTiers(); mirrorGlobalPrices(state); recompute(); render(); }
function onGlobalTierField(i,field,val){
  const gt=(state.globalTiers||[])[i]; if(!gt) return;
  if(field==='name'){ const old=gt.name; gt.name=val; (state.shows||[]).forEach(sh=>{ const t=(sh.tiers||[]).find(x=>x.name===old); if(t) t.name=val; }); }
  else gt[field]=val;
  syncGlobalCustomTiers(); mirrorGlobalPrices(state); recompute();
}
function removeGlobalTier(i){ const gts=state.globalTiers||[]; const gt=gts[i]; if(!gt) return; const nm=gt.name; gts.splice(i,1); (state.shows||[]).forEach(sh=>{ sh.tiers=(sh.tiers||[]).filter(t=>t.name!==nm); }); mirrorGlobalPrices(state); recompute(); render(); }
function applyGlobalTicketPrices(force){
  const gp=state.globalPrices||{};
  const pick=(name)=>{
    if(/vip/i.test(name)) return gp.vip;
    if(/快通|fast\s*pass|fastpass/i.test(name)) return gp.fast;
    if(/全价|\bga\b/i.test(name)) return gp.ga;
    return undefined; // 不识别的票档名不动
  };
  (state.shows||[]).forEach(sh=>{
    (sh.tiers||[]).forEach(tr=>{
      if(tr._priceEdited && !force) return;       // 城市手动改过的不覆盖
      const v=pick(tr.name||'');
      if(v!==undefined && v!==''){ tr.price=+v; if(force) tr._priceEdited=false; }
    });
  });
  if(state.shows.length){ rerenderSection(1); recomputeCalc(); }
}

const USER_VENUE_KEY='qpnl_user_venues';
function loadUserVenues(){
  try{

    const uv=JSON.parse(raw)||{};
    Object.keys(uv).forEach(city=>{
      if(!VENUE_DB[city]) VENUE_DB[city]=[];
      uv[city].forEach(v=>{ if(!VENUE_DB[city].some(x=>x.n===v.n&&x._diy)){ v._diy=true; VENUE_DB[city].push(v); } });
    });
  }catch(e){}
}
function saveUserVenue(city, v){
  try{
    if(typeof localStorage!=='undefined'){
      const uv=JSON.parse(localStorage.getItem(USER_VENUE_KEY)||'{}');
      if(!uv[city]) uv[city]=[];
      const i=uv[city].findIndex(x=>x.n===v.n); const clean=Object.assign({},v); delete clean._diy;
      if(i>=0) uv[city][i]=clean; else uv[city].push(clean);
      localStorage.setItem(USER_VENUE_KEY, JSON.stringify(uv));
