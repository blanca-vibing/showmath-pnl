// 切换艺人级别：按级别回填 Budget 默认房间数，并对所有演出重新拉取（未手改的行）
function onLevelChange(level){
  state.artistLevel=level;
  // 房间数按级别回到默认（Livehouse 艺6/随3 · Arena 艺10/随5）
  if(state.budget){
    state.budget.artistRooms=DBV3.rooms[level].artist;
    state.budget.crewRooms=DBV3.rooms[level].crew;
  }
  (state.shows||[]).forEach(s=>applyAutoPullV3(s, s.city));
  render();
}

// 把当前激活场次的全部成本复制到其他所有演出（一键，尊重精简组）
function copyActiveShowToAll(){
  const src=state.shows[state.activeShowIdx]; if(!src) return;
  state.shows.forEach((sh,i)=>{
    if(i===state.activeShowIdx) return;
    activeCostGroups().forEach(g=>g.items.forEach(item=>{
      if(sh.costs[item.key] && src.costs[item.key]) sh.costs[item.key]={...src.costs[item.key]};
    }));
  });
  render();
}

function applyVenueRef(sh, city, venueIdx){
  if(!city||city==='__other__'||venueIdx===''||venueIdx==='__other__') return;
  const v=(VENUE_DB[city]||[])[parseInt(venueIdx)];
  if(!v) return;
  // Auto-fill venue_rent using day-of-week logic
  const rent=getVenueRent(v, sh.date);
  if(rent) safeSetCost(sh, 'venue_rent', rent);
  // [v3.8.19] 周末场租回退提示：场馆无周六(rs)/周日(ru)价 → 沿用周五价(rf)，打 * 提醒用户核实
  {
    const _dow = sh.date ? new Date(sh.date+'T00:00:00').getDay() : -1;
    const _weekendFellBackToFri = (((_dow===6 && !(v.rs>0)) || (_dow===0 && !(v.ru>0))) && (v.rf>0));
    if(sh.costs.venue_rent && !sh.costs.venue_rent._userEdited) sh.costs.venue_rent._rentFallback = _weekendFellBackToFri;
  }
  // Approval fee from venue DB
  // [v3.8.32] 文化报批分国内/涉外：涉外(非中国籍)一律默认 ¥3000(DBV3.mocPermit)，无视场馆 af(af 为国内报批价)；中国籍用场馆 af，无 af 则 0。均尊重手改。
  if(state.artistNationality && state.artistNationality!=='cn'){
    safeSetCost(sh, 'culture_permit', DBV3.mocPermit);   // 涉外默认 ¥3000（可手改）
  } else if(v.af){
    safeSetCost(sh, 'culture_permit', v.af);              // 中国籍：用场馆国内报批价
  } else {
    safeSetCost(sh, 'culture_permit', 0);                 // 中国籍·场馆无 af → 0
  }
  // Security from venue DB
  // [v3.8.18] 安保 Police/Bao'an：人数 = 容量 ÷ 100（100:1）。单价优先用场馆登记的安保费率 sf（元/人，自动拉取，和场租同理）；数据库无 sf → 默认 ¥300/人 并打 * 提示用户核实。尊重手改。已删 场地安保 重复项。
  {
    const _secHasRate = (v.sf!=null && v.sf>0);
    const _secRate = _secHasRate ? v.sf : 300;
    setPerHead(sh, 'police', _secRate, Math.max(1, Math.floor((sh.capacity||0)/100)));
    if(sh.costs.police && !sh.costs.police._userEdited) sh.costs.police._rateDefaulted = !_secHasRate;
  }
  // Insurance: 0 for livehouse (cap < 5000)
  safeSetCost(sh, 'insurance', DBV3.insurance[state.artistLevel||'Livehouse']||4000);   // [v3.8.21] 保险默认¥4,000（取消原 <5000→0 强制）
  // Wristband: 单价¥0.24 × 场地容量
  setUnitQty(sh, 'wristband', 0.24, sh.capacity||0);
  
  // [v3.7.22] 酒店四类由人员表 + 各类档次（全局设置）驱动；弹窗不再问档次/房间数
  applyPeopleHotel(sh);
  // [v3.7.35] 地面交通不再由弹窗写入（块已删）；由用户在地面交通行手动选车型
}

  id('dt-buttons').innerHTML=translate(DAY_TYPES.map(dt=>`

function chooseDayType(type){
  closeModal('daytype-modal');
  if(type==='show'){
    id('asm-date-display').textContent=_pendingShowDate+getWeekday(_pendingShowDate);
    initCitySelect();
    openModal('add-show-modal');

  }

function addLogiDay(dateStr, type){
  if(!state.logiDays) state.logiDays=[];
  // 默认沿用最近一场演出的城市作参考
  const near=[...state.shows].filter(s=>s.date).sort((a,b)=>a.date.localeCompare(b.date))
    .reduce((best,s)=> (!best || Math.abs(new Date(s.date)-new Date(dateStr))<Math.abs(new Date(best.date)-new Date(dateStr)))?s:best, null);
  state.logiDays.push(newLogiDay(dateStr, type, near?near.city:''));
  state.logiDays.sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  state.activeCost={k:'logi',i:state.logiDays.findIndex(d=>d.date===dateStr)};   // [v3.7.54] 新行程日→激活其成本tab(在演出成本区)
  render();
}
function removeLogiDay(i){
  if(!state.logiDays||!state.logiDays[i]) return;
  state.logiDays.splice(i,1);
  render();
}
function onLogiType(i, type){
  const ld=state.logiDays[i]; if(!ld) return;
  ld.type=type; render();
}
function _ensureVehicles(ld){ if(!ld.vehicles||!ld.vehicles.length){ ld.vehicles=[{type:'coaster',price:(ld.ground&&ld.ground.amount)||0}]; } }
function onAddVehicle(i){ const ld=state.logiDays[i]; if(!ld) return; _ensureVehicles(ld); ld.vehicles.push({type:'coaster',price:0}); render(); }
function onRemoveVehicle(i,vi){ const ld=state.logiDays[i]; if(!ld||!ld.vehicles) return; ld.vehicles.splice(vi,1); if(!ld.vehicles.length) delete ld.vehicles; render(); }
function onVehicleField(i,vi,field,val){ const ld=state.logiDays[i]; if(!ld) return; _ensureVehicles(ld); if(field==='type'){ ld.vehicles[vi].type=val; const vt=VEHICLE_TYPES.find(t=>t.k===val); if(vt && !ld.vehicles[vi]._priceEdited) ld.vehicles[vi].price=vt.price; } else if(field==='price'){ ld.vehicles[vi].price=val; ld.vehicles[vi]._priceEdited=true; } render(); }
function onLogiCost(i, group, field, val){
  const ld=state.logiDays[i]; if(!ld||!ld[group]) return;
  ld[group][field]=val;
  if(group==='hotel'){ const h=ld.hotel; h.amount=(h.rate||0)*(h.rooms||0)*(h.nights||0); if(field==='rate'||field==='rooms') ld.hotel._userEdited=true; }
  if(group==='ground' && field==='amount'){ ld.ground._userEdited=true; }   // [v3.7.52] 手改金额→不再自动派生
  render();
}
function onTransfer(i, which, val){   // [v3.8.26/#9] 送机/接机分开，各自手改即固定(sticks)
  const ld=state.logiDays[i]; if(!ld) return;
  if(!ld.transfer) ld.transfer={dropoff:0,pickup:0};
  ld.transfer[which]=val; ld.transfer[which+'Edited']=true;
  render();
}
// [v3.8.14/#10] 行程日 每日酒店 档次/合住 覆盖（空档次=跟随全局）。改档次/合住→恢复自动派生覆盖手填，再同步。

function confirmAddShow(){
  if(!_pendingShowDate) return;
  const citySelVal=id('asm-city-sel').value;
  const city=(citySelVal==='__other__'||!citySelVal)
    ? id('asm-city-manual').value.trim()
    : citySelVal;
  const venueSelVal=id('asm-venue-sel').value;
  let venue='';
  if(venueSelVal==='__other__'||!venueSelVal){
    venue=id('asm-venue-manual').value.trim();
  } else if(citySelVal&&citySelVal!=='__other__'){
    const v=(VENUE_DB[citySelVal]||[])[parseInt(venueSelVal)];
    venue=v?v.n:'';
  }
  const cap=parseInt(id('asm-cap').value)||1000;
  const sh=newShow(_pendingShowDate, city, venue, cap);
  applyVenueRef(sh, citySelVal, venueSelVal);
  if(!isDemo) applyAutoPullV3(sh, city);   // Step2: 按 级别×城市×场馆 自动拉取 DB v3
  // #7/#8: 新场次套用全局默认票价与餐标（未手动改过的字段）
  const gp=state.globalPrices||{};
  (sh.tiers||[]).forEach(tr=>{
    const n=tr.name||'';
    let v; if(/vip/i.test(n))v=gp.vip; else if(/快通|fast/i.test(n))v=gp.fast; else if(/全价|\bga\b/i.test(n))v=gp.ga;
    if(v!==undefined&&v!=='') tr.price=+v;
  });
  // [v3.7.18] per diem 改由「人员与餐标」表驱动（syncPeoplePerDiem），新场次入列后由 render() 自动回填
  state.shows.push(sh);
  state.shows.sort((a,b)=>a.date.localeCompare(b.date));
  if(!isDemo) applyBacklineToAll();   // 场数变 → 每场 Backline 重新平摊（整场共用模式）
  if(!isDemo) amortizeTourCosts();    // [v3.8.2] 场数变 → 签证一次性成本重新 ÷场数 摊销
  state.activeShowIdx=state.shows.findIndex(s=>s.date===_pendingShowDate);
  closeModal('add-show-modal');

function dmAgg(){
  const ms=dmActive(); const n=ms.length;
  const dims=DM_DIMS.map(d=>{
    const vals=ms.map(m=>+m.scores[d.key]||0);
    const avg=n?vals.reduce((a,b)=>a+b,0)/n:0;
    const mx=n?Math.max(...vals):0, mn=n?Math.min(...vals):0;
    return {key:d.key,name:d.name,avg,spread:mx-mn,vals};
  });
  const overall=dims.length?dims.reduce((a,b)=>a+b.avg,0)/dims.length:0;
  const strong=dims.slice().sort((a,b)=>b.avg-a.avg)[0];
  const weak=dims.slice().sort((a,b)=>a.avg-b.avg)[0];
  const diverge=dims.slice().sort((a,b)=>b.spread-a.spread)[0];
  const avgSpread=dims.length?dims.reduce((a,b)=>a+b.spread,0)/dims.length:0;
  const vc={}; ms.forEach(m=>{ if(m.venue) vc[m.venue]=(vc[m.venue]||0)+1; });
  let venueMode='',venueN=0; Object.keys(vc).forEach(k=>{ if(vc[k]>venueN){venueN=vc[k];venueMode=k;} });
  return {n,dims,overall,strong,weak,diverge,avgSpread,venueMode,venueN};
}

  const pt=(i,v)=>{ const r=R*(v/5); return [cx+r*Math.cos(ang(i)), cy+r*Math.sin(ang(i))]; };
  let svg=`<svg viewBox="0 0 360 365" width="100%" style="max-width:380px">`;
  for(let ring=1;ring<=5;ring++){
    const pts=DM_DIMS.map((d,i)=>pt(i,ring).join(',')).join(' ');
    svg+=`<polygon points="${pts}" fill="none" stroke="#e6e8f2" stroke-width="1"/>`;
  }
  DM_DIMS.forEach((d,i)=>{
    const e=pt(i,5);
    svg+=`<line x1="${cx}" y1="${cy}" x2="${e[0]}" y2="${e[1]}" stroke="#e6e8f2" stroke-width="1"/>`;
    const lp=pt(i,5.78); let anc='middle';
    if(lp[0]>cx+8) anc='start'; else if(lp[0]<cx-8) anc='end';
    svg+=`<text x="${lp[0]}" y="${lp[1]+4}" font-size="11" font-weight="700" fill="#4f46e5" text-anchor="${anc}">${d.name}</text>`;
  });
  // 团队平均（除评估阶段外显示）
  if(!opt.meOnly){
    const avgPts=A.dims.map((d,i)=>pt(i,d.avg).join(',')).join(' ');
    svg+=`<polygon points="${avgPts}" fill="rgba(79,70,229,.22)" stroke="#4f46e5" stroke-width="2.5"/>`;
    A.dims.forEach((d,i)=>{ const p=pt(i,d.avg); svg+=`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#4f46e5"/>`; });
  }
  // 我的判断
  const me=DIAMOND.me;
  const myPts=DM_DIMS.map((d,i)=>pt(i,+me.scores[d.key]||0).join(',')).join(' ');
  if(opt.meOnly) svg+=`<polygon points="${myPts}" fill="rgba(14,165,164,.20)" stroke="#0ea5a4" stroke-width="2.5"/>`;
  else svg+=`<polygon points="${myPts}" fill="none" stroke="#0ea5a4" stroke-width="2" stroke-dasharray="5 3"/>`;
  svg+=`</svg>`;
  return svg;
}

function dmRound05(x){ return Math.round(x*2)/2; }              // 四舍五入到 0.5（IELTS 式总分）
function dmGate(){
  const A=dmAgg(); const th=DIAMOND.thresholds||{};
  const checks=A.dims.map(d=>{ const min=+th[d.key]||0; return {key:d.key,name:d.name,avg:d.avg,min,gated:min>0,pass:min<=0||d.avg>=min}; });
  const gated=checks.filter(c=>c.gated);
  const fails=gated.filter(c=>!c.pass);
  return {checks,gated,fails,hasGate:gated.length>0,pass:fails.length===0};
}
function dmSetThreshold(key,val){
  if(!DIAMOND.thresholds) DIAMOND.thresholds={};
  let v=parseFloat(val); if(isNaN(v)) v=0; v=Math.max(0,Math.min(5,v));
  DIAMOND.thresholds[key]=v;
  const sc=id('dm-scorecard-host'); if(sc) sc.innerHTML=dmScorecardHTML();
  const vh=id('dm-verdict-host'); if(vh) vh.innerHTML=dmVerdictHTML();
}
function dmScorecardHTML(){

function dmConclusionHTML(){
  const A=dmAgg(); if(A.n<2) return '<p>等待团队反馈中…</p>';
  const b=dmBand(A.overall);
  const cons=A.avgSpread<=1?'高度一致':A.avgSpread<=2?'基本一致、个别维度有分歧':'分歧明显';
  let p=`<p><span class="hl">${A.n} 位</span>参与者（你 + 团队 ${A.n-1} 人）完成评估。综合售票潜力 `;
  p+=`<span class="hl">${A.overall.toFixed(2)}/5</span>，处于「${b.label}」区间。`;
  p+=`最强维度是<span class="hl">「${A.strong.name}」（${A.strong.avg.toFixed(1)}）</span>，`;
  p+=`最弱维度是<span class="hl">「${A.weak.name}」（${A.weak.avg.toFixed(1)}）</span>。`;
  if(A.diverge.spread>=2) p+=`团队在<span class="warn">「${A.diverge.name}」上分歧最大（分差 ${A.diverge.spread}）</span>，建议在此维度补充调研后再下结论。`;
  else p+=`各维度看法${cons}。`;
  if(A.venueMode) p+=`多数人（${A.venueN}/${A.n}）建议场馆规模：<span class="hl">${A.venueMode}</span>。`;
  const g=dmGate();
  if(g.hasGate){
    if(g.pass) p+=`<br>🎯 <span class="hl">已通过设定的录用线</span>（${g.gated.map(c=>`${c.name}≥${c.min}`).join('、')} 全部达标）。`;
    else p+=`<br>🎯 <span class="warn">未通过录用线：${g.fails.map(f=>`${f.name} ${f.avg.toFixed(1)}低于门槛${f.min}`).join('、')}</span>——即便综合分尚可，也建议复议或暂缓。`;
  }
  p+=`<br><span style="color:#888">提示：本工具是集体判断的辅助，用来暴露共识与分歧、降低单人拍脑袋的偏差，并非精确票房预测。</span></p>`;
  return p;
}

function startTourFromLanding(){
  if(!isDemo && !state.projectName && state.shows.length===0){
    isDemo=true; state=getDemoState(); showApp(); renderApp();
  }
  startTour();
}

function startTour(){
  if(!isDemo && !state.projectName && state.shows.length===0){
    isDemo=true; state=getDemoState(); showApp(); renderApp();
  }
  tourActive=true; tourStep=0;
  document.getElementById('tour-overlay').classList.add('active');
  renderTourStep();
}

function closeTour(){
  tourActive=false;
  document.getElementById('tour-overlay').classList.remove('active');
  document.getElementById('tour-spotlight').style.cssText='';
  window.speechSynthesis && window.speechSynthesis.cancel();
}
// [v3.8.60] 按 ESC 也能退出新手教程（避免气泡跑到屏幕外时无法关闭）
document.addEventListener('keydown',function(e){ if(e.key==='Escape' && tourActive) closeTour(); });
// [v3.8.61/#1] 滚动/缩放时重新锚定高亮到目标元素（高亮跟住讲解对象，而不是随视口漂移）
window.addEventListener('scroll',function(){ if(tourActive && TOUR_STEPS[tourStep]) positionTour(TOUR_STEPS[tourStep]); },{passive:true});
window.addEventListener('resize',function(){ if(tourActive && TOUR_STEPS[tourStep]) positionTour(TOUR_STEPS[tourStep]); });

function tourGo(dir){
  const next = tourStep + dir;
  if(next < 0 || next >= TOUR_STEPS.length) return;
  tourStep = next;
  renderTourStep();
}

function tourToggleMute(){
  tourMuted = !tourMuted;
  document.getElementById('tour-mute').textContent = tourMuted ? '🔇' : '🔊';
  if(tourMuted) window.speechSynthesis && window.speechSynthesis.cancel();
}

function renderTourStep(){
  const step = TOUR_STEPS[tourStep];
  if(!step) return;

  // switch tab if needed
  if(step.switchTab && state.step7Tab !== step.switchTab){
    state.step7Tab = step.switchTab;
    rerenderS6();
  }

  // scroll
  if(step.scrollTo){
    const scrollEl = document.querySelector(step.scrollTo);
    if(scrollEl) scrollEl.scrollIntoView({behavior:'smooth', block:'center'});
  } else if(!step.selector){
    window.scrollTo({top:0, behavior:'smooth'});
  }

  // update bubble content
  document.getElementById('tour-title').textContent = step.title;
  document.getElementById('tour-body').textContent = step.body;
  document.getElementById('tour-count').textContent = `${tourStep+1} / ${TOUR_STEPS.length}`;
  document.getElementById('tour-prev').style.visibility = tourStep===0 ? 'hidden' : 'visible';
  document.getElementById('tour-next').textContent = tourStep===TOUR_STEPS.length-1 ? '完成' : '下一步 ›';
  if(tourStep===TOUR_STEPS.length-1){
    document.getElementById('tour-next').onclick = closeTour;
  } else {
    document.getElementById('tour-next').onclick = ()=>tourGo(1);
  }

  // position spotlight + bubble after scroll settles
  setTimeout(()=>positionTour(step), 400);

  // speech
  if(!tourMuted && window.speechSynthesis){
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(step.speech);
    u.lang = 'zh-CN'; u.rate = 0.9; u.pitch = 1;
    window.speechSynthesis.speak(u);
  }
}

let _tourRetry=0;
function positionTour(step){
  const spotlight = document.getElementById('tour-spotlight');
  const bubble = document.getElementById('tour-bubble');
  const pad = 10;

  if(step.selector){
    const el = document.querySelector(step.selector);
    const r0 = el && el.getBoundingClientRect();
    // [v3.8.61/#2] 目标元素未就绪(未找到/零尺寸)→重试，避免首次高亮错位
    if(!el || (r0.width===0 && r0.height===0)){
      if(_tourRetry++ < 8){ setTimeout(()=>{ if(tourActive) positionTour(step); }, 250); }
      return;
    }
    _tourRetry=0;
    {
      const r = r0;
      const top = Math.max(r.top - pad, 0);
      const left = Math.max(r.left - pad, 0);
      const w = Math.min(r.width + pad*2, window.innerWidth - left);
      const h = Math.min(r.height + pad*2, window.innerHeight - top);   // [v3.8.61/#3] 高亮高度不超出视口
      spotlight.style.cssText = `top:${top}px;left:${left}px;width:${w}px;height:${h}px;position:fixed;background:transparent;box-shadow:0 0 0 9999px rgba(0,0,0,.65);border-radius:8px;z-index:9982;pointer-events:none`;

      // position bubble: prefer below, fallback above
      const bubbleH = 200;
      let bTop, bLeft;
      if(top + h + 16 + bubbleH < window.innerHeight){
        bTop = top + h + 16;
      } else {
        bTop = Math.max(top - bubbleH - 16, 10);
      }
      bTop = Math.min(Math.max(bTop, 10), Math.max(10, window.innerHeight - 230));   // [v3.8.60] 气泡(含✕)始终留在视口内
      bLeft = Math.min(Math.max(left, 10), window.innerWidth - 340);
      bubble.style.cssText = `top:${bTop}px;left:${bLeft}px;position:fixed;z-index:9990;max-width:320px;width:90vw;pointer-events:all`;
      const below = bTop > top;
      bubble.className = below ? 'arr-up' : 'arr-down';
      const arrow=document.getElementById('tour-arrow');
      if(arrow){ let aL=(left + w/2) - bLeft - 9; aL=Math.max(14, Math.min(aL, 290)); arrow.style.left=aL+'px'; }
      return;
    }
  }
  // no target: center spotlight off, center bubble
  spotlight.style.cssText = 'display:none';
  bubble.className='';
  bubble.style.cssText = 'top:50%;left:50%;transform:translate(-50%,-50%);position:fixed;z-index:9990;max-width:340px;width:90vw;pointer-events:all';
}
