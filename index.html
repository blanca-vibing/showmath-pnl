// Helper: get venue rent based on day-of-week
function getVenueRent(v, dateStr){
  if(!v) return 0;
  if(!dateStr){return v.rw||v.rf||0;}
  const dow=new Date(dateStr+'T00:00:00').getDay(); // 0=Sun..6=Sat
  if(dow===5) return v.rf||v.rw||0;                 // Friday
  if(dow===6) return v.rs||v.rf||v.rw||0;           // Saturday (fallback rf)
  if(dow===0) return v.ru||v.rf||v.rw||0;           // Sunday (fallback rf)
  return v.rw||v.rf||0;                             // Mon-Thu
}
// Helper: find venue object by name in a city
function findVenueByName(city, venueName){
  if(!city||!venueName) return null;
  const list=VENUE_DB[city];
  if(!list) return null;
  return list.find(v=>v.n===venueName)||null;
}

// ── Step2: 按 艺人级别 × 城市 × 场馆 从 DB v3 自动拉取（新建项目/精简模型）──
// 只填未被用户手动改过的行（safeSetCost / _userEdited）。
function applyAutoPullV3(sh, city){
  if(!sh||!sh.costs) return;
  const hasDBcity = !!(city && VENUE_DB[city]);  // 仅限从场馆 DB 选中的城市
  if(!hasDBcity) return;   // [v3.7.28] 未选场馆 DB 城市 → 不自动填任何金额（不再塞 backline/buffer 等级别兜底值）
  const level=state.artistLevel||'Livehouse';
  applyPeopleHotel(sh);   // 演出当晚酒店四类（房间数=各类人数；房价=城市×档次）
  // [v3.7.35] 地面交通不再随城市自动填（无选择即出现金额的根因）；由用户在「地面交通」行选车型录入
  setUnitQty(sh,'wristband', DBV3.wristband, sh.capacity||0);   // [v3.7.30] 单价¥0.24 × 容量
  safeSetCost(sh,'insurance', DBV3.insurance[level]||4000);   // [v3.8.21] 保险默认¥4,000（Livehouse）
  // [v3.7.39] 票务佣金成本项已移除（平台抽成只在净票房公式 ×(1−平台费率−税) 扣一次，由「票务平台」下拉驱动）
  { const _blc=backlineLevelCost(); if(_blc!=null) safeSetCost(sh,'backline', _blc); }   // [v3.7.41] Backline 随制作级别
  // [v3.7.40] buffer 默认 0（不再随级别自动填 4000）；需要时手动填
  // [v3.7.28] 文化报批不再用级别默认（DBV3.mocPermit）；改由场馆 af 自动带出（applyVenueRef）
  const visaRate=(DBV3.visa[state.artistNationality]!==undefined?DBV3.visa[state.artistNationality]:DBV3.visa.other);
  setPerHead(sh,'visa', visaRate, (state.bandSize||0));
  // [v3.7.28] 安保改为随场馆 sf 自动带（applyVenueRef → 场地安保 sec_venue）；删掉 ¥400/人 × 容量/100 的通用估算
}
// 设置按人头成本（单价×人数），尊重 _userEdited
function setPerHead(sh, key, unit, qty){
  const c=sh.costs[key]; if(!c||c._userEdited) return;
  c.unitPrice=unit; c.quantity=qty;
  const ns=AMORTIZE_TOUR_KEYS[key]?((state.shows||[]).length||1):1;   // [v3.8.2] 签证一次性→÷场数
  c.amount=unit*qty/ns;
}

function setUnitQty(sh, key, unit, qty){
  const c=sh.costs[key]; if(!c||c._userEdited) return;
  c.unitPrice=unit; c.quantity=qty; c.amount=Math.round(unit*qty);
}

function applyVenueRef(sh, city, venueIdx, vObj){
  // [v3.8.216] vObj=空场馆模板对象（自定义场馆手填报价）→ 与库内场馆走同一条自动拉取链
  if(!vObj && (!city||city==='__other__'||venueIdx===''||venueIdx==='__other__')) return;
  const v=vObj || (VENUE_DB[city]||[])[parseInt(venueIdx)];
  if(!v) return;
  // Auto-fill venue_rent using day-of-week logic
  const rent=getVenueRent(v, sh.date);
  if(rent) safeSetCost(sh, 'venue_rent', rent);
  // [v3.8.19] 周末场租回退提示：场馆无周六(rs)/周日(ru)价 → 沿用周五价(rf)，打 * 提醒用户核实
  {
    const _dow = sh.date ? new Date(sh.date+'T00:00:00').getDay() : -1;
    const _weekendFellBackToFri = (((_dow===6 && !(v.rs>0)) || (_dow===0 && !(v.ru>0))) && (v.rf>0));
    if(sh.costs.venue_rent && !sh.costs.venue_rent._userEdited) sh.costs.venue_rent._rentFallback = _weekendFellBackToFri;
  }
  // Approval fee from venue DB
  // [v3.8.32] 文化报批分国内/涉外：涉外(非中国籍)优先用场馆涉外报批价 afx，无 afx 则默认 ¥3000(DBV3.mocPermit)；中国籍用场馆 af(国内价)，无 af 则 0。均尊重手改。[v3.8.253] 新增场馆 afx=涉外报批价(如福浪 3500)。
  if(state.artistNationality && state.artistNationality!=='cn'){
    safeSetCost(sh, 'culture_permit', (v.afx||DBV3.mocPermit));   // 涉外：场馆 afx 优先，无则默认 ¥3000（可手改）
  } else if(v.af){
    safeSetCost(sh, 'culture_permit', v.af);              // 中国籍：用场馆国内报批价
  } else {
    safeSetCost(sh, 'culture_permit', 0);                 // 中国籍·场馆无 af → 0
  }
  // Security from venue DB
  // [v3.8.18] 安保 Police/Bao'an：人数 = 容量 ÷ 100（100:1）。单价优先用场馆登记的安保费率 sf（元/人，自动拉取，和场租同理）；数据库无 sf → 默认 ¥300/人 并打 * 提示用户核实。尊重手改。已删 场地安保 重复项。
  {
    const _secHasRate = (v.sf!=null && v.sf>0);
    const _secRate = _secHasRate ? v.sf : 300;
    setPerHead(sh, 'police', _secRate, Math.max(1, Math.floor((sh.capacity||0)/100)));
    if(sh.costs.police && !sh.costs.police._userEdited) sh.costs.police._rateDefaulted = !_secHasRate;
  }
  // Insurance: 0 for livehouse (cap < 5000)
  safeSetCost(sh, 'insurance', DBV3.insurance[state.artistLevel||'Livehouse']||4000);   // [v3.8.21] 保险默认¥4,000（取消原 <5000→0 强制）
  // Wristband: 单价¥0.24 × 场地容量
  setUnitQty(sh, 'wristband', 0.24, sh.capacity||0);
  
  // [v3.7.22] 酒店四类由人员表 + 各类档次（全局设置）驱动；弹窗不再问档次/房间数
  applyPeopleHotel(sh);
  // [v3.7.35] 地面交通不再由弹窗写入（块已删）；由用户在地面交通行手动选车型
}

function pkgOverTixExp(sh){

function pkgAvgData(){

  const o=state.offer||{};
  let totGua=0, totBonus=0, totOver=0;
  shows.forEach(sh=>{

      else totBonus+=(o.bonusPerTicket||0)*over;

function dmActive(){ return [DIAMOND.me].concat(DIAMOND.team.filter(t=>t.submitted)); }
// ── 聚合（人人等权）──
function dmAgg(){
  const ms=dmActive(); const n=ms.length;
  const dims=DM_DIMS.map(d=>{
    const vals=ms.map(m=>+m.scores[d.key]||0);
    const avg=n?vals.reduce((a,b)=>a+b,0)/n:0;
    const mx=n?Math.max(...vals):0, mn=n?Math.min(...vals):0;
    return {key:d.key,name:d.name,avg,spread:mx-mn,vals};
  });
  const overall=dims.length?dims.reduce((a,b)=>a+b.avg,0)/dims.length:0;
  const strong=dims.slice().sort((a,b)=>b.avg-a.avg)[0];
  const weak=dims.slice().sort((a,b)=>a.avg-b.avg)[0];
  const diverge=dims.slice().sort((a,b)=>b.spread-a.spread)[0];
  const avgSpread=dims.length?dims.reduce((a,b)=>a+b.spread,0)/dims.length:0;
  const vc={}; ms.forEach(m=>{ if(m.venue) vc[m.venue]=(vc[m.venue]||0)+1; });
  let venueMode='',venueN=0; Object.keys(vc).forEach(k=>{ if(vc[k]>venueN){venueN=vc[k];venueMode=k;} });
  return {n,dims,overall,strong,weak,diverge,avgSpread,venueMode,venueN};
}

// ── 雷达图（六边形 1–5 五环；团队平均 + 我 对比）──
function dmRadarSVG(opt){
  opt=opt||{}; const A=dmAgg(); const cx=180,cy=175,R=125;
  const ang=i=>(-90+i*60)*Math.PI/180;
  const pt=(i,v)=>{ const r=R*(v/5); return [cx+r*Math.cos(ang(i)), cy+r*Math.sin(ang(i))]; };
  let svg=`<svg viewBox="0 0 360 365" width="100%" style="max-width:380px">`;
  for(let ring=1;ring<=5;ring++){
    const pts=DM_DIMS.map((d,i)=>pt(i,ring).join(',')).join(' ');
    svg+=`<polygon points="${pts}" fill="none" stroke="#e6e8f2" stroke-width="1"/>`;
  }
  DM_DIMS.forEach((d,i)=>{
    const e=pt(i,5);
    svg+=`<line x1="${cx}" y1="${cy}" x2="${e[0]}" y2="${e[1]}" stroke="#e6e8f2" stroke-width="1"/>`;
    const lp=pt(i,5.78); let anc='middle';
    if(lp[0]>cx+8) anc='start'; else if(lp[0]<cx-8) anc='end';
    svg+=`<text x="${lp[0]}" y="${lp[1]+4}" font-size="11" font-weight="700" fill="#4f46e5" text-anchor="${anc}">${d.name}</text>`;
  });
  // 团队平均（除评估阶段外显示）
  if(!opt.meOnly){
    const avgPts=A.dims.map((d,i)=>pt(i,d.avg).join(',')).join(' ');
    svg+=`<polygon points="${avgPts}" fill="rgba(79,70,229,.22)" stroke="#4f46e5" stroke-width="2.5"/>`;
    A.dims.forEach((d,i)=>{ const p=pt(i,d.avg); svg+=`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#4f46e5"/>`; });
  }
  // 我的判断
  const me=DIAMOND.me;
  const myPts=DM_DIMS.map((d,i)=>pt(i,+me.scores[d.key]||0).join(',')).join(' ');
  if(opt.meOnly) svg+=`<polygon points="${myPts}" fill="rgba(14,165,164,.20)" stroke="#0ea5a4" stroke-width="2.5"/>`;
  else svg+=`<polygon points="${myPts}" fill="none" stroke="#0ea5a4" stroke-width="2" stroke-dasharray="5 3"/>`;
  svg+=`</svg>`;
  return svg;
}
// ══ [v3.8.250] #3 双层重构：交互钻石图（唯一打分交互，滑条已删）══
// 点轴上刻度点或拖顶点打分，0.5 步进；顶点 r3.2 / 刻度 r2.4，十字光标防遮挡
const DM_DIA={CX:150,CY:152,RM:105};
let DM_DRAG=null;
function dmDiaPt(dims,i,v){ const a=(-90+i*(360/dims.length))*Math.PI/180, r=DM_DIA.RM*v/5; return [DM_DIA.CX+r*Math.cos(a), DM_DIA.CY+r*Math.sin(a)]; }
function dmDiaPoly(dims,scores){ return dims.map((d,i)=>dmDiaPt(dims,i,+scores[d.key]||0).map(n=>n.toFixed(1)).join(',')).join(' '); }
function dmDiaHTML(idSuf,dims,layers,inter,size,subDims){
  size=size||290;
  let s=`<svg id="dm-dia-${idSuf}" viewBox="0 0 300 300" width="${size}" height="${size}" style="flex:none;touch-action:none;user-select:none;max-width:100%${inter?';cursor:crosshair':''}"`+
    (inter?` onpointerdown="dmDiaDown(event,'${idSuf}')" onpointermove="dmDiaMove(event,'${idSuf}')" onpointerup="DM_DRAG=null" onpointerleave="DM_DRAG=null"`:'')+'>';
  for(let g=1;g<=5;g++){ s+=`<polygon points="${dims.map((d,i)=>dmDiaPt(dims,i,g).map(n=>n.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="#e9ecf6" stroke-width="1"/>`; }
  dims.forEach((d,i)=>{ const [x,y]=dmDiaPt(dims,i,5); s+=`<line x1="${DM_DIA.CX}" y1="${DM_DIA.CY}" x2="${x}" y2="${y}" stroke="#e9ecf6"/>`;
    const [lx,ly]=dmDiaPt(dims,i,subDims?6.2:6.05);
    if(subDims){ s+=`<text x="${lx}" y="${ly-5}" font-size="9.5" font-weight="700" fill="#0d9488" text-anchor="middle" dominant-baseline="middle">${d.name}</text>`+
      `<text x="${lx}" y="${ly+5.5}" font-size="8" font-weight="600" fill="#4f46e5" opacity=".75" text-anchor="middle" dominant-baseline="middle">${subDims[i].name}</text>`; }
    else { s+=`<text x="${lx}" y="${ly}" font-size="10.5" font-weight="600" fill="#666" text-anchor="middle" dominant-baseline="middle">${d.name}</text>`; }});
  if(inter){ dims.forEach((d,i)=>{ for(let g=1;g<=5;g++){ const[x,y]=dmDiaPt(dims,i,g); s+=`<circle cx="${x}" cy="${y}" r="2.4" fill="#fff" stroke="#c9cfe8" stroke-width="1"/>`; }}); }
  layers.forEach(L=>{
    s+=`<polygon points="${dmDiaPoly(dims,L.scores)}" fill="${L.fill||'none'}" stroke="${L.color}" stroke-width="2"${L.dash?' stroke-dasharray="5,4"':''}/>`;
    dims.forEach((d,i)=>{ const[x,y]=dmDiaPt(dims,i,+L.scores[d.key]||0); s+=`<circle cx="${x}" cy="${y}" r="${L.dash?2.4:3.2}" fill="${L.color}"/>`; });
  });
  return s+'</svg>';
}

// ── 推荐机制（透明三段式）：
// 1) 每层判断 = 个人 40% + 团队均值 60%
// 2) 模型分 = 艺人层 40% + 城市层 60%（艺人层权重可调）
// 3) 最终推荐 = 模型上座率 60% + 直接预测融合值 40%
function dmAggCity(city){
  const subs=dmActive(), team=DIAMOND.team.filter(t=>t.submitted), me=DIAMOND.me;
  const dimsA={},dimsB={}; let spreads=[];
  DM_DIMS.forEach(d=>{ const va=subs.map(m=>+m.scores[d.key]||0); dimsA[d.key]=va.length?va.reduce((a,b)=>a+b,0)/va.length:0; });
  DM_CDIMS.forEach(d=>{ const vb=subs.map(m=>+dmCd(m,city).s[d.key]||0); dimsB[d.key]=vb.length?vb.reduce((a,b)=>a+b,0)/vb.length:0;
    spreads.push({name:d.name,sp:vb.length?Math.max(...vb)-Math.min(...vb):0}); });
  const avg=(arr)=>arr.length?arr.reduce((a,b)=>a+b,0)/arr.length:0;
  const myArtist=avg(DM_DIMS.map(d=>+me.scores[d.key]||0));
  const teamArtist=team.length?avg(team.map(m=>avg(DM_DIMS.map(d=>+m.scores[d.key]||0)))):myArtist;
  const myCity=avg(DM_CDIMS.map(d=>+dmCd(me,city).s[d.key]||0));
  const teamCity=team.length?avg(team.map(m=>avg(DM_CDIMS.map(d=>+dmCd(m,city).s[d.key]||0)))):myCity;
  const aA=myArtist*0.4+teamArtist*0.6;
  const aB=myCity*0.4+teamCity*0.6;
  const wA=(DIAMOND.wA!=null?DIAMOND.wA:40);
  const comb=aA*wA/100+aB*(100-wA)/100;
  const myBet=+dmCd(me,city).bet||0;
  const teamBets=team.map(m=>+dmCd(m,city).bet||0).filter(x=>x>0);
  const teamBetAvg=teamBets.length?avg(teamBets):null;
  const bets=(myBet>0?[myBet]:[]).concat(teamBets);
  const directBlend=myBet>0&&teamBetAvg!=null?myBet*0.4+teamBetAvg*0.6:(myBet>0?myBet:teamBetAvg);
  const betSpread=bets.length?Math.max(...bets)-Math.min(...bets):0;
  const anchors=subs.map(m=>+dmCd(m,city).anchor||0).filter(x=>x>0);
  const anchorAvg=anchors.length?Math.round(anchors.reduce((a,b)=>a+b,0)/anchors.length/50)*50:null;
  spreads.sort((x,y)=>y.sp-x.sp);
  const modelOcc=dmSuggestOcc(comb);
  const raw=directBlend!=null?(modelOcc*0.6+directBlend*0.4):modelOcc;
  const uncertainty=Math.max(5,betSpread/2,(spreads[0]?spreads[0].sp:0)*2);
  const occ=Math.max(45,Math.min(95,Math.round(raw)));
  const low=Math.max(35,Math.round(occ-uncertainty));
  const high=Math.min(100,Math.round(occ+uncertainty));
  const maxScoreSpread=spreads[0]?spreads[0].sp:0;
  // 评估一致度同时考虑评分分差与直接预测极差：任一项分歧过大即为低一致度。
  const confidence=(maxScoreSpread<1&&betSpread<=10)?'高':(maxScoreSpread<2&&betSpread<=20?'中':'低');
  return {dimsA,dimsB,aA,aB,myArtist,teamArtist,myCity,teamCity,comb,modelOcc,occ,low,high,confidence,
    myBet:myBet||null,teamBetAvg,directBlend,betAvg:directBlend,betSpread,anchorAvg,maxSp:spreads[0],n:subs.length};
}

function dmVerdictLabel(v){ return v<2.5?'保守':v<3.0?'中性偏保守':v<=3.4?'中性':v<=3.9?'中性偏乐观':'乐观'; }
// 评分→模型上座率：连续映射，避免旧版档位跳变。锚点：1分=45%、2分=60%、3分=75%、4分=85%、5分=95%。
function dmSuggestOcc(v){
  v=Math.max(1,Math.min(5,+v||1));
  return Math.round(v<=3?45+(v-1)*15:75+(v-3)*10);
}
function dmOccExplain(v){
  v=Math.max(1,Math.min(5,+v||1));
  const anchors=[{s:1,o:45},{s:2,o:60},{s:3,o:75},{s:4,o:85},{s:5,o:95}];
  let lo=anchors[0],hi=anchors[1];
  for(let i=0;i<anchors.length-1;i++){ if(v>=anchors[i].s&&v<=anchors[i+1].s){lo=anchors[i];hi=anchors[i+1];break;} }
  const raw=lo.o+(v-lo.s)*(hi.o-lo.o)/(hi.s-lo.s);
  return {lo,hi,raw,rounded:Math.round(raw),formula:`${lo.o}% + (${v.toFixed(2)}−${lo.s}) × (${hi.o}%−${lo.o}%) ÷ (${hi.s}−${lo.s})`};
}

function dmDecisionOverviewHTML(){
  const cities=DIAMOND.cities||[], first=cities[0]||'';

    <div style="text-align:center;background:${color||'#f8fafc'};border-radius:8px;padding:5px"><span style="display:block;font-size:10.5px;color:#64748b">融合 40% / 60%</span><b style="font-size:17px;color:#1e3a8a">${blend.toFixed(2)}</b></div>

  const cityCards=cities.map(city=>{
    const A=dmAggCity(city);
    const E=dmOccExplain(A.comb);
    const directMy=A.myBet!=null?A.myBet.toFixed(0)+'%':'—';
    const directTeam=A.teamBetAvg!=null?A.teamBetAvg.toFixed(0)+'%':'—';
    const hasDirect=A.directBlend!=null;
    const direct=hasDirect?A.directBlend.toFixed(0)+'%':'未填写';
    const directFormula=A.myBet!=null&&A.teamBetAvg!=null
      ?`${A.myBet.toFixed(0)}% × 40% + ${A.teamBetAvg.toFixed(0)}% × 60%`
      :(A.myBet!=null?`${A.myBet.toFixed(0)}%（仅有个人预测）`:(A.teamBetAvg!=null?`${A.teamBetAvg.toFixed(0)}%（仅有团队预测）`:'无直接预测'));
    const forecastFlow=hasDirect
      ?`<div style="display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:9px;align-items:center;margin-top:10px;padding:10px;background:#f8fafc;border-radius:10px">
          <div><span style="display:block;font-size:10.5px;color:#94a3b8">模型上座率</span><b style="font-size:18px;color:#1e3a8a">${A.modelOcc}%</b><div style="font-size:10px;color:#94a3b8">艺人层 ${wA}% + 城市层 ${100-wA}%</div></div>
          <b style="color:#94a3b8">× 60%</b>
          <div><span style="display:block;font-size:10.5px;color:#94a3b8">直接预测融合（选填）</span><b style="font-size:18px;color:#0d9488">${direct}</b><div style="font-size:10px;color:#94a3b8">我 ${directMy} · 团队 ${directTeam}</div></div>
          <b style="color:#94a3b8">× 40%</b>
          <div style="background:#eef2ff;border-radius:8px;padding:8px;text-align:center"><span style="display:block;font-size:10.5px;color:#4f46e5">最终建议区间</span><b style="font-size:20px;color:#4f46e5">${A.low}%–${A.high}%</b></div>
        </div>`
      :`<div style="display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;margin-top:10px;padding:10px;background:#f8fafc;border-radius:10px">
          <div><span style="display:block;font-size:10.5px;color:#94a3b8">模型上座率</span><b style="font-size:18px;color:#1e3a8a">${A.modelOcc}%</b><div style="font-size:10px;color:#94a3b8">艺人层 ${wA}% + 城市层 ${100-wA}%</div></div>
          <div style="text-align:center"><b style="display:block;color:#4f46e5">直接采用 →</b><span style="font-size:10px;color:#94a3b8">个人与团队预测均未填写</span></div>
          <div style="background:#eef2ff;border-radius:8px;padding:8px;text-align:center"><span style="display:block;font-size:10.5px;color:#4f46e5">最终建议区间</span><b style="font-size:20px;color:#4f46e5">${A.low}%–${A.high}%</b></div>
        </div>`;
    const finalFormula=hasDirect
      ?`${A.modelOcc}% × 60% + ${direct} × 40% = <b>${A.occ}%</b>`
      :`个人与团队均未填写，直接预测不参与计算；最终建议 = 模型上座率 = <b>${A.occ}%</b>`;
    return `<div class="dm-city-decision" style="margin-top:12px">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px">
        <div style="font-size:17px;font-weight:800;color:#2d3a8c">${esc(city)}</div>
        <div style="text-align:right"><span class="dm-tag">评估一致度 ${A.confidence}</span><b style="font-size:25px;color:#4f46e5;margin-left:10px">${A.occ}%</b><span style="font-size:11px;color:#64748b"> 系统建议</span></div>

      ${forecastFlow}
      <div style="font-size:11.5px;color:#64748b;line-height:1.75;margin-top:8px">

  }).join('');
  return `<div class="dm-card">
    <h3>🎯 评估总览：个人 vs 团队 × 艺人层 vs 城市层</h3>

      每层先融合“我的评分 40% + 团队均分 60%”，再计算模型与最终推荐。
      艺人层权重 <input type="number" min="0" max="100" step="5" value="${wA}" style="width:50px;text-align:center;padding:3px;border:1.5px solid #dfe3f5;border-radius:6px;font-weight:700;color:#4f46e5" onchange="dmSetWA(this.value)">%，城市层 ${100-wA}%。
    </div>
    <details open style="margin:0 0 12px;border:1px solid #e0e7ff;border-radius:10px;background:#f8faff;padding:9px 12px">
      <summary style="cursor:pointer;font-size:12.5px;font-weight:800;color:#2d3a8c">📖 系统建议上座率的八步计算逻辑</summary>
      <ol style="margin:8px 0 2px 20px;padding:0;font-size:11.5px;color:#475569;line-height:1.75">
        <li><b>L1 艺人层：</b>每个人评价艺人的基础售票势能；这一层对所有城市共用。</li>
        <li><b>L2 城市层：</b>每个人再评价该艺人在具体城市的本地影响力；每座城市单独计算。</li>
        <li><b>每层融合个人与团队：</b>我的评分 × 40% + 团队均分 × 60%，分别得到艺人层融合分和城市层融合分。</li>
        <li><b>计算模型分（1–5分）：</b>艺人层融合分 × ${wA}% + 城市层融合分 × ${100-wA}%。</li>
        <li><b>模型分转成模型上座率：</b>按锚点连续插值——1分=45%、2分=60%、3分=75%、4分=85%、5分=95%，不是直接把分数乘以20。</li>
        <li><b>直接预测融合（选填，上座率%，不是评分）：</b>个人和团队都填写时，个人预测 × 40% + 团队预测均值 × 60%；仅一方填写时只采用该方的真实预测；双方都未填写时显示“未填写”。</li>
        <li><b>最终系统建议：</b>存在真实直接预测时，模型上座率 × 60% + 直接预测融合 × 40%；双方都未填写时，直接预测不参与计算，最终建议直接采用模型上座率。</li>
        <li><b>区间与评估一致度：</b>个人和团队的评分/预测分歧只扩大保守—乐观区间并降低评估一致度，不直接抬高或压低中心建议。低一致度时先补充证据并独立复评；复评前预算采用建议区间下限。</li>
      </ol>
    </details>
    <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11px;font-weight:700;margin-bottom:10px">
      <span style="padding:5px 9px;background:#ecfdf5;border-radius:12px;color:#047857">个人评分</span><span>+</span>
      <span style="padding:5px 9px;background:#eef2ff;border-radius:12px;color:#4338ca">团队均分</span><span>→</span>
      <span style="padding:5px 9px;background:#f8fafc;border-radius:12px;color:#334155">L1/L2 融合模型</span><span>+</span>
      <span style="padding:5px 9px;background:#fff7ed;border-radius:12px;color:#c2410c">直接预测（选填）</span><span>→</span>
      <span style="padding:5px 9px;background:#ede9fe;border-radius:12px;color:#5b21b6">每城系统建议上座率</span>
    </div>
    ${artist}${cityCards}
    <div style="text-align:right;margin-top:12px"><button class="dm-btn" style="font-size:13px;padding:10px 22px" onclick="dmApplyModal()">🏠 应用至秀费模拟 →</button></div>
  </div>`;

// 完整报告必须是“静态快照”：保留当前值、展开全部折叠区，并移除交互控件。
function _staticizeReportRoot(root){
  root.querySelectorAll('.collapsed').forEach(e=>e.classList.remove('collapsed'));
  root.querySelectorAll('input').forEach(i=>{
    const sp=document.createElement('span');
    if(i.type==='checkbox'||i.type==='radio'){ sp.textContent=i.checked?'✓':'—'; }
    else{ sp.textContent=(i.value!==''&&i.value!=null)?i.value:'—'; sp.style.fontWeight='700'; }
    sp.style.display='inline-block'; sp.style.margin='0 3px';
    i.replaceWith(sp);
  });
  root.querySelectorAll('select').forEach(sel=>{ const sp=document.createElement('span'); sp.textContent=(sel.options[sel.selectedIndex]&&sel.options[sel.selectedIndex].text)||''; sp.style.fontWeight='700'; sp.style.display='inline-block'; sp.style.margin='0 3px'; sel.replaceWith(sp); });
  root.querySelectorAll('textarea').forEach(t=>{ const sp=document.createElement('span'); sp.textContent=t.value||'—'; sp.style.display='inline-block'; sp.style.margin='0 3px'; t.replaceWith(sp); });
  root.querySelectorAll('button').forEach(b=>b.remove());
  root.querySelectorAll('.tooltip-wrap,.info-icon').forEach(e=>e.remove());
  root.querySelectorAll('[style*="max-height"],[style*="overflow"]').forEach(e=>{ e.style.maxHeight='none'; e.style.overflow='visible'; });
  // 路线表是宽表：清除交互页的最小列宽，让 13 列严格收进报告画布。
  root.querySelectorAll('.report-tab-routing table td,.report-tab-routing table th').forEach(e=>{
    e.style.minWidth='0'; e.style.maxWidth='none'; e.style.whiteSpace='normal'; e.style.wordBreak='break-word';
  });
  // 表头必须与同列内容采用同一对齐规则：文本左、数字右。
  root.querySelectorAll('table').forEach(tbl=>{
    const hs=tbl.querySelectorAll('thead th'); const sample=tbl.querySelector('tbody tr');
    if(!sample) return;
    const cells=sample.children;
    hs.forEach((h,i)=>{
      const c=cells[i]; if(!c) return;
      const right=c.classList.contains('text-right')||/text-align\\s*:\\s*right/i.test(c.getAttribute('style')||'');
      h.style.textAlign=right?'right':'left';
    });
  });
  return root;
}

async function exportReportPNGZip(btn){
  const root=document.querySelector('#full-report-preview #pdf-root');

  const oldText=btn?btn.textContent:'';
  try{
    if(btn){ btn.disabled=true; btn.textContent='正在准备 PNG…'; }
    if(!window.html2canvas) await _loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
    if(!window.JSZip) await _loadScript('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js');
    const zip=new window.JSZip();
    const names=['00_封面','01_项目信息','02_演出规划','03_演出收益','04_演出成本','05_损益结果','06_汇总方案','07_艺人评估','08_内部_Offer_Memo','09_对外_Deal_Memo'];
    const blocks=Array.from(root.children).filter(e=>e.textContent.trim());
    for(let i=0;i<blocks.length;i++){
      if(btn) btn.textContent=`生成 PNG ${i+1}/${blocks.length}`;
      const canvas=await window.html2canvas(blocks[i],{scale:1,backgroundColor:'#ffffff',useCORS:true,logging:false,windowWidth:1080});
      const blob=await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(new Error('PNG 编码失败')),'image/png'));
      zip.file((names[i]||String(i).padStart(2,'0')+'_报告')+'.png',blob);
    }
    if(btn) btn.textContent='正在打包…';
    const out=await zip.generateAsync({type:'blob'});
    _downloadBlob(out,(state.projectName||'report').replace(/[^\w\u4e00-\u9fff-]+/g,'_')+'_S1-S6_PNG.zip');
    _exportToast('✅ 分章节 PNG.zip 已开始下载');

  }
}

    state.shows.forEach(function(sh){ var occ=getExpOcc(sh), r=calcShow(sh,occ), net=r.net||0;
      var targetCost=net+(sh.sponsorship||0)-GUA-(TGT[sh.city]/100*net);
      var fixed=VENUE[sh.city]+amort; PD.forEach(function(k){ fixed+=(sh.costs[k]&&sh.costs[k].amount)||0; });
      var sc=Math.max(0.03,(targetCost-fixed)/Math.max(1,((r.promoterCost||0)+amort)-fixed));
      Object.keys(sh.costs).forEach(function(k){ if(k==='venue_rent'||PD.indexOf(k)>=0) return;
        var it=sh.costs[k]; if(!it||!it.amount) return;
        it.amount=Math.round(it.amount*sc); if(it.unitPrice) it.unitPrice=Math.round(it.unitPrice*sc*100)/100; it._userEdited=true; }); });
    recompute();
    for(var iter=0;iter<3;iter++){ var am2=((calcTour()||{}).extraCost||0)/nSh;
      state.shows.forEach(function(sh){ var occ=getExpOcc(sh), r=calcShow(sh,occ), net=r.net||0;
        var prof=net+(sh.sponsorship||0)-((r.promoterCost||0)+am2)-GUA;
        var delta=prof-TGT[sh.city]/100*net;
        var it=sh.costs.equip_rental||sh.costs.sound; if(!it) return;
        it.amount=Math.max(0,Math.round((it.amount||0)+delta)); it._userEdited=true; });
      recompute(); }
    // [v3.8.276] 案例展示采用健康预算：每城纯保底按预期净票房倒推至约 42% 主办利润率，
    // 保留真实成本结构，但不再用“超建议上限”的反面案例作为默认演示。
    state.offer=state.offer||{}; state.offer.targetMargin=40;
    var healthyMargin=42, amHealthy=((calcTour()||{}).extraCost||0)/nSh;
    state.shows.forEach(function(sh){
      var rr=calcShow(sh,getExpOcc(sh)), netH=rr.net||0;
      var healthyGua=Math.max(0,Math.round(netH+(sh.sponsorship||0)-((rr.promoterCost||0)+amHealthy)-(healthyMargin/100)*netH));
      sh.guaranteeType='guarantee'; sh._guarantee=healthyGua; sh._guaFlat=healthyGua; sh.guaranteeCur='CNY';
    });
    recompute();
    renderApp();
  })();
}

function positionTourMini(step){

  const target=document.querySelector(step.miniTip); if(!target){ tip.classList.remove('visible'); return; }
  const r=target.getBoundingClientRect();
  if(r.bottom<0||r.top>window.innerHeight){ tip.classList.remove('visible'); return; }
  tip.classList.add('visible');
  const w=250, h=tip.offsetHeight||86;
  const left=Math.min(Math.max(10,r.right-w-12),window.innerWidth-w-10);
  let top=r.top-h-12, below=false;
  if(top<10){ top=Math.min(r.bottom+12,window.innerHeight-h-10); below=true; }
  tip.classList.toggle('below',below);
  tip.style.left=left+'px'; tip.style.top=top+'px';
}

  if(tourStep===curSteps().length-1){
    document.getElementById('tour-next').onclick = ()=>{ if(ACTIVE_STEPS===DEMO_GUIDE_STEPS) demoGuideEnd(); else closeTour(); };
  } else {
    document.getElementById('tour-next').onclick = ()=>tourGo(1);
  }

  // 下一绘制帧完成首次定位；平滑滚动期间由 scroll 监听持续跟随。
  requestAnimationFrame(()=>{ positionTour(step); positionTourMini(step); });
  if(step.typingDemo) setTimeout(_demoTypeExtraction,520);

  // speech
  if(!tourMuted && window.speechSynthesis){
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(translate(step.body||step.speech||''));
    u.lang = lang==='es'?'es-ES':lang==='en'?'en-US':'zh-CN'; u.rate = 0.9; u.pitch = 1;
    window.speechSynthesis.speak(u);
  }
}

let _tourRetry=0;
function positionTour(step){
  const spotlight = document.getElementById('tour-spotlight');
  const bubble = document.getElementById('tour-bubble');
  const pad = 10;

  if(step.selector){
    const el = document.querySelector(step.selector);
    const r0 = el && el.getBoundingClientRect();
    // [v3.8.61/#2] 目标元素未就绪(未找到/零尺寸)→重试，避免首次高亮错位
    if(!el || (r0.width===0 && r0.height===0)){
      if(_tourRetry++ < 8){ setTimeout(()=>{ if(tourActive) positionTour(step); }, 250); }
      return;
    }
    _tourRetry=0;
    {
      const r = r0;
      const top = Math.max(r.top - pad, 0);
      const left = Math.max(r.left - pad, 0);
      const w = Math.min(r.width + pad*2, window.innerWidth - left);
      const h = Math.min(r.height + pad*2, window.innerHeight - top);   // [v3.8.61/#3] 高亮高度不超出视口
      spotlight.style.cssText = `top:${top}px;left:${left}px;width:${w}px;height:${h}px;position:fixed;background:transparent;box-shadow:0 0 0 9999px rgba(0,0,0,.65);border-radius:6px;z-index:9982;pointer-events:none`;

      // position bubble: prefer below, fallback above
      const bubbleH = Math.min(bubble.offsetHeight||260, Math.max(220,window.innerHeight-20));
      const bubbleW = Math.min((step.preview||step.previewCalendar)?390:320, window.innerWidth-20);
      let bTop, bLeft;
      if(top + h + 16 + bubbleH < window.innerHeight){
        bTop = top + h + 16;
      } else {
        bTop = Math.max(top - bubbleH - 16, 10);
      }
      bTop = Math.min(Math.max(bTop, 10), Math.max(10, window.innerHeight - bubbleH - 10));
      bLeft = Math.min(Math.max(left, 10), window.innerWidth - bubbleW - 10);
      bubble.style.cssText = `top:${bTop}px;left:${bLeft}px;position:fixed;z-index:9990;max-width:${bubbleW}px;width:90vw;pointer-events:all;visibility:visible`;
      const below = bTop > top;
      bubble.className = below ? 'arr-up' : 'arr-down';
      if(step.preview||step.previewCalendar) bubble.classList.add('has-preview');
      const arrow=document.getElementById('tour-arrow');
      if(arrow){ let aL=(left + w/2) - bLeft - 9; aL=Math.max(14, Math.min(aL, bubbleW-30)); arrow.style.left=aL+'px'; }
      return;
    }
  }
  // no target: center spotlight off, center bubble
  spotlight.style.cssText = 'display:none';
  bubble.className='';
  bubble.style.cssText = 'top:50%;left:50%;transform:translate(-50%,-50%);position:fixed;z-index:9990;max-width:340px;width:90vw;pointer-events:all;visibility:visible';
}

// [v3.8.229] Q1 语言自适应：首访按浏览器语言自动落 zh/en/es；手动切换后记住本机选择
try{
  const _sav=(typeof localStorage!=='undefined')?localStorage.getItem('qpnl_lang'):null;
  if(window.__FORCE_LANG){ lang=window.__FORCE_LANG; }
  else if(_sav==='zh'||_sav==='en'||_sav==='es'){ lang=_sav; }
  else { const _nl=((navigator.language||'')+'').toLowerCase(); lang=_nl.indexOf('zh')===0?'zh':_nl.indexOf('es')===0?'es':'en'; }
  state.displayCur=langDefaultCur(lang);
}catch(e){}
// [v3.8.231] 静态区三语（landing/顶栏 title）
function localizeStaticUI(){
  try{
    // [v3.8.232] 语言下拉显示值跟随当前语言（自适应后 landing 下拉曾停在中文，造成「切换无效」错觉）
    ['landing-lang'].forEach(function(idd){ var e=document.getElementById(idd); if(e) e.value=lang; });
    ['lnd-new','lnd-load','lnd-demo','landing-logo'].forEach(function(idd){
      var e=document.getElementById(idd); if(!e) return; if(!e._zh) e._zh=e.innerHTML; e.innerHTML=translate(e._zh);
    });
    document.querySelectorAll('.hdr-btn[title]').forEach(function(e){ if(!e._zht) e._zht=e.getAttribute('title'); e.setAttribute('title',translate(e._zht)); });
    var b=document.getElementById('demo-banner-inner'); if(b){ if(!b._zh) b._zh=b.innerHTML; b.innerHTML=translate(b._zh); }
    document.querySelectorAll('.modal-overlay .modal').forEach(function(box){ if(!box._zh) box._zh=box.innerHTML; box.innerHTML=translate(box._zh); });   // 静态弹窗（汇率/税率/加演出/引导结束等）
    ['tour-prev','tour-next'].forEach(function(idd){ var e=document.getElementById(idd); if(e){ if(!e._zh) e._zh=e.textContent; e.textContent=translate(e._zh); } });   // 教程按钮静态态
  }catch(e){}
}
loadUserVenues();   // [v3.8.217] 合并本机自建场馆
localizeStaticUI();   // [v3.8.231]
id('landing').style.display='flex';
