<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profit Calculator · 演出预算模拟器</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:#f4f5fb;color:#1a1a2e;font-size:14px}

/* ── LANDING ─────────────────────────────────────────────── */
#landing{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:20px;padding:40px;text-align:center}
.landing-logo{font-size:30px;font-weight:800;color:#2d3a8c;letter-spacing:-1px}
.landing-btns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:8px}
input[type=file]#file-input{display:none}

/* ── BUTTONS ─────────────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 22px;border-radius:8px;border:none;cursor:pointer;font-size:14px;font-weight:600;transition:.15s;text-decoration:none}
.btn-primary{background:#2d3a8c;color:#fff}.btn-primary:hover{background:#1e2a6e}
.btn-secondary{background:#fff;color:#2d3a8c;border:2px solid #2d3a8c}.btn-secondary:hover{background:#eef0fb}
.btn-ghost{background:#f0f2f8;color:#555;border:1px solid #dde1ef}.btn-ghost:hover{background:#e4e7f5}
.btn-danger{background:#e53e3e;color:#fff}.btn-danger:hover{background:#c53030}
.btn-landing{background:#2d3a8c;color:#fff;font-size:15px;padding:12px 28px;border-radius:9px;min-width:160px;text-align:center;justify-content:center}.btn-landing:hover{background:#1e2a6e}
.tour-link{color:#aaa;font-size:13px;text-decoration:none}.tour-link:hover{color:#2d3a8c}

/* ── TOUR OVERLAY ─────────────────────────────────────────── */
#tour-overlay{display:none;position:fixed;inset:0;z-index:9980;pointer-events:none}
#tour-overlay.active{display:block;pointer-events:auto}
#tour-spotlight{position:fixed;background:transparent;box-shadow:0 0 0 9999px rgba(0,0,0,.65);border-radius:8px;z-index:9982;transition:all .35s cubic-bezier(.4,0,.2,1);pointer-events:none}
#tour-bubble{position:fixed;background:#fff;border-radius:14px;padding:20px 22px;max-width:320px;width:90vw;z-index:9990;box-shadow:0 8px 40px rgba(0,0,0,.3);pointer-events:all}
.export-mi{display:block;width:100%;text-align:left;border:none;background:#fff;padding:11px 16px;font-size:14px;cursor:pointer;color:#2d3a8c;font-weight:600}.export-mi:hover{background:#eef0fb}
.tour-bubble-title{font-size:15px;font-weight:800;color:#2d3a8c;margin-bottom:8px}
#tour-arrow{position:absolute;left:24px;width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;display:none}
#tour-bubble.arr-up #tour-arrow{display:block;top:-9px;border-bottom:9px solid #fff}
#tour-bubble.arr-down #tour-arrow{display:block;bottom:-9px;border-top:9px solid #fff}
.tour-bubble-body{font-size:13px;color:#444;line-height:1.6;margin-bottom:14px}
.tour-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tour-step-count{font-size:12px;color:#aaa;flex:1}
.tour-btn{padding:6px 14px;border-radius:7px;border:none;cursor:pointer;font-size:13px;font-weight:600}
.tour-btn-prev{background:#f0f2f8;color:#555}
.tour-btn-next{background:#2d3a8c;color:#fff}
.tour-btn-close{background:none;border:none;cursor:pointer;font-size:18px;color:#bbb;padding:0 4px;line-height:1}.tour-btn-close:hover{color:#555}
.tour-btn-mute{background:none;border:1px solid #dde1ef;border-radius:6px;cursor:pointer;font-size:13px;padding:4px 8px;color:#888}.tour-btn-mute:hover{background:#f0f2f8}
.btn-sm{padding:6px 14px;font-size:13px}
.btn-xs{padding:4px 10px;font-size:12px}

/* ── APP HEADER ──────────────────────────────────────────── */
#app-wrap{display:none}
#app-wrap.visible{display:block}
#app-header{position:sticky;top:0;z-index:200;background:#2d3a8c;color:#fff;display:flex;align-items:center;gap:12px;padding:10px 20px;flex-wrap:wrap}
.hdr-title{font-weight:700;font-size:15px;flex:1;min-width:100px}
.hdr-meta{font-size:12px;opacity:.75}
.hdr-rate{background:rgba(255,255,255,.15);border-radius:6px;padding:4px 10px;font-size:13px;cursor:pointer}.hdr-rate:hover{background:rgba(255,255,255,.25)}
.hdr-cur3{display:inline-flex;align-items:center;border:1px solid rgba(255,255,255,.3);border-radius:6px;overflow:hidden;font-size:13px;height:26px}.hdr-cur3 b{padding:0 9px;height:100%;display:inline-flex;align-items:center;cursor:pointer;font-weight:600;color:rgba(255,255,255,.7);border-right:1px solid rgba(255,255,255,.2)}.hdr-cur3 b:last-child{border-right:0}.hdr-cur3 b.on{background:#fff;color:#2d3a8c}
.cur2{color:#bbb;font-weight:400;font-size:.82em;white-space:nowrap}
.hdr-actions{display:flex;gap:8px;align-items:center}
.hdr-btn{background:rgba(255,255,255,.15);border:none;color:#fff;padding:5px 12px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600}.hdr-btn:hover{background:rgba(255,255,255,.25)}.hdr-btn-disabled{background:rgba(255,255,255,.05)!important;color:rgba(255,255,255,.4)!important;cursor:not-allowed!important}

/* ── DEMO BANNER ─────────────────────────────────────────── */
#demo-banner{background:#2d3a8c;color:#fff;text-align:center;padding:8px;font-size:13px;font-weight:700;display:none}
#demo-banner.visible{display:block}

/* ── STEP NAV ────────────────────────────────────────────── */
#step-nav{position:sticky;top:49px;z-index:190;background:#fff;border-bottom:2px solid #e8eaf0;display:none;overflow-x:auto}
#step-nav.visible{display:flex}
.snav-item{padding:11px 16px;white-space:nowrap;cursor:pointer;font-size:13px;color:#999;border-bottom:3px solid transparent;font-weight:500;transition:.12s;margin-bottom:-2px}
.snav-item.active{color:#2d3a8c;border-color:#2d3a8c;font-weight:700}
.snav-item.done{color:#38a169}

/* ── MAIN SCROLL AREA ────────────────────────────────────── */
/* 全宽两栏：左 1/5 常驻秀费锚点，右 4/5 现有步骤 */
#main-cols{display:flex;align-items:flex-start;gap:20px;max-width:1320px;margin:0 auto;padding:0 16px}
#fee-anchor{flex:0 0 21%;position:sticky;top:96px;align-self:flex-start;max-height:calc(100vh - 112px);overflow:auto;padding:24px 0 40px}
#scroll-area{flex:1 1 79%;min-width:0;padding:28px 8px 80px}
#pnl-rail{flex:0 0 232px;position:sticky;top:96px;align-self:flex-start;max-height:calc(100vh - 112px);overflow:auto;padding:24px 0 40px}
@media(max-width:900px){
  #main-cols{flex-direction:column;gap:0;padding:0 8px}
  #fee-anchor{position:static;flex-basis:auto;width:100%;max-height:none;padding:16px 8px 0}
  #pnl-rail{position:static;flex-basis:auto;width:100%;max-height:none;padding:8px 8px 0}
  #scroll-area{width:100%}
}
/* 秀费锚点卡片 */
.fa-card{background:#fff;border:1.5px solid #dde1ef;border-radius:12px;padding:16px;box-shadow:0 2px 10px rgba(45,58,140,.06)}
.fa-title{font-size:13px;font-weight:800;color:#2d3a8c;display:flex;align-items:center;gap:6px;margin-bottom:10px}
.fa-big{font-size:26px;font-weight:800;line-height:1.1}
.fa-sub{font-size:12px;color:#888;margin-top:2px}
.fa-row{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;padding:4px 0;border-top:1px dashed #eef0f6}
.fa-row b{font-weight:700}
.fa-bar{height:10px;border-radius:6px;background:#eef0f6;overflow:hidden;margin:8px 0 4px;display:flex}
.fa-bar i{display:block;height:100%}

/* ── SECTION ─────────────────────────────────────────────── */
.section{margin-bottom:36px;scroll-margin-top:110px}
.section-header{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.section-num{width:28px;height:28px;border-radius:50%;background:#2d3a8c;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex-shrink:0}
.section-title{font-size:17px;font-weight:800;color:#2d3a8c}

/* ── CARD ────────────────────────────────────────────────── */
.card{background:#fff;border-radius:12px;padding:20px 22px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.card-title{font-size:14px;font-weight:700;color:#2d3a8c;margin-bottom:14px;display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.card-title .toggle-icon{margin-left:auto;font-size:12px;color:#aaa;transition:.2s}
.card-body{}
.card-body.collapsed{display:none}

/* ── FORM ────────────────────────────────────────────────── */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.form-grid.g3{grid-template-columns:1fr 1fr 1fr}
.form-grid.g1{grid-template-columns:1fr}
@media(max-width:600px){.form-grid,.form-grid.g3{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:11px;font-weight:700;color:#666;text-transform:uppercase;letter-spacing:.4px}
.field input,.field select,.field textarea,.pp-input{padding:8px 11px;border:1.5px solid #dde1ef;border-radius:7px;font-size:14px;color:#1a1a2e;outline:none;width:100%;transition:.12s;background:#fff;box-sizing:border-box}
.field input:focus,.field select:focus,.pp-input:focus{border-color:#2d3a8c;box-shadow:0 0 0 3px rgba(45,58,140,.08)}
.field input:disabled,.field select:disabled,.pp-input:disabled{background:#f7f8fc;color:#aaa;cursor:not-allowed}
.pp-input{text-align:center;-moz-appearance:textfield;appearance:textfield}
.pp-input::-webkit-inner-spin-button,.pp-input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.field .hint{font-size:11px;color:#aaa;margin-top:2px}
.field .ref{font-size:11px;color:#6b7fc4;margin-top:2px}

/* ── SEGMENTED CONTROL ───────────────────────────────────── */
.seg{display:inline-flex;border-radius:8px;overflow:hidden;border:1.5px solid #dde1ef;background:#f7f8fc}
.seg button{border:none;padding:7px 16px;cursor:pointer;font-size:13px;font-weight:600;color:#888;background:transparent;transition:.12s}
.seg button.active{background:#2d3a8c;color:#fff}

/* ── NOTICE ──────────────────────────────────────────────── */
.notice{border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:14px}
.notice-yellow{background:#fffbe6;border:1px solid #f6d860;color:#7a5c00}
.notice-blue{background:#eef0fb;border:1px solid #b0b8e8;color:#2d3a8c}
.notice-red{background:#fff5f5;border:1px solid #fed7d7;color:#c53030}
.notice-green{background:#f0fff4;border:1px solid #9ae6b4;color:#276749}
.notice-orange{background:#fff7ed;border:1px solid #fbd38d;color:#c05621}

/* ── TIER TABLE ──────────────────────────────────────────── */
.tier-table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:10px}
.tier-table th{background:#f4f5ff;padding:8px 10px;text-align:left;font-size:11px;font-weight:700;color:#666;border-bottom:2px solid #dde1ef;white-space:nowrap}
.tier-table th.text-right,.tour-table th.text-right{text-align:right}
.tier-table td{padding:6px 8px;border-bottom:1px solid #f2f2f8;vertical-align:middle}
.tier-table tr:last-child td{border-bottom:none}
.tier-table input[type=number],.tier-table input[type=text]{width:100%;padding:5px 8px;border:1.5px solid #dde1ef;border-radius:5px;font-size:13px}
.tier-table input:focus{border-color:#2d3a8c;outline:none}
.tier-table input:disabled{background:#f7f8fc;color:#aaa}
.tier-tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:700;background:#eef0fb;color:#2d3a8c}
.remove-btn{background:none;border:none;cursor:pointer;color:#cc0000;font-size:16px;padding:2px 5px;line-height:1}
.remove-btn:hover{color:#900}

/* ── RESP TOGGLE ─────────────────────────────────────────── */
.resp-toggle{display:inline-flex;flex-direction:column;border-radius:5px;overflow:hidden;border:1.5px solid #dde1ef;font-size:11px;width:100%;min-width:0;margin-left:0}
.resp-toggle button{border:none;padding:3px 5px;cursor:pointer;font-weight:700;transition:.1s;background:#f8f9ff;color:#888;text-align:center;width:100%}
.resp-toggle button.rp{background:#2d3a8c;color:#fff}
.resp-toggle button.ra{background:#e6520a;color:#fff}
.resp-toggle button.rv{background:#38a169;color:#fff}

/* ── COST TABLE ──────────────────────────────────────────── */
.cost-group{margin-bottom:12px;border:1px solid #e8eaf0;border-radius:9px;overflow:hidden}
.cost-group-header{display:flex;align-items:center;justify-content:space-between;padding:9px 14px;background:#f8f9ff;cursor:pointer;user-select:none}
.cost-group-header:hover{background:#eef0fb}
.cost-group-title{font-size:13px;font-weight:700;color:#2d3a8c}
.cost-group-sub{font-size:12px;color:#888}
.cost-group-body{display:block}
.cost-group-body.collapsed{display:none}
.cost-line{display:grid;grid-template-columns:1fr 80px 60px 110px;gap:6px;align-items:center;padding:7px 14px;border-top:1px solid #f0f0f8}
.cost-line:first-child{border-top:none}
@media(max-width:650px){.cost-line{grid-template-columns:1fr;gap:6px}}
/* full-width layout for special cost lines (hotel/transport/visa/merch) to avoid grid misalignment */
.cost-line.wide{display:block}
.cost-line.wide .cl-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.cost-line.wide .cl-inputs{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px}
.cost-line.wide .cl-inputs input{padding:5px 8px;border:1.5px solid #dde1ef;border-radius:5px;font-size:13px;text-align:right}
.cost-line.wide .cl-inputs input:focus{border-color:#2d3a8c;outline:none}
.cost-line-label{font-size:13px;color:#333}
.cost-line input[type=number]{width:100%;padding:5px 8px;border:1.5px solid #dde1ef;border-radius:5px;font-size:13px;text-align:center;-moz-appearance:textfield;appearance:textfield}
.cost-line input[type=number]::-webkit-inner-spin-button,.cost-line input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.cost-line input:focus{border-color:#2d3a8c;outline:none}
.cost-line input:disabled{background:#f7f8fc;color:#aaa}
.cost-line-ref{font-size:11px;color:#9ba3c9}
.copy-btn{font-size:11px;color:#2d3a8c;border:1px solid #b0b8e8;background:#f4f5ff;border-radius:4px;padding:2px 7px;cursor:pointer;white-space:nowrap}
.copy-btn:hover{background:#dde3ff}

/* ── SHOW TABS ───────────────────────────────────────────── */
.show-tabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.show-tab{padding:6px 13px;border-radius:7px;border:1.5px solid #dde1ef;background:#f8f9ff;cursor:pointer;font-size:13px;font-weight:500;color:#555;transition:.12s}
.show-tab.active{background:#2d3a8c;color:#fff;border-color:#2d3a8c}
.show-tab:hover:not(.active){border-color:#2d3a8c;color:#2d3a8c}

/* ── CALENDAR ────────────────────────────────────────────── */
.cal-wrap{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:16px}
.cal-month{flex:1;min-width:260px}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-header h4{font-size:14px;font-weight:700;color:#2d3a8c}
.cal-nav{background:none;border:1px solid #dde1ef;border-radius:5px;padding:3px 9px;cursor:pointer;font-size:13px;color:#555}
.cal-nav:hover{background:#eef0fb}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-day-label{text-align:center;font-size:11px;font-weight:700;color:#aaa;padding:4px 0}
.cal-day{text-align:center;padding:6px 4px;border-radius:6px;cursor:pointer;font-size:13px;transition:.12s;position:relative;min-height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.cal-day:hover{background:#eef0fb}
.cal-day.empty{cursor:default}
.cal-day.adjacent{color:#cbd0dc;cursor:default;pointer-events:none}
.cal-day.has-show{background:#eef0fb;font-weight:700;color:#2d3a8c}
.cal-day.has-show:hover{background:#dde5ff}
.cal-day.today{}
.subsec-h{font-size:16px;font-weight:800;color:#2d3a8c;margin:22px 0 12px;padding-top:14px;border-top:1px solid #e6e8f2}
.subsec-h0{font-size:16px;font-weight:800;color:#2d3a8c;margin:4px 0 12px}
.cal-day.past{color:#ccc !important;background:transparent !important;cursor:not-allowed;opacity:.55}
.cal-day.past:hover{background:transparent !important}
.cal-dot{width:5px;height:5px;border-radius:50%;background:#2d3a8c}
.cal-day-num{font-size:13px;line-height:1}
.cal-lbl{font-size:9px;line-height:1.05;font-weight:600;white-space:nowrap;margin-top:1px}

/* ── SHOW CARDS ──────────────────────────────────────────── */
.show-card{background:#f8f9ff;border:1.5px solid #dde1ef;border-radius:10px;margin-bottom:12px;overflow:hidden}
.show-card.active-card{border-color:#2d3a8c;box-shadow:0 2px 10px rgba(45,58,140,.12)}
.show-card-header{display:flex;align-items:center;gap:10px;padding:11px 16px;cursor:pointer;user-select:none}
.show-card-header:hover{background:#eef0fb}
.show-date-badge{background:#2d3a8c;color:#fff;border-radius:6px;padding:4px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.show-date-badge input[type=date]{color:#fff}
.show-date-badge input[type=date]::-webkit-calendar-picker-indicator{filter:invert(1) brightness(2.2);opacity:1;cursor:pointer}
input[type=number]{text-align:center}  /* [v3.8.45] 金额/数量等数字输入统一居中 */
.show-card-title{flex:1;font-weight:600;font-size:14px}
.show-card-body{padding:14px 16px;border-top:1px solid #dde1ef;display:block}
.show-card-body.collapsed{display:none}

/* ── ROI CARDS ───────────────────────────────────────────── */
.roi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
@media(max-width:700px){.roi-grid{grid-template-columns:1fr 1fr}}
.roi-card{background:#f8f9ff;border-radius:10px;padding:15px;text-align:center;border:2px solid transparent}
.roi-card.highlight{border-color:#2d3a8c;background:#fff}
.roi-card .rc-label{font-size:11px;color:#888;margin-bottom:5px;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.roi-card .rc-val{font-size:20px;font-weight:800;color:#1a1a2e;line-height:1.2}
.roi-card .rc-val.pos{color:#276749}
.roi-card .rc-val.neg{color:#c53030}
.roi-card .rc-val.blue{color:#2d3a8c}
.roi-card .rc-sub{font-size:11px;color:#bbb;margin-top:4px}

/* ── SENSITIVITY TABLE ───────────────────────────────────── */
.sens-table{width:100%;border-collapse:collapse;font-size:13px}
.sens-table th{background:#f4f5ff;padding:8px 10px;text-align:right;font-size:11px;font-weight:700;color:#666;border-bottom:2px solid #dde1ef}
.sens-table th:first-child{text-align:left}
.sens-table td{padding:7px 10px;border-bottom:1px solid #f0f0f8;text-align:right}
.sens-table td:first-child{text-align:left;font-weight:600;color:#555}
.sens-table tr.hl td{background:#fffbe6;font-weight:700}
.pos{color:#276749}.neg{color:#c53030}

/* ── TAB BAR ─────────────────────────────────────────────── */
.tab-bar{display:flex;gap:0;border-bottom:2px solid #e8eaf0;margin-bottom:18px}
.tab-btn{padding:9px 18px;border:none;background:transparent;cursor:pointer;font-size:14px;font-weight:600;color:#999;border-bottom:3px solid transparent;margin-bottom:-2px;transition:.12s}
.tab-btn.active{color:#2d3a8c;border-color:#2d3a8c}

/* ── TOUR TABLE ──────────────────────────────────────────── */
.tour-table{width:100%;border-collapse:collapse;font-size:13px}
.tour-table th{background:#f4f5ff;padding:8px 12px;text-align:left;font-size:11px;font-weight:700;color:#666;border-bottom:2px solid #dde1ef}
.tour-table td{padding:7px 12px;border-bottom:1px solid #f2f2f8;vertical-align:middle}
.tour-table tfoot td{background:#f8f9ff;font-weight:700;border-top:2px solid #dde1ef}
.tour-table tr:last-child td{border-bottom:none}

/* ── DEADLINE ────────────────────────────────────────────── */
.deadline-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #f0f0f8}
.deadline-row:last-child{border-bottom:none}
.deadline-label{font-size:13px;color:#444;font-weight:600}
.deadline-date{font-size:13px;font-weight:700}
.deadline-badge{display:inline-block;padding:3px 10px;border-radius:5px;font-size:12px;font-weight:700}
.badge-green{background:#c6f6d5;color:#276749}
.badge-yellow{background:#fefcbf;color:#7a5c00}
.badge-red{background:#fed7d7;color:#c53030}

/* ── SUMMARY KV ──────────────────────────────────────────── */
.kv-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f2f2f8;font-size:14px}
.kv-row:last-child{border-bottom:none;font-weight:700}
.kv-val{font-weight:600}

// [v3.8.2] 一次性巡演成本：金额始终 = 单价×人数 ÷ 场数（一笔费用平摊到每场，每场都显示自己那份）。目前仅签证。
const AMORTIZE_TOUR_KEYS={visa:1};
function amortizeTourCosts(){
  if(isDemo) return;   // demo 金额为定值，不重算（保住案例总额）
  const numShows=(state.shows||[]).length||1;
  // [v3.8.3] 签证为巡演级一次性成本：单价/人数取巡演级（国籍→单价、艺人方人数→人数），回填到每一场，
  //          保证「新增场次」也带上自己那份 ÷场数，不会出现某些场空白、整团少算的情况。
  // [v3.8.40] 签证按艺人方逐人国籍求和；单价取均价(总额/人数)以沿用 perHead(单价×人数÷场数)模型。国籍一致时＝原口径(保 golden master)。
  const _an=getNats('artist')[0]; if(_an) state.artistNationality=_an;   // 同步给报批涉外(v3.8.32)用
  const _vt=artistVisaTotal();
  const visaQty=_vt.cnt;
  const visaUnit=visaQty>0 ? _vt.total/visaQty : 0;
  (state.shows||[]).forEach(sh=>{
    const cs=sh.costs||{};
    const cv=cs.visa;
    if(cv && !cv._userEdited){ cv.unitPrice=visaUnit; cv.quantity=visaQty; }   // 未手改→按巡演级回填
    Object.keys(AMORTIZE_TOUR_KEYS).forEach(k=>{
      const c=cs[k];
      if(c && ((c.unitPrice||0)>0 || (c.quantity||0)>0)) c.amount=(c.unitPrice||0)*(c.quantity||0)/numShows;
    });
  });
}

function defaultCosts(){
  const c={};
  ALL_COST_KEYS.forEach(i=>{
    // [v3.7.21] 按人头项(安保/签证)数量默认 0 → 未选场馆/未填前显示空，不再误显示"1"；选场馆后由自动拉取按容量回填
    const perHeadKey=(i.key==='police'||i.key==='visa');
    const entry={amount:0, unitPrice:0, quantity:0, resp:i.resp};
    if(i.key==='mcsc') entry._enabled=true;            // [v3.8.36] 新建场次默认「计入」版权费(法定4%)；用户可关
    if(i.key==='wristband') entry.unitPrice=0.24;      // 手环单价默认¥0.24/个
    if(i.key==='lanyard')   entry.unitPrice=2.8;       // 挂牌套装默认¥2.8/套

function getBenchmark(key){return BENCHMARKS[key]||null;}
function getCostSplitInfo(key, amount, capacity, bandSize){
  if(!amount) return null;
  const info = [];
  switch(key){
    case 'artist_catering':
      info.push(`艺人 ${fmt(amount/bandSize)}/人`);
      break;
    case 'tour_catering':
      info.push(`团队 ${fmt(amount/bandSize)}/人`);
      break;
    // 酒店按「房间数」录入、地面交通按「车型/服务」多行录入，明细已在各自输入行展示，此处不再拆分
    case 'airfares':
      info.push(`${bandSize}人 × ${fmt(amount/bandSize)}/人`);
      break;
    case 'visa':
      info.push(`${bandSize}人 × ${fmt(amount/bandSize)}/人`);
      break;
    case 'security':
      const secCount = Math.max(1, Math.floor(capacity/100));
      info.push(`${secCount}人 × ${fmt(amount/secCount)}/人`);
      break;
  }
  return info.length?info.join(' · '):null;
}

// Helper: get city group key
function getCityGroup(city){
  if(CITY_REF.tier1.has(city)) return 'tier1';
  if(CITY_REF.tier1_5.has(city)) return 'tier1_5';
  return 'tier2';
}

// Helper: get hotel rate
function getHotelRate(city, tier){
  const g=getCityGroup(city);
  return CITY_REF.hotel[g][tier] || CITY_REF.hotel[g].mid;
}

// [v3.7.37] 票务平台费率（供应商库·票务平台费率表）。分销渠道(猫眼/网易+3%、QQ+1.6%)需在费率框自定义叠加
const TICKET_PLATFORMS=[
  {k:'xiudong_lh',      label:'秀动 · Livehouse（固定 ¥10/场）', mode:'flat', flat:10},   // [#7] 秀动LH只收固定手续费，不按票数/不按%
  {k:'xiudong_concert', label:'秀动 · 演唱会（4%）',       rate:4},
  {k:'piaoxingqiu',     label:'票星球（3%）',             rate:3},
  {k:'damai_concert',   label:'大麦 · 演唱会（10%）',      rate:10},
  {k:'damai_large',     label:'大麦 · 大型演唱会（6%）',   rate:6},
  {k:'custom',          label:'自定义', rate:null},
];
function onTicketPlatform(k){
  state.ticketPlatform=k;
  const p=TICKET_PLATFORMS.find(x=>x.k===k);
  if(p&&p.rate!=null){ state.platformFeeRate=p.rate; const el=id('f-pfrate'); if(el) el.value=p.rate; }
  recomputeCalc();
}
// [v3.8.6 / #5] 每场票务平台（可多个）。无 platforms 数组时回退全局 state.platformFeeRate（demo/旧档守恒）。
function showPlatformRate(sh){
  const ps=sh&&sh.platforms;
  if(Array.isArray(ps)&&ps.length) return ps.reduce((a,p)=>a+(+p.rate||0),0);
  return state.platformFeeRate||0;   // legacy / demo 回退
}
// [v3.8.8 / #7] 本场票务平台费（绝对¥）= 各平台叠加：百分比平台=总票房×%，固定平台(如秀动LH)=固定¥/场。无 platforms→回退全局%。
function showPlatformFee(sh, gross){
  const ps=sh&&sh.platforms;
  if(Array.isArray(ps)&&ps.length){
    return ps.reduce((a,p)=>{
      const tp=TICKET_PLATFORMS.find(x=>x.k===p.k);
      if(tp&&tp.mode==='flat') return a + (p.flat!=null?(+p.flat||0):(tp.flat||0));   // 固定费
      return a + gross*((+p.rate||0)/100);                                            // 百分比费
    },0);
  }
  return gross*((state.platformFeeRate||0)/100);   // legacy / demo 回退
}
function ensureShowPlatforms(sh){
  if(!Array.isArray(sh.platforms)||!sh.platforms.length){
    sh.platforms=[{k:state.ticketPlatform||'custom', rate:(state.platformFeeRate!=null?state.platformFeeRate:3)}];
  }
  return sh.platforms;
}
function onShowPlatform(si,pi,k){
  const sh=state.shows[si]; if(!sh) return; ensureShowPlatforms(sh);
  sh.platforms[pi].k=k;
  const tp=TICKET_PLATFORMS.find(x=>x.k===k);
  if(tp&&tp.mode==='flat') sh.platforms[pi].flat=(tp.flat!=null?tp.flat:0);   // [#7] 固定平台→带默认固定费
  else if(tp&&tp.rate!=null) sh.platforms[pi].rate=tp.rate;                    // 百分比平台→带默认费率
  render();
}
function onShowPlatformRate(si,pi,val){
  const sh=state.shows[si]; if(!sh) return; ensureShowPlatforms(sh);
  sh.platforms[pi].rate = val===''?0:+val;
  sh.platforms[pi].k='custom';   // 手改费率→自定义
  recomputeCalc();
}
function onShowPlatformFlat(si,pi,val){   // [#7] 手改固定费(¥/场)
  const sh=state.shows[si]; if(!sh) return; ensureShowPlatforms(sh);
  sh.platforms[pi].flat = val===''?0:+val;
  recomputeCalc();
}
function addShowPlatform(si){
  const sh=state.shows[si]; if(!sh) return; ensureShowPlatforms(sh);
  sh.platforms.push({k:'custom', rate:0});
  render();
}
function removeShowPlatform(si,pi){
  const sh=state.shows[si]; if(!sh) return; ensureShowPlatforms(sh);
  if(sh.platforms.length>1) sh.platforms.splice(pi,1);
  render();
}

const BACKLINE_CATALOG = {
  // Livehouse 单件价按示例报价校准：典型五人队合计≈¥24,000/场

  {key:'drums',      zh:'鼓组(全套)',          en:'Drum Kit'},
  {key:'keys',       zh:'键盘(每台)',          en:'Keyboard (each)'},

];

];
// 巡演级 Backline（单一供应商全权负责，含器材+人员+物流+餐补）
// 逐日变动 × 总停留天数 + 一次性物流 = 巡演总价；每场 = 总价 ÷ 场数（共用）或 单场值（各自）。
function calcBacklineTour(){
  const cat=BACKLINE_CATALOG[state.artistLevel||'Livehouse']||BACKLINE_CATALOG.Livehouse;
  const cfg=state.backlineConfig||{};
  const n=k=>+cfg[k]||0;
  const shows=Math.max(1,(state.shows||[]).length);
  const days=Math.max(shows, shows + (state.logiDays||[]).length);  // 总停留天数(演出+行程日)
  const crew=n('crewCount');
  const gearCounts=n('drums')+n('keys')+n('guitarAmps')+n('iem');
  const configured = gearCounts>0 || crew>0;
  if(!configured) return {configured:false, perShow:0, tourTotal:0, days, shows};   // [v3.7.28] 未配置 Backline → 留空(0)，不再用级别均值 ¥22,000 兜底
  // 逐日变动
  const gearDaily = n('drums')*cat.drums + n('keys')*cat.keys + n('guitarAmps')*cat.guitarAmps + n('iem')*cat.iem + cat.foh + cat.cables; // 含 FOH+话筒/DI/线缆固定每日
  const crewDaily = crew*cat.techCrew;
  const pdRate = (cfg.perDiemRate!==''&&cfg.perDiemRate!=null)?+cfg.perDiemRate:300;
  const perDiemDaily = crew*pdRate;
  const variableDaily = gearDaily + crewDaily + perDiemDaily;
  const logistics = (cfg.logistics!==''&&cfg.logistics!=null)?+cfg.logistics:8000;  // 一次性往返物流
  const shared = cfg.shared!==false;
  let tourTotal, perShow;
  if(shared){ tourTotal=Math.round(variableDaily*days + logistics); perShow=Math.round(tourTotal/shows); }
  else { perShow=Math.round(variableDaily + logistics); tourTotal=perShow*shows; }  // 每城各自一套(单场)
  return {configured:true, shared, gearDaily, crewDaily, perDiemDaily, variableDaily, logistics, pdRate, crew, days, shows, tourTotal, perShow};
}
// [v3.7.41] Backline 制作级别（替代原巡演级配置卡）→ 每场均价（数据库 Backline Production 实测）
const BACKLINE_LEVELS=[
  {k:'mini',  label:'迷你型 Livehouse（<1,000人）· ¥5,000/场',   cost:5000},
  {k:'small', label:'小型 Livehouse（1,000–1,500人）· ¥22,000/场', cost:22000},
  {k:'medium',label:'中型 Livehouse（2,000–5,000人）· ¥58,000/场', cost:58000},
  {k:'custom',label:'自定义（手填金额）', cost:null},
];
function backlineLevelCost(){ const b=BACKLINE_LEVELS.find(x=>x.k===(state.backlineLevel||'custom')); return b?b.cost:null; }
function applyBacklineToAll(){
  const cost=backlineLevelCost(); if(cost==null) return;
  (state.shows||[]).forEach(s=>{ if(s.costs.backline && !s.costs.backline._userEdited) s.costs.backline.amount=cost; });
}
function onBacklineLevel(k){ state.backlineLevel=k; applyBacklineToAll(); render(); }

const LANDING_TRANSPORT={北京:700,上海:700,广州:650,深圳:650,成都:700};

function onLogiField(i, field, val){
  const ld=state.logiDays[i]; if(!ld) return;

  if((field==='fromCity'||field==='toCity') && ld.type==='travel'){ if(!ld.transfer) ld.transfer={dropoff:0,pickup:0}; if(field==='fromCity' && !ld.transfer.dropoffEdited) ld.transfer.dropoff=LANDING_TRANSPORT[ld.fromCity]||0; if(field==='toCity' && !ld.transfer.pickupEdited) ld.transfer.pickup=LANDING_TRANSPORT[ld.toCity]||0; }   // [v3.8.26/#9] 移动日 送机(起点)/接机(终点) 分开

// [v3.7.50] 行程日「巡演工作团队」餐补 = 人数×餐标（默认取人员与餐标·tourCrew，可在卡内覆盖）
function logiPerDiemAmount(ld){
  const c=(ld.perDiem&&ld.perDiem.count!=null&&ld.perDiem.count!=='')?+ld.perDiem.count:pCount('tourCrew');
  const r=(ld.perDiem&&ld.perDiem.rate!=null&&ld.perDiem.rate!=='')?+ld.perDiem.rate:pPd('tourCrew');

}

const INTERCITY={
  '北京-上海':{train:620,air:650},'北京-广州':{train:862,air:800},'北京-深圳':{train:937,air:850},'北京-成都':{train:864,air:1000},

  '成都-北京':{train:864,air:1000},'成都-上海':{train:800,air:750},'成都-广州':{train:550,air:750},'成都-深圳':{train:700,air:650}
};
// [v3.7.51] 移动日城际成本：飞机/高铁=单价×人数(5城用路线表，否则回退全队交通档次)；GL8/考斯特=包天车费
function logiMoveCost(ld){
  const team=(ld.moveCount!=null&&ld.moveCount!=='')?+ld.moveCount:(totalLodgingPersons()||0);
  const route=INTERCITY[(ld.fromCity||'')+'-'+(ld.toCity||'')]; const tc=ensureTravelClass();
  switch(ld.travelMode){
    case 'air':   { const u=(route&&route.air)?route.air:(AIR_CABIN_PRICE[tc.airCabin]||AIR_CABIN_PRICE.eco); return u*team; }
    case 'train': { const u=(route&&route.train)?route.train:(TRAIN_SEAT_PRICE[tc.trainSeat]||TRAIN_SEAT_PRICE.second); return u*team; }
    case 'gl8':   return 700;
    case 'coach': return 1200;
    default: return 0;
  }
}
function onLogiPerDiem(i, field, val){
  const ld=state.logiDays[i]; if(!ld) return;
  if(!ld.perDiem) ld.perDiem={};
  ld.perDiem[field]=val;
  render();
}
// [v3.7.52] 移动日地面成本=实时派生(随路线/方式/人数/总人数)，除非用户手改金额(_userEdited)
const VEHICLE_TYPES=[{k:'coaster',label:'考斯特 中巴',price:700},{k:'gl8',label:'GL8 商务',price:500},{k:'van',label:'金杯/面包',price:400},{k:'sedan',label:'轿车',price:300}];
function logiGroundAmount(ld){
  if(ld.vehicles && ld.vehicles.length) return ld.vehicles.reduce((a,v)=>a+(+v.price||0),0);
  if(ld.type==='travel' && !(ld.ground&&ld.ground._userEdited)) return logiMoveCost(ld);
  return (ld.ground&&ld.ground.amount)||0;
}
function logiDayTotal(ld){
  const hotelAmt=ld.hotelOff?0:(ld.hotel&&ld.hotel.amount||0);
  const groundAmt=ld.groundOff?0:logiGroundAmount(ld);
  const transferAmt=ld.groundOff?0:(ld.transfer?((+ld.transfer.dropoff||0)+(+ld.transfer.pickup||0)):0);
  return hotelAmt+logiPerDiemAmount(ld)+groundAmt+transferAmt;
}
// 显式行程成本汇总（取代 calcTravelDays 自动估算）
function calcLogistics(){
  const days=(state.logiDays||[]).slice().sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const details=days.map(ld=>({date:ld.date, type:ld.type, city:ld.city, total:logiDayTotal(ld)}));
  const cost=details.reduce((a,d)=>a+d.total,0);
  return {cost, days:days.length, details};
}

// 把 demo 的 legacy 成本明细并桶到精简(V3)结构。只在同 resp(promoter)间搬运数值，
// 故每场 promoterCost 总额在数学上不变 → golden master 自动守住。airfares/freight(artist)保持原样。
function remapDemoCostsToV3(sh){
  const c=sh.costs;
  const add=(dst,src)=>{ if(c[dst]&&c[src]){ c[dst].amount=(c[dst].amount||0)+(c[src].amount||0); c[src].amount=0; c[src]._merged=true; } };
  // 市场：线下广告/KOL/印刷 → 其他市场费用(mkt_other)
  add('mkt_other','offline_ads'); add('mkt_other','kol'); add('mkt_other','print');
  // 场租：LED/其他场地费 → venue_rent
  add('venue_rent','led_rent'); add('venue_rent','rent_other');
  // 制作：音响/视频LED/灯光/Runners → Production Management(prod_mgmt)，backline 保留
  add('prod_mgmt','sound'); add('prod_mgmt','video_led'); add('prod_mgmt','lights'); add('prod_mgmt','runners_vans');
  // 人员：安保/消防检查/电工/清洁 → 唯一安保行 police（[v3.8.9/#8] 删 sec_venue 重复项后并入 police）
  add('police','security'); add('police','fire_inspect'); add('police','electrician'); add('police','cleaning');
  // digital_ads/design/stagehands/backline/prod_mgmt/artist_hotel/crew_hotel/ground_trans/visa 已是 V3 key，原样保留
}

// ══════════════════════════════════════════════════════════
//  CALCULATION ENGINE
// ══════════════════════════════════════════════════════════
function calcShow(show, overrideOcc){
  const cap = show.capacity;
  const tiers = show.tiers||[];
  let gross=0, artistVIPIncome=0, totalSellable=0;
  let tierDetails=[];

  const tierCounts = calcTierCounts(show);

  tiers.forEach((tier,ti)=>{
    const tierCap = tierCounts[ti];
    const isNewTier = (tier.sellable!==undefined&&tier.sellable!=='');   // [v3.7.44] Sellable 口径：填了即“预计售出”
    const effOcc = overrideOcc !== undefined ? overrideOcc/100 : (isNewTier ? 1 : (tier.occ||85)/100);
    const sold = Math.round(tierCap * effOcc);
    const rev = sold * (tier.price||0);
    gross += rev;
    totalSellable += tierCap;
    let priceLift = 0;
    if(tier.profitSplit && (tier.priceLift||0)>0){
      priceLift = sold * tier.priceLift;
      artistVIPIncome += priceLift;
    }
    tierDetails.push({tierCap, effOcc, sold, rev, priceLift});
  });

  const pfFee = showPlatformFee(show, gross);   // [#5/#7] 每场平台费：百分比叠加 + 固定费(秀动LH ¥10/场)
  const bizTax = vatOf(gross);                               // [v3.8.101] VAT除法：净=票面/(1+税率)
  const net = gross - pfFee - bizTax;

  // costs
  let promoterCost=0, artistCost=0;
  const costs=show.costs||{};
  ALL_COST_KEYS.forEach(item=>{
    if(item.infoOnly) return;   // [v3.7.40] 仅展示项（票务平台费已在净票房扣除）不计入成本
    const c=costs[item.key]||{amount:0,resp:item.resp};
    let amt=c.amount||0;
    if(item.key==='mcsc'){
      // [v3.8.36] 版权费法定口径：座位数(容量) × 平均票价 × 4%。开关「计入」默认仅新建场次开(newShow写_enabled=true)；关闭/旧档/demo 不计(仅展示)，保 golden master。
      const _avg = totalSellable>0 ? (tiers.reduce((a,t,ti)=>a+(t.price||0)*tierCounts[ti],0)/totalSellable) : 0;
      const _legal = Math.round((cap||0) * _avg * 0.04);
      const _amt = (!isDemo && c._enabled===true) ? _legal : 0;
      if(c.resp==='artist') artistCost+=_amt; else if(c.resp!=='venue') promoterCost+=_amt;
      return;
    }
    if(item.unit==='per_ticket'){
      // multiply by sold tickets
      const soldTotal=tierDetails.reduce((a,t)=>a+t.sold,0);
      amt=amt*soldTotal;
    } else if(item.unit==='pct_gross'){
      amt=gross*(amt/100);
    } else if(item.unit==='pct_expense'){
      // placeholder: % of fixed costs
      amt=promoterCost*(amt/100);
    }
    if(c.resp==='venue') { /* venue-provided: amount is 0 by default, but PM can set non-zero if venue charges */ }
    else if(c.resp==='promoter') promoterCost+=amt;
    else artistCost+=amt;
  });

  const gua = show._guarantee !== undefined ? show._guarantee : (state.guaranteeAmt||0);
  const gcur = show.guaranteeCur || state.guaranteeCur;                 // [v3.7.56] 每场各自货币
  const guaCNY = gcur==='USD' ? gua*state.exchangeRate : gua;
  const guaPerShow = guaCNY;                                            // 每场各自保底（不再 tour 平摊）
  const whtR = ((show.whtRate!==undefined?show.whtRate:state.whtRate)||0)/100;   // [v3.7.57] 艺人预扣税：主办需多付的税负差额 = G×r/(1−r)
  const whtDiff = (whtR>0&&whtR<1) ? guaCNY*whtR/(1-whtR) : 0;

  const sponsorship = show.sponsorship || 0;   // Net Sponsorship（模板 K19/K23）；demo 无此字段→0
  const netPotential = net + sponsorship - promoterCost;
  const promoterProfit = netPotential - guaPerShow - artistVIPIncome;   // [v3.7.59] WHT 不计入损益（从艺人款代扣，仅Offer条款）
  const promoterPct = netPotential!==0 ? (promoterProfit/netPotential)*100 : 0;

  const avgPrice = totalSellable>0 ? (tiers.reduce((a,t,ti)=>a+(t.price||0)*tierCounts[ti],0)/totalSellable) : 0;
  const soldTotal = tierDetails.reduce((a,t)=>a+t.sold,0);
  const netPerTicket = soldTotal>0 ? net/soldTotal : 0;
  const beCost = promoterCost + guaPerShow + artistVIPIncome;
  const beTickets = netPerTicket>0 ? beCost/netPerTicket : 0;
  const bePct = cap>0 ? (beTickets/cap)*100 : 0;

  return {cap, gross, pfFee, net, sponsorship, promoterCost, artistCost, artistVIPIncome,
    guaPerShow, whtDiff, netPotential, promoterProfit, promoterPct, bePct,
    avgPrice, soldTotal, tierDetails};
}

function calcTravelDays(){
  // Detect travel days between consecutive shows (sorted by date)
  const shows=[...state.shows].filter(s=>s.date).sort((a,b)=>a.date.localeCompare(b.date));
  if(shows.length<2) return {travelDays:0, travelCost:0, details:[]};
  const details=[];
  // Representative room count & per-room rate derived from the scheduled shows
  let roomsSum=0, rateSum=0, rateN=0, roomsN=0;
  shows.forEach(s=>{
    const hk=['artist_hotel','band_hotel','artist_staff_hotel','crew_hotel'];   // [v3.7.20] 四类汇总
    const rooms=hk.reduce((a,k)=>a+((s.costs[k]||{}).hotelPersons||0),0);
    const rate=hk.map(k=>(s.costs[k]||{}).hotelRate||0).find(r=>r>0)||0;
    if(rooms>0){roomsSum+=rooms;roomsN++;}
    if(rate>0){rateSum+=rate;rateN++;}
  });
  const roomsPerNight=roomsN>0?Math.round(roomsSum/roomsN):((state.bandSize||0)+(state.companyCrew||0));
  const hotelPerRoomNight=rateN>0?Math.round(rateSum/rateN):600; // fallback ¥600/room/night
  const transportPerDay=1200; // 考斯特包天 ¥1,200

  for(let i=0;i<shows.length-1;i++){
    const a=shows[i], b=shows[i+1];
    const dateA=new Date(a.date+'T00:00:00'), dateB=new Date(b.date+'T00:00:00');
    const gap=Math.round((dateB-dateA)/(86400000))-1; // nights between (excluding show days)
    const sameCity=(a.city===b.city);
    if(gap>0 && !sameCity){
      const hotelCost=hotelPerRoomNight*roomsPerNight*gap;
      const transCost=transportPerDay*gap;
      details.push({from:a.city, to:b.city, days:gap, hotelCost, transCost, total:hotelCost+transCost});
    }
  }
  const travelDays=details.reduce((a,d)=>a+d.days,0);
  const travelCost=details.reduce((a,d)=>a+d.total,0);
  return {travelDays, travelCost, details};
}

// [v3.7.23] 巡演级 Promoter Overhead = 巡演工作团队餐补（餐标 × 人数 × 总停留天数）。
// 总停留天数 = 演出日 + 行程日（非演出日）。Budget Assumptions 已删除；非演出日酒店由「行程日」卡逐日计、演出当晚酒店由四类酒店计。
// 艺人本人/艺人乐队/艺人工作人员 per diem 仍只算演出日（在「演出成本·餐饮」每场）。
function calcOverhead(){
  const nonShow=(state.logiDays||[]).length;
  const totalStay=(state.shows||[]).length + nonShow;
  // [v3.7.23] 巡演工作团队餐补已改为每场平摊(crew_meals 行)，不再在巡演级重复计；此处仅保留天数信息。
  return {tourCrewPerDiem:0, nonShow, totalStay, total:0, artistHotel:0, crewHotel:0, allowance:0};
}

function calcTour(overrideOcc){
  if(!state.shows.length) return null;
  const results=state.shows.map(s=>calcShow(s, overrideOcc));
  // 完整行程：有显式行程日则按其成本计；否则回退到 calcTravelDays 自动估算（兼容旧项目/Demo）
  const hasLogi=(state.logiDays||[]).length>0;
  const logi=hasLogi?calcLogistics():null;
  const travel=hasLogi?null:calcTravelDays();
  const overhead=calcOverhead();
  // [v3.7.23] 跨城物流/Travel Days 自动预估撤掉（通常含在 Backline 打包价里，不单列）。仅显式「行程日」仍计。
  const extraCost=(hasLogi?logi.cost:0)+overhead.total;
  return {
    results,
    totGross:   results.reduce((a,r)=>a+r.gross,0),
    totNet:     results.reduce((a,r)=>a+r.net,0),
    totPCost:   results.reduce((a,r)=>a+r.promoterCost,0),
    totVIP:     results.reduce((a,r)=>a+r.artistVIPIncome,0),
    totGua:     results.reduce((a,r)=>a+r.guaPerShow,0),
    totNetPot:  results.reduce((a,r)=>a+r.netPotential,0),
    totProfit:  results.reduce((a,r)=>a+r.promoterProfit,0) - extraCost,
    totPct(){return this.totNetPot!==0?this.totProfit/this.totNetPot*100:0},
    get totPromoterCost(){return this.totPCost + extraCost;},
    travel, logi, overhead, extraCost,
  };
}

// ── R1: 单一派生入口 ──────────────────────────────────────
// 所有渲染先经此得到 state.derived（唯一数据源的派生结果）。
// calcShow/calcTour 仍是底层引擎（纯、确定）；recompute 只做聚合缓存。
function recompute(){
  state.derived = state.shows.length ? calcTour() : null;
  return state.derived;
}

function fmt(n,d=0){
  if(n===null||n===undefined||isNaN(n)) return '—';
  return n.toLocaleString('zh-CN',{minimumFractionDigits:d,maximumFractionDigits:d});
}
function fmtP(n){return isNaN(n)?'—':fmt(n,1)+'%'}
function fmtY(n){return cm(n);}
// [v3.8.69] 单币种显示：displayCur=CNY/USD/EUR，默认随语言(中¥/英$/西€)，顶栏三段选择器可切换。内部计算始终CNY。
function langDefaultCur(l){ return l==='en'?'USD':l==='es'?'EUR':'CNY'; }
function curSym(){ const d=state.displayCur||'CNY'; return d==='EUR'?'€':d==='USD'?'$':'¥'; }
function curRate(){ const d=state.displayCur||'CNY'; return d==='EUR'?(+state.eurRate||7.9):d==='USD'?(+state.exchangeRate||7.28):1; }
function vatOf(g){ const t=(state.businessTaxRate||0)/100; return t<=0?0:g*t/(1+t); }   // [v3.8.101] VAT按除法:含税票面提取税额 净=票面/(1+税率)
function mIn(cny){ if(!cny) return ''; const r=curRate(); return r===1?cny:+(cny/r).toFixed(2); }   // [v3.8.102] 金额输入显示值(CNY→displayCur);CNY时no-op
function mWr(v){ return (+v||0)*curRate(); }   // [v3.8.102] 金额输入回写CNY;CNY时=+v
function cm(n){ if(n===null||n===undefined||isNaN(n)) return curSym()+'—'; const r=curRate()||1; const neg=n<0; const v=Math.round(Math.abs(n)/r); return (neg?'-':'')+curSym()+fmt(v); }
function cur2sym(){ return curSym(); }
function cur2rate(){ return curRate(); }
function fmtY2(n){ return cm(n); }
function cc(n){return n>=0?'pos':'neg'}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function renderStepNav(){
  const nav=id('step-nav');
  nav.innerHTML=getSections().map((sec,i)=>`<div class="snav-item" id="snav-${i}" onclick="scrollToSection(${i})"><span class="snav-num">${i+1}</span>${esc(sec.title)}</div>`).join('');
  nav.classList.add('visible');
}

// Section header for showcase modules + a neutral "sample data" chip (no phase/delivery wording)
function showcaseHeader(num, title){
  return `<div class="section-header"><div class="section-num">${num}</div><div class="section-title">${esc(title)}</div><span class="sample-chip">示例数据</span></div>`;
}

function renderSections(){
  const area=id('scroll-area');
  area.innerHTML='';
  getSections().forEach((sec,i)=>{
    const el=document.createElement('div');
    el.className='section';
    el.id=`section-${i}`;
    let html=sec.render();
    // In edit (新建项目) mode, non-wired showcase modules are present but non-interactive.
    // In 案例预览 mode the whole page is already read-only, so no extra wrapper needed.
    if(!sec.live && !isDemo) html=`<div class="shell-static">${html}</div>`;
    el.innerHTML=translate(html);
    area.appendChild(el);
  });
  bindLiveInputs();
}

function scrollToSection(i){
  const el=id(`section-${i}`);
  if(el) el.scrollIntoView({behavior:'smooth'});
}

function setupObserver(){
  const total=getSections().length;
  const opts={rootMargin:'-100px 0px -60% 0px',threshold:0};
  const obs=new IntersectionObserver(entries=>{
    entries.forEach(e=>{
      if(e.isIntersecting){
        const idx=parseInt(e.target.id.split('-')[1]);
        document.querySelectorAll('.snav-item').forEach((el,i)=>{
          el.classList.toggle('active',i===idx);
          el.classList.toggle('done',i<idx);
        });
      }
    });
  },opts);
  for(let i=0;i<total;i++){const el=id(`section-${i}`); if(el) obs.observe(el);}
}

function updateScrollProgress(){
  const el=id('scroll-progress'); if(!el) return;
  const h=document.documentElement.scrollHeight - window.innerHeight;
  const p=h>0?(window.scrollY/h)*100:0;
  el.style.width=Math.min(100,Math.max(0,p))+'%';
}
window.addEventListener('scroll', updateScrollProgress, {passive:true});

function getCalMonths(yr,mo){
  // check if any shows / 行程日 in next month too (cross-month)
  const allDated=[...state.shows, ...(state.logiDays||[])];
  const hasCrossMonth = allDated.some(s=>{
    if(!s.date) return false;
    const d=new Date(s.date+'T00:00:00');
    const nextY=mo===11?yr+1:yr, nextM=mo===11?0:mo+1;
    return d.getFullYear()===nextY && d.getMonth()===nextM;
  });
  const months=[{y:yr,m:mo}];
  if(hasCrossMonth){
    const ny=mo===11?yr+1:yr, nm=mo===11?0:mo+1;
    months.push({y:ny,m:nm});
  }
  return months;
}

function renderMonthCal(yr,mo,showDates,dayMap){
  dayMap=dayMap||{};
  const MONTHS_ZH=['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
  const MONTHS_EN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const monthName=lang==='zh'?`${yr}年${MONTHS_ZH[mo]}`:MONTHS_EN[mo]+' '+yr;
  const dayLabels=(lang==='zh'?['一','二','三','四','五','六','日']:['M','T','W','T','F','S','S'])
    .map(d=>`<div class="cal-day-label">${d}</div>`).join('');
  const first=new Date(yr,mo,1);
  let startDow=first.getDay(); // 0=Sun
  startDow=(startDow+6)%7; // shift so Mon=0
  const daysInMonth=new Date(yr,mo+1,0).getDate();
  const today=new Date(); const todayStr=`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
  let cells='';
  const _prevDays=new Date(yr,mo,0).getDate();
  for(let i=0;i<startDow;i++){ const _pd=_prevDays-startDow+1+i; cells+=`<div class="cal-day adjacent"><span class="cal-day-num">${_pd}</span></div>`; }
  for(let d=1;d<=daysInMonth;d++){
    const dateStr=`${yr}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const hasShow=showDates.has(dateStr);
    const dtype=dayMap[dateStr];
    const isToday=dateStr===todayStr;
    const isPast=dateStr<todayStr;   // [v3.8.42] 过去的日期：灰显且不可点(不可编辑)
    const cls=['cal-day', hasShow?'has-show':'', isToday?'today':'', isPast?'past':''].filter(Boolean).join(' ');
    // 演出日用原蓝点；行程日用对应类型色点
    const _meta=hasShow?dayTypeMeta('show'):(dtype?dayTypeMeta(dtype):null);
    const dot=_meta?`<div class="cal-dot" style="background:${_meta.color}"></div>`:'';
    const _lbl=_meta?`<div class="cal-lbl" style="color:${_meta.color}">${lang==='zh'?_meta.zh.replace(/日$/,''):_meta.en}</div>`:'';
    const click=isPast?'':`onclick="calDayClick('${dateStr}')"`;
    cells+=`<div class="${cls}" ${click} title="${isPast?'已过去·不可编辑':(_meta?_meta.zh:'')}"><span class="cal-day-num">${d}</span>${dot}${_lbl}</div>`;
  }
  const _tot=startDow+daysInMonth; const _trail=(7-_tot%7)%7;
  for(let _t=1;_t<=_trail;_t++){ cells+=`<div class="cal-day adjacent"><span class="cal-day-num">${_t}</span></div>`; }
  return `<div class="cal-month"><div class="cal-header"><h4>${monthName}</h4></div>
  <div class="cal-grid">${dayLabels}${cells}</div></div>`;
}

function buildVenueSelectHTML(idx, city, selectedVenue, dis){
  const venues = VENUE_DB[city];

    return `<input id="sh-venue-${idx}" value="${esc(selectedVenue||'')}" oninput="onShowField(${idx},'venue',this.value)" ${dis}>`;
  }
  let html = `<select id="sh-venue-${idx}" onchange="onVenueSelect(${idx},this.value)" ${dis}><option value="">— 选择场馆 —</option>`;
  // [v3.8.33] 去除 st 星标；有场租场馆在前，无场租(待更新)排末尾，中间加分割线
  const _hasRent = v => !!(v.rf||v.rs||v.ru||v.rw);
  const _opt = v => `<option value="${esc(v.n)}" ${v.n===selectedVenue?'selected':''}>${esc(v.n)} (${v.c}人)</option>`;
  venues.filter(_hasRent).forEach(v=>{ html += _opt(v); });

  if(_noRent.length){

  }
  html += `<option value="__other__">手动输入…</option></select>`;
  return html;
}

function renderTierTable(sh, showIdx){

  const cap=sh.capacity;
  const khc=true;   // 统一显示 Kills/Holds/Comps→Sellable（模板口径）；demo 各档 K/H/C=0 → Sellable=库存，数字不变

  const tierCounts = calcTierCounts(sh);

function tierWarnHTML(total,cap){
  if(!cap) return '';
  if(total>cap) return `<div class="notice notice-yellow" style="margin-top:6px">各档总票数合计 ${fmt(total)} 超过总容量 ${fmt(cap)}（超售，请调整）</div>`;
  if(total===cap) return `<div class="notice" style="margin-top:6px;background:#f0fdf4;border:1px solid #86efac;color:#15803d">✅ 各档总票数合计 ${fmt(total)} ＝ 总容量 ${fmt(cap)}（已用满容量）</div>`;
  return `<div class="notice notice-blue" style="margin-top:6px">各档总票数合计 ${fmt(total)} ／ 总容量 ${fmt(cap)}（还剩 ${fmt(cap-total)} 张）</div>`;
}

// 注：原 refreshTierDerived（占比/目标售出定点刷新）已被 R2 的统一 render() 取代，见下方别名。

// Calculate ticket counts for all tiers (each tier has its own capCount)
function calcTierCounts(sh){
  // Sellable = Total Tickets(库存) − Kills − Holds − Comps（模板口径）。demo 票档无 K/H/C → 等于库存，基线不变。
  const tiers=sh.tiers||[];
  return tiers.map(t=>(t.sellable!==undefined&&t.sellable!=='')?Math.max(0,+t.sellable):Math.max(0,(t.capCount||0)-(t.kills||0)-(t.holds||0)-(t.comps||0)));
}

// [v3.8.96] 保底统一以 CNY 内部存储；货币显示由菜单栏 displayCur 控制。导入/demo 时把非 CNY 保底换算成 CNY（不四舍五入，守 golden master）。
function migrateGuaToCNY(st){
  const r=st.exchangeRate||7.28, eu=st.eurRate||7.9;
  (st.shows||[]).forEach(sh=>{ const c=sh.guaranteeCur||st.guaranteeCur||'CNY'; if(sh._guarantee!=null && c!=='CNY'){ sh._guarantee=sh._guarantee*(c==='EUR'?eu:r); } sh.guaranteeCur='CNY'; });
  st.guaranteeCur='CNY';
}
function onGuaInput(idx,v){ const sh=state.shows[idx]; if(!sh) return; sh._guarantee=(v===''?undefined:Math.round(+v*curRate())); sh.guaranteeCur='CNY'; render(); }

function ensureActiveCost(){

  if(ld.type==='landing') return m.icon+' '+(ld.city||'落地');
  if(ld.type==='departure') return m.icon+' '+(ld.city||'离境');
  if(ld.type==='travel')  return m.icon+' '+(ld.fromCity||'?')+'→'+(ld.toCity||'?');
  if(ld.type==='media')   return m.icon+' '+(ld.keyword||'媒体');
  if(ld.type==='rest')    return m.icon+' '+(ld.keyword||'休息');
  return m.icon+' '+(ld.city||'');
}

function renderCostLine(item, sh, showIdx, dis){
  const c=sh.costs[item.key]||{amount:0,unitPrice:0,quantity:1,resp:item.resp};
  const lbl=lang==='zh'?item.zh:item.en;
  const isP=c.resp==='promoter', isA=c.resp==='artist', isV=c.resp==='venue';
  const splitInfo=getCostSplitInfo(item.key, c.amount, sh.capacity, state.bandSize);
  const splitHint=splitInfo?`<span class="cost-line-ref">${splitInfo}</span>`:'';
  const unitLabel=item.unit==='per_ticket'?`(${lang==='zh'?'每张':'per ticket'})`:item.unit==='pct_gross'?`(% of gross)`:item.unit==='pct_expense'?`(% of exp)`:'';
  const respBtns=`<div class="resp-toggle">
    <button class="${isP?'rp':''}" onclick="onCostResp(${showIdx},'${item.key}','promoter')" ${dis}>${t('respLocal')}</button>
    <button class="${isA?'ra':''}" onclick="onCostResp(${showIdx},'${item.key}','artist')" ${dis}>${t('respArtist')}</button>
    <button class="${isV?'rv':''}" onclick="onCostResp(${showIdx},'${item.key}','venue')" ${dis}>${t('respVenue')}</button>
  </div>`;

  // [v3.7.18] per diem 四项由「人员与餐标」表驱动 → 只读展示（单价=餐标·数量=人数·金额=单价×数量）
  if(PEOPLE_BY_PD_ITEM[item.key]){
    const u=c.unitPrice||0, q=c.quantity||0, a=c.amount||0;
    const ro='disabled style="background:#f3f4f8;color:#777;cursor:not-allowed" title="在「项目信息 › 人员与餐标」修改"';
    const subhint = item.key==='crew_meals'
      ? '(餐标×人数·每场；行程日餐补在各行程日卡)'
      : '(餐标×人数 · 随人员表)';
    return `<div class="cost-line">
  <div style="flex:1;min-width:120px"><div class="cost-line-label">${esc(lbl)} <span class="text-muted">${subhint}</span></div></div>
  <input type="number" value="${u||''}" placeholder="${curSym()}0.00" ${ro}>
  <input type="number" value="${q||''}" placeholder="0" ${ro}>
  <input type="number" value="${a||''}" placeholder="0" ${ro}>
  
</div>`;
  }

  // 按人头：单价(¥/人) × 人数 = 金额（签证 / 安保）。优先于其他特殊布局。
  if(item.perHead){
    const up=c.unitPrice>0?c.unitPrice:'';
    const qty=c.quantity>0?c.quantity:'';
    const headLabel=item.headLabel||'人数';
    // [v3.8.2] 一次性巡演成本（签证）：金额 = 单价×人数 ÷ 场数。行内展示摊销过程，金额只读（由单价/人数驱动）。
    const fullAmt=(c.unitPrice||0)*(c.quantity||0);
    const nShows=(state.shows||[]).length||1;
    const showAmort=!!AMORTIZE_TOUR_KEYS[item.key] && fullAmt>0;
    const amortNote=showAmort
      ? `<div class="cost-line-ref">一次性：全程 ${cm(fullAmt)} ÷ ${nShows} 场 = ${cm(Math.round(fullAmt/nShows))}/场（计入本场）</div>`
      : '';
    const headExtra=showAmort?' ÷ 场数':'';
    // [v3.8.18] 安保费率默认提示：场馆无 sf → 默认 ¥300/人，打 * 提醒用户核实
    const _rateDefaulted = item.key==='police' && c._rateDefaulted && !c._userEdited;
    const defStar = _rateDefaulted ? `<span style="color:#d08700;font-weight:700" title="数据库无该场馆安保费率，已采用默认 ¥300/人，请核实">*</span>` : '';
    const defRef = _rateDefaulted ? `<div class="cost-line-ref" style="color:#d08700">* 数据库未登记该场馆安保费率，默认 ¥300/人（请核实）</div>` : '';
    const amtRO=showAmort?'disabled style="background:#f3f4f8;color:#777;cursor:not-allowed"':dis;
    const amtTitle=showAmort
      ? `全程 ${fmt(c.unitPrice||0)}/人 × ${fmt(c.quantity||0)} = ${cm(fullAmt)} ÷ ${nShows}场 = ${cm(Math.round(fullAmt/nShows))}/场（一次性成本自动摊销·只读，改单价/人数即可）`
      : `${fmt(c.unitPrice||0)}/人 × ${fmt(c.quantity||0)} = ${fmt(fullAmt)}`;
    return `<div class="cost-line">
  <div style="flex:1;min-width:120px"><div class="cost-line-label">${esc(lbl)}${defStar} <span class="text-muted">(¥/人 × ${headLabel}${headExtra})</span></div>${splitHint}${amortNote}${defRef}</div>
  <input type="number" id="unit-${showIdx}-${item.key}" placeholder="${curSym()}0.00" value="${mIn(up)}" min="0" step="10" ${dis} oninput="onCostUnit(${showIdx},'${item.key}',mWr(this.value))">
  <input type="number" id="qty-${showIdx}-${item.key}" placeholder="${headLabel}" value="${qty}" min="0" step="1" ${dis} oninput="onCostQty(${showIdx},'${item.key}',+this.value)">
  <input type="number" id="amt-${showIdx}-${item.key}" value="${mIn(c.amount)}" placeholder="0" min="0" step="100" ${amtRO} title="${amtTitle}" oninput="onCost(${showIdx},'${item.key}',mWr(this.value))">

</div>`;
  }

  // Special layout for Merch: 3 cooperation modes + expandable sub-panel
  if(item.isMerch){
    const merch=c.merchData||{mode:'artist_self', items:[]};
    const modes=[
      {v:'artist_self',  zh:'艺人自卖', en:'Artist Self-Sells', desc:'艺人自行负责周边销售，主办方不参与'},
      {v:'promoter_prod', zh:'主办协助生产', en:'Promoter Helps Produce', desc:'主办方承担生产成本，保留利润差额'},
      {v:'promoter_full', zh:'主办全权管理(20%提成)', en:'Promoter Manages (20% commission)', desc:'主办方管理全部周边销售，收取20%提成'},
    ];
    const modeSelect=modes.map(m=>`<option value="${m.v}" ${merch.mode===m.v?'selected':''}>${lang==='zh'?m.zh:m.en}</option>`).join('');
    const curMode=modes.find(m=>m.v===merch.mode)||modes[0];
    let subPanel='';
    if(merch.mode!=='artist_self'){
      const miRows=(merch.items||[]).map((mi,ri)=>{
        const rev=(mi.unitPrice||0)*(mi.estSales||0);
        const commission=merch.mode==='promoter_full'?rev*0.2:rev-(mi.prodCost||0)*(mi.estSales||0);
        return `<div style="display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin-bottom:4px;padding:4px 0;border-bottom:1px dotted #eee">
          <input type="text" id="mi-${showIdx}-${ri}-cat" placeholder="种类" value="${esc(mi.category||'')}" style="width:72px;font-size:12px;padding:4px 6px;border:1px solid #dde1ef;border-radius:4px" oninput="onMerchItem(${showIdx},${ri},'category',this.value)">
          <input type="number" id="mi-${showIdx}-${ri}-unit" placeholder="${curSym()}0.00" value="${mIn(mi.unitPrice)}" min="0" style="width:60px;font-size:12px;padding:4px 6px;border:1px solid #dde1ef;border-radius:4px" oninput="onMerchItem(${showIdx},${ri},'unitPrice',mWr(this.value))">
          ${merch.mode==='promoter_prod'?`<input type="number" id="mi-${showIdx}-${ri}-prod" placeholder="${curSym()}0.00" value="${mIn(mi.prodCost)}" min="0" style="width:60px;font-size:12px;padding:4px 6px;border:1px solid #dde1ef;border-radius:4px" oninput="onMerchItem(${showIdx},${ri},'prodCost',mWr(this.value))">`:''}
          <input type="number" id="mi-${showIdx}-${ri}-sales" placeholder="0" value="${mi.estSales||''}" min="0" style="width:64px;font-size:12px;padding:4px 6px;border:1px solid #dde1ef;border-radius:4px" oninput="onMerchItem(${showIdx},${ri},'estSales',+this.value)">
          <span style="font-size:11px;color:#888">收入:${cm(rev)}</span>
          <span style="font-size:11px;color:#38a169;font-weight:600">提成:${cm(Math.max(0,commission))}</span>
          ${(merch.items||[]).length>1?`<button class="remove-btn" style="font-size:11px" onclick="removeMerchItem(${showIdx},${ri})">×</button>`:''}
        </div>`;
      }).join('');
      const totalCommission=(merch.items||[]).reduce((a,mi)=>{
        const rev=(mi.unitPrice||0)*(mi.estSales||0);
        return a+(merch.mode==='promoter_full'?rev*0.2:Math.max(0,rev-(mi.prodCost||0)*(mi.estSales||0)));
      },0);
      subPanel=`<div style="margin-top:8px;padding:8px;background:#f7f8fc;border-radius:8px">
        <div style="font-size:11px;font-weight:700;color:#666;margin-bottom:6px">周边商品明细</div>
        ${miRows}
        <button class="btn btn-ghost btn-xs" style="margin-top:4px" onclick="addMerchItem(${showIdx})">+ 添加商品</button>
        <div style="margin-top:6px;font-size:12px;font-weight:700;color:#2d3a8c">主办方提成合计：${cm(totalCommission)}</div>
      </div>`;
    }
    return `<div class="cost-line" style="display:flex;flex-wrap:wrap;flex-direction:column;align-items:stretch">
  <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
    <div style="flex:1;min-width:120px"><div class="cost-line-label">${esc(lbl)}</div>
      <div class="text-muted" style="font-size:11px">${curMode.desc}</div>
    </div>
    <select style="width:200px;font-size:12px;padding:5px 8px;border:1px solid #dde1ef;border-radius:6px" onchange="onMerchMode(${showIdx},this.value)">${modeSelect}</select>
  </div>
  ${subPanel}
</div>`;
  }

  // Special layout for visa: multi-row (国籍 + 签证类型 + 单价 + 人数 + 金额)
  if(item.key==='visa'){
    const rows=c.visaRows||[];
    const visaRowsHtml=rows.map((vr,ri)=>`<div style="display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin-bottom:4px">
      <input type="text" id="visa-${showIdx}-${ri}-nat" placeholder="国籍" value="${esc(vr.nationality||'')}" style="width:64px;font-size:12px;padding:4px 6px;border:1px solid #dde1ef;border-radius:4px" ${dis} oninput="onVisaRow(${showIdx},${ri},'nationality',this.value)">
      <input type="text" id="visa-${showIdx}-${ri}-type" placeholder="签证类型" value="${esc(vr.visaType||'')}" style="width:72px;font-size:12px;padding:4px 6px;border:1px solid #dde1ef;border-radius:4px" ${dis} oninput="onVisaRow(${showIdx},${ri},'visaType',this.value)">
      <input type="number" id="visa-${showIdx}-${ri}-unit" placeholder="${curSym()}0.00" value="${mIn(vr.unitPrice)}" min="0" style="width:64px;font-size:12px;padding:4px 6px;border:1px solid #dde1ef;border-radius:4px" ${dis} oninput="onVisaRow(${showIdx},${ri},'unitPrice',mWr(this.value))">
      <span style="color:#888;font-size:11px">×</span>
      <input type="number" id="visa-${showIdx}-${ri}-persons" placeholder="0" value="${vr.persons||''}" min="0" style="width:48px;font-size:12px;padding:4px 6px;border:1px solid #dde1ef;border-radius:4px" ${dis} oninput="onVisaRow(${showIdx},${ri},'persons',+this.value)">
      <span style="color:#888;font-size:11px">=</span>
      <span style="font-size:12px;font-weight:600;min-width:52px;text-align:right">${cm((vr.unitPrice||0)*(vr.persons||0))}</span>
      ${rows.length>1?`<button class="remove-btn" style="font-size:11px" onclick="removeVisaRow(${showIdx},${ri})">×</button>`:''}
    </div>`).join('');
    const totalVisa=rows.reduce((a,vr)=>a+(vr.unitPrice||0)*(vr.persons||0),0);
    return `<div class="cost-line wide">
  <div class="cl-top">
    <div><span class="cost-line-label">${esc(lbl)}</span> <span style="font-size:11px;color:#888;font-weight:600">合计：${cm(totalVisa)}</span>${splitHint}</div>

  </div>
</div>`;

  // Special layout for hotel items: ¥/间晚 × 间数 × 晚数 = 金额
  const isHotel = !!PEOPLE_BY_HOTEL_ITEM[item.key];   // [v3.7.20] 四类酒店统一走酒店布局
  if(isHotel){
    const rate=c.hotelRate||0, rooms=c.hotelPersons||0, nights=c.hotelNights||0;
    const calcAmt=rate*rooms*nights;
    const formulaStr=`${cm(rate)}/间晚 × ${rooms}间 × ${nights}晚 = ${cm(calcAmt)}`;
    // First city gets early check-in option (+1 night)
    return `<div class="cost-line">
  <div style="flex:1;min-width:120px"><div class="cost-line-label">${esc(lbl)}</div>${splitHint}</div>
  <input type="number" id="hrate-${showIdx}-${item.key}" placeholder="${curSym()}0.00" value="${mIn(rate)}" min="0" ${dis} title="房价 ¥/间晚（默认住 1 晚）" oninput="onCostHotel(${showIdx},'${item.key}','hotelRate',mWr(this.value))">
  <input type="number" id="hrooms-${showIdx}-${item.key}" placeholder="0" value="${rooms||''}" min="0" ${dis} oninput="onCostHotel(${showIdx},'${item.key}','hotelPersons',+this.value)">
  <input type="number" id="amt-${showIdx}-${item.key}" value="${mIn(c.amount)}" placeholder="0" min="0" step="100" ${dis} title="${formulaStr}" oninput="onCost(${showIdx},'${item.key}',mWr(this.value))">
</div>`;

// ══════════════════════════════════════════════════════════
//  [v3.8.23] 我方 Offer 测算引擎（NPBO → 建议保底风险 → 主开关分账）。新建项目；纯派生展示，不改 calcShow。
// ══════════════════════════════════════════════════════════
function ensureOffer(){
  if(!state.offer) state.offer={splitEnabled:false,splitMode:'fixed',bonusPerTicket:0,promoterPct:80};
  const o=state.offer;
  if(o.splitEnabled===undefined)o.splitEnabled=false;
  if(!o.splitMode)o.splitMode='fixed';
  if(o.bonusPerTicket===undefined)o.bonusPerTicket=0;
  if(o.promoterPct===undefined)o.promoterPct=80;
  if(o.cushionPct===undefined)o.cushionPct=10;
  if(o.targetMargin===undefined)o.targetMargin=40;
  if(o.floorMargin===undefined)o.floorMargin=15;
  if(o.marketPct===undefined)o.marketPct=30;
  if(o.assumeOcc===undefined)o.assumeOcc=70;
  return o;
}
// 层1 NPBO（满场净潜在总票房）+ 层2 建议保底/占比 + 回本点/起征点。复用系统平台费+VAT，只把上座率拉满。
function computeOffer(sh){
  const r=calcShow(sh);
  const cap=sh.capacity||0;
  const sold=r.soldTotal||0;
  const avgPrice= sold>0 ? r.gross/sold : 0;                 // 票档加权均价（票面）
  const fullGross= cap*avgPrice;                             // 满场票面总票房
  const pfFull= (typeof showPlatformFee==='function') ? showPlatformFee(sh, fullGross) : 0;
  const vatFull= vatOf(fullGross);
  const NPBO= Math.max(0, fullGross - pfFull - vatFull);     // 满场净潜在总票房
  const suggested= NPBO*0.30;                                // 建议保底 = NPBO×30%
  const guaCNY= r.guaPerShow||0;                             // 当前保底（CNY）
  const ratio= NPBO>0 ? guaCNY/NPBO : 0;
  const netPerSeat= cap>0 ? NPBO/cap : 0;                    // 满场净/座
  const expenses= r.promoterCost||0;                         // 本地运营成本（不含保底）
  const bep= netPerSeat>0 ? (guaCNY+expenses)/netPerSeat : 0;// 回本张数
  const _cush=(state.offer&&state.offer.cushionPct!=null)?+state.offer.cushionPct:10;
  const splitPoint= bep*(1+_cush/100);                       // 起征点(旧·兼容)
  // [v3.8.98] 目标利润率反推 + 上座率假设驱动
  const tm=(state.offer&&state.offer.targetMargin!=null)?+state.offer.targetMargin:40;
  const occA=(state.offer&&state.offer.assumeOcc!=null)?+state.offer.assumeOcc:70;
  const rOcc=calcShow(sh, occA);
  const grossOcc=rOcc.gross||0, netOcc=rOcc.net||0, netPotOcc=rOcc.netPotential||0, expensesOcc=rOcc.promoterCost||0;
  const ceilGua=Math.max(0, netPotOcc - (tm/100)*netOcc);   // 建议保底·开价（利润率口径=净票房 NBOR）
  const fm=(state.offer&&state.offer.floorMargin!=null)?+state.offer.floorMargin:15;
  const floorGua=Math.max(0, netPotOcc - (fm/100)*netOcc);       // 保底上限（最低利润率=保本+fm）
  const marketPct=(state.offer&&state.offer.marketPct!=null)?+state.offer.marketPct:30;
  const marketRef=Math.max(0, netOcc*(marketPct/100));        // 市场参照（净票房×可编辑%）
  const redline=Math.max(0, netPotOcc);                      // 保本上限（保底=净潜力→利润0）
  const splitPointOcc=Math.round((occA/100)*cap);            // 起征点 = 上座率假设×容量
  const bonusSuggest=Math.max(0, Math.round((1-tm/100)*netPerSeat)); // 守住利润率的建议单票奖金
  return {cap,avgPrice,fullGross,NPBO,suggested,guaCNY,ratio,netPerSeat,expenses,bep,splitPoint,
          tm,fm,marketPct,occA,grossOcc,netOcc,netPotOcc,expensesOcc,ceilGua,floorGua,marketRef,redline,splitPointOcc,bonusSuggest};
}
function offerToggleSplit(){ ensureOffer().splitEnabled=!state.offer.splitEnabled; render(); }
function offerSetSplit(v){ ensureOffer().splitEnabled=!!v; render(); }   // [v3.8.27/#8] 分段切换
function offerSetMode(m){ ensureOffer().splitMode=m; render(); }
function onOfferBonus(v){ ensureOffer().bonusPerTicket=Math.max(0,(+v||0)*curRate()); render(); }
function onOfferPct(v){ ensureOffer().promoterPct=Math.max(0,Math.min(100,+v||0)); render(); }
function onOfferCushion(v){ ensureOffer().cushionPct=Math.max(0,Math.min(100,+v||0)); render(); }
function onOfferTargetMargin(v){ ensureOffer().targetMargin=Math.max(0,Math.min(90,+v||0)); render(); }
function onOfferAssumeOcc(v){ ensureOffer().assumeOcc=Math.max(10,Math.min(100,+v||0)); render(); }
function onOfferFloorMargin(v){ ensureOffer().floorMargin=Math.max(0,Math.min(60,+v||0)); render(); }

  } else {

    const modeSel=`<select onchange="offerSetMode(this.value)" style="font-size:12px;padding:3px 6px;border:1px solid #dde1ef;border-radius:6px"><option value="fixed" ${o.splitMode==='fixed'?'selected':''}>固定单票奖金</option><option value="pct" ${o.splitMode==='pct'?'selected':''}>比例分红</option></select>`;
    let modeHTML, _maxBonus=0;
    if(o.splitMode==='fixed'){
      const overTix=Math.max(0,x.cap-sp); const bonusAmt=(o.bonusPerTicket||0)*overTix; _maxBonus=bonusAmt;
      const _bptDisp=o.bonusPerTicket?(state.displayCur==='CNY'?o.bonusPerTicket:+(o.bonusPerTicket/curRate()).toFixed(2)):'';
      const _bSugDisp=state.displayCur==='CNY'?x.bonusSuggest:+(x.bonusSuggest/curRate()).toFixed(2);
      modeHTML=`单票奖金 ${curSym()}<input type="number" value="${_bptDisp}" min="0" step="10" placeholder="${_bSugDisp}" style="width:80px;font-size:12px;padding:3px 6px;border:1px solid #dde1ef;border-radius:6px" oninput="onOfferBonus(this.value)"><span style="font-size:11px;color:#888;margin-left:6px">建议 ${cm(x.bonusSuggest)}/张（守住 ${fmtP(x.tm)} 利润率）</span><div style="margin-top:6px;font-size:12px;color:#555">满场超起征点 <b>${fmt(overTix)}</b> 张 × ${cm(o.bonusPerTicket||0)} ≈ <b>${cm(bonusAmt)}</b> 给艺人</div>`;
    } else {

function renderTourOfferSummary(){
  if(!state.shows.length) return '';
  const xs=state.shows.map(computeOffer); const n=xs.length;
  const sum=k=>xs.reduce((a,x)=>a+x[k],0);
  const sumNPBO=sum('NPBO'), sumSug=sum('suggested'), sumGua=sum('guaCNY');
  const avgRatio = sumNPBO>0 ? sumGua/sumNPBO*100 : 0;
  const allGua = state.shows.every(function(_s){try{return (calcShow(_s).guaPerShow||0)>0;}catch(e){return false;}});
  const g = allGua?'':'opacity:.4';
  const cell=(lbl,val,sub,extra)=>`<div style="flex:1;min-width:150px;padding:10px 12px;border:1px solid #e2e6f3;border-radius:10px;${extra||''}"><div style="font-size:11px;color:#888">${lbl}</div><div style="font-size:17px;font-weight:800;color:#2d3a8c">${val}</div>${sub?`<div style="font-size:11px;color:#999;margin-top:2px">${sub}</div>`:''}</div>`;
  const rk = avgRatio<35?'🟢 安全':avgRatio<=45?'🟡 警告':'🔴 阻断';
  return `<div style="margin-top:16px;border:1.5px solid #d8dbe8;border-radius:12px;padding:14px;background:#fafbff">
    <div style="font-weight:800;color:#3730a3;margin-bottom:10px">🎯 巡演 Offer 汇总（${n} 场 · 合计与均值）</div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      ${cell('巡演 NPBO 合计', '¥'+fmt(sumNPBO), '平均每场 ¥'+fmt(sumNPBO/n))}
      ${cell('建议保底合计 (30%)', '¥'+fmt(sumSug), '平均每场 ¥'+fmt(sumSug/n))}
      ${cell('当前保底合计', '¥'+fmt(sumGua), '平均每场 ¥'+fmt(sumGua/n), g)}
      ${cell('巡演平均保底占比', fmtP(avgRatio), rk, g)}

    ${allGua?'':'<div style="font-size:11px;color:#999;margin-top:8px">⚪ 当前保底/占比待所有场次都填入保底后才完整（灰显中）</div>'}
  </div>`;
}

    const today=new Date(); today.setHours(0,0,0,0);
    const addDays=(d,n)=>new Date(d.getTime()+n*86400000);
    const fmtD=d=>{const s=d.toISOString().slice(0,10); return s+getWeekday(s);}
    const approveDate = addDays(showDate, -(state.permitDays + state.mktDays + state.prepDays));
    const prepDate    = addDays(showDate, -(state.permitDays + state.mktDays));
    const permitDate  = addDays(showDate, -state.mktDays);
    const announceDate= addDays(showDate, -(state.mktDays - 10));
    const ticketsDate = addDays(showDate, -(state.mktDays - 15));
    const urgency=(d)=>{const diff=(d-today)/86400000; return diff>30?'green':diff>15?'yellow':'red';};
    const badge=(d)=>`<span class="deadline-badge badge-${urgency(d)}">${Math.round((d-today)/86400000)}天后</span>`;
    ddlContent=`
    <div class="notice notice-blue" style="margin-bottom:14px">最早演出：<b>${earliestShow.city} · ${earliestShow.date}${getWeekday(earliestShow.date)}</b></div>
    <div class="deadline-row"><div class="deadline-label">🔴 艺人必须 Approve Offer 截止</div><div style="display:flex;gap:8px;align-items:center"><span class="deadline-date">${fmtD(approveDate)}</span>${badge(approveDate)}</div></div>
    <div class="deadline-row"><div class="deadline-label">📋 报批资料提交截止</div><div style="display:flex;gap:8px;align-items:center"><span class="deadline-date">${fmtD(prepDate)}</span>${badge(prepDate)}</div></div>
    <div class="deadline-row"><div class="deadline-label">📨 文化报批递交</div><div style="display:flex;gap:8px;align-items:center"><span class="deadline-date">${fmtD(permitDate)}</span>${badge(permitDate)}</div></div>
    <div class="deadline-row"><div class="deadline-label">📢 预计官宣日</div><div style="display:flex;gap:8px;align-items:center"><span class="deadline-date">${fmtD(announceDate)}</span>${badge(announceDate)}</div></div>
    <div class="deadline-row"><div class="deadline-label">🎫 预计售票开始</div><div style="display:flex;gap:8px;align-items:center"><span class="deadline-date">${fmtD(ticketsDate)}</span>${badge(ticketsDate)}</div></div>`;
  } else {
    ddlContent=`<div class="text-muted" style="padding:20px;text-align:center">请先添加演出日期</div>`;
  }
  return `<div class="subsec-h">⏳ Offer 时间节点（报批 · 宣发排期）</div>
  <div class="form-grid g3" style="margin-bottom:16px">
    <div class="field"><label>${t('permitDays')}</label><input type="number" id="f-permit-days" value="${state.permitDays}" min="1" ${dis} oninput="state.permitDays=+this.value;rerenderS6()"></div>
    <div class="field"><label>${t('mktDays')}</label><input type="number" id="f-mkt-days" value="${state.mktDays}" min="1" ${dis} oninput="state.mktDays=+this.value;rerenderS6()"></div>
    <div class="field"><label>${t('prepDays')}</label><input type="number" id="f-prep-days" value="${state.prepDays}" min="1" ${dis} oninput="state.prepDays=+this.value;rerenderS6()"></div>
  </div>
  ${ddlContent}`;
}

// [v3.7.18] per diem 四行由「人员与餐标」表驱动：单价=餐标，数量=人数，金额=单价×数量。唯一数据源、成本项里只读。
function syncPeoplePerDiem(){
  ensurePeople(state);
  (state.shows||[]).forEach(sh=>{
    const c=sh.costs; if(!c) return;
    PD_KEYS.forEach(k=>{   // 艺人方三类：每场·演出日 = 单价×人数
      const ck=PD_ITEM_BY_PEOPLE[k];
      let item=c[ck]; if(!item){ item=c[ck]={amount:0,unitPrice:0,quantity:0,resp:'promoter'}; }
      const unit=pPd(k), qty=pCount(k);
      item.unitPrice=unit; item.quantity=qty; item.amount=unit*qty; item.pdDriven=true;
    });
    // [v3.7.23] 巡演工作团队餐补：餐标 × 人数 × 总停留天数 ÷ 场数，平摊到每场（只读）
    // 只数「已排期(有日期)的真实场次」，排除 startNew 的空白占位场；总停留 = 演出日 + 行程日(移动等非演出日)
    const realShows=(state.shows||[]).filter(x=>x.date).length||1;
    const totalStay=realShows+((state.logiDays||[]).length);
    let cm=c.crew_meals; if(!cm){ cm=c.crew_meals={amount:0,unitPrice:0,quantity:0,resp:'promoter'}; }
    cm.unitPrice=pPd('tourCrew'); cm.quantity=pCount('tourCrew'); cm.pdDriven=true;
    cm.amount=sh.date?Math.round(pPd('tourCrew')*pCount('tourCrew')):0;   // [v3.7.57] 仅本演出日（行程日餐补在行程日卡各自计，避免双计）
  });
}
// [v3.7.22] 双重等级房型：每类按其档次取房价。同一酒店=四类同档(hotelGlobalTier)；分档=各类自选(hotelTiers[k])。
function hotelTierFor(k){
  if(state.hotelSameHotel!==false) return state.hotelGlobalTier||'mid';
  return (state.hotelTiers&&state.hotelTiers[k])||'mid';
}
function hotelRateForCat(city, k){
  let r=getHotelRate(city, hotelTierFor(k));
  if(!r && city) r=hotelRateByLevel(city, state.artistLevel||'Livehouse');
  return r||0;
}
// [v3.7.20→22] 酒店四类由「人员与餐标」人数 + 各类档次驱动：房间数=roomsFor(类)，房价=城市×该类档次，金额=房价×房间数×晚数。手改过的行(_userEdited)不覆盖。
function applyPeopleHotel(sh){
  if(!sh||!sh.costs) return;
  PEOPLE_KEYS.forEach(k=>{
    const ck=HOTEL_ITEM_BY_PEOPLE[k];
    let item=sh.costs[ck]; if(!item){ item=sh.costs[ck]={amount:0,hotelRate:0,hotelPersons:0,hotelNights:1,resp:'promoter'}; }
    if(item._userEdited) return;
    item.hotelRate=hotelRateForCat(sh.city, k);
    item.hotelPersons=roomsFor(k);
    if(!item.hotelNights) item.hotelNights=1;
    item.amount=(item.hotelRate||0)*item.hotelPersons*(item.hotelNights||1);
  });
}
function syncPeopleHotelAll(){ ensurePeople(state); (state.shows||[]).forEach(sh=>applyPeopleHotel(sh)); }
// [v3.7.31] 城际交通：机票/高铁 四类×两式·每场。机票数量默认=该类人数（主估）；高铁默认留空备用，避免机票+高铁双计。单价预填默认值，手改过(_userEdited)不覆盖。
const TRAVEL_ITEM_PEOPLE={artist_airfare:'artist',band_airfare:'band',artist_staff_airfare:'artistStaff',crew_airfare:'tourCrew',artist_train:'artist',band_train:'band',artist_staff_train:'artistStaff',crew_train:'tourCrew'};
// [v3.7.34] 全队交通档次：机票舱位 / 高铁座位（可全队同档或四类分档）/ 地面车型（全队）→ 驱动默认单价（参考价，可改）
const AIR_CABIN_PRICE={eco:800, biz:1900};
const TRAIN_SEAT_PRICE={second:553, first:880, business:1660};
function ensureTravelClass(){
  if(!state.travelClass) state.travelClass={airCabin:'eco',trainSeat:'second',groundVehicle:'coach'};
  if(state.travelSameClass===undefined) state.travelSameClass=true;
  const tc=state.travelClass; if(!tc.byCat) tc.byCat={};
  PEOPLE_KEYS.forEach(k=>{ if(!tc.byCat[k]) tc.byCat[k]={airCabin:tc.airCabin||'eco',trainSeat:tc.trainSeat||'second'}; });
  return tc;
}
function travelMode(ck){ return ck.indexOf('airfare')>=0?'airfare':'train'; }
function airCabinFor(k){ const tc=ensureTravelClass(); return (state.travelSameClass!==false)?tc.airCabin:((tc.byCat[k]||{}).airCabin||tc.airCabin); }
function trainSeatFor(k){ const tc=ensureTravelClass(); return (state.travelSameClass!==false)?tc.trainSeat:((tc.byCat[k]||{}).trainSeat||tc.trainSeat); }
function syncTravel(sh){
  if(!sh||!sh.costs) return;
  const primary=state.primaryTransport||'air';   // [v3.7.59] 全队主出行方式：air/train
  Object.keys(TRAVEL_ITEM_PEOPLE).forEach(ck=>{
    let item=sh.costs[ck]; if(!item){ item=sh.costs[ck]={amount:0,unitPrice:0,quantity:0,resp:'promoter'}; }
    if(item._userEdited) return;                   // 整行手改过→不动（可单腿混搭）
    const mode=travelMode(ck), k=TRAVEL_ITEM_PEOPLE[ck];
    if(mode==='airfare'){
      item.unitPrice=AIR_CABIN_PRICE[airCabinFor(k)]||AIR_CABIN_PRICE.eco;
      item.quantity=(primary==='air')?pCount(k):0;       // 主出行=机票才带人数，否则清零
    }else{
      if(!item._userPriced) item.unitPrice=TRAIN_SEAT_PRICE[trainSeatFor(k)]||TRAIN_SEAT_PRICE.second;
      item.quantity=(primary==='train')?pCount(k):0;     // 主出行=高铁才带人数，否则清零
    }
    item.amount=Math.round((item.unitPrice||0)*(item.quantity||0));
  });
}
function syncTravelAll(){ if(isDemo) return; ensurePeople(state); ensureTravelClass(); (state.shows||[]).forEach(sh=>syncTravel(sh)); }
// [v3.8.15/#11] 主出行方式可取消：再次点击已选项→none（机票/高铁均清零）。引擎已支持 primary!=='air'&&!=='train' 时双清零。
function onPrimaryTransport(v){
  const cur=state.primaryTransport||'air';
  state.primaryTransport=(cur===v)?'none':v;
  propagateGlobalParams();
}
// [v3.7.57] 行程日酒店随 人员(房间数) + 城市(房价×档次) 同步，除非手改 rate/rooms
function hotelCityForLogi(ld){ return ld.type==='travel' ? (ld.toCity||ld.fromCity||'') : (ld.city||''); }
function syncLogiHotelAll(){
  if(isDemo) return;
  (state.logiDays||[]).forEach(ld=>{
    if(!ld.hotel) ld.hotel={rate:0,rooms:0,nights:1,amount:0};
    if(ld.hotel._userEdited) return;
    const _city=hotelCityForLogi(ld);
    const _tier=ld.hotelTier||state.hotelGlobalTier||'mid';                                  // [v3.8.14/#10] 每日可覆盖档次（空=跟随全局）
    const _share=(ld.hotelShare!==undefined)?ld.hotelShare:(state.hotelDoubleRoom!==false);   // [#10] 每日可覆盖合住（未设=跟随全局）
    const rate=_city ? getHotelRate(_city, _tier) : 0;
    // [v3.8.16/#10修] 房间数按「演出日 roomsFor 规则」逐类求和：艺人每人独间；其余 合住→⌈人数/2⌉、不合住→人数。
    const rooms=PEOPLE_KEYS.reduce((sum,k)=>{const n=pCount(k); if(n<=0) return sum; if(k==='artist') return sum+n; return sum+(_share?Math.ceil(n/2):n);},0);
    ld.hotel.rate=rate; ld.hotel.rooms=rooms; if(!ld.hotel.nights) ld.hotel.nights=1;
    ld.hotel.amount=rate*rooms*(ld.hotel.nights||1);
  });
}

function syncGlobalCustomTiers(){
  const gts=(state.globalTiers||[]).filter(gt=>(gt.name||'').trim());
  (state.shows||[]).forEach(sh=>{
    if(!Array.isArray(sh.tiers)) sh.tiers=[];
    gts.forEach(gt=>{

      let tr=sh.tiers.find(t=>t.name===nm);
      if(!tr){ tr={name:nm, price:'', capCount:'', occ:85}; sh.tiers.push(tr); }
      if(!tr._priceEdited && gt.price!==''&&gt.price!=null) tr.price=+gt.price;
    });

  if(state.calMonth===0){state.calYear--;state.calMonth=11;}else{state.calMonth--;}
  rerenderSection(1);
}
function calNext(){
  if(state.calMonth===11){state.calYear++;state.calMonth=0;}else{state.calMonth++;}
  rerenderSection(1);
}

// Helper: get venue rent based on day-of-week
function getVenueRent(v, dateStr){
  if(!v) return 0;
  if(!dateStr){return v.rw||v.rf||0;}
  const dow=new Date(dateStr+'T00:00:00').getDay(); // 0=Sun..6=Sat
  if(dow===5) return v.rf||v.rw||0;                 // Friday
  if(dow===6) return v.rs||v.rf||v.rw||0;           // Saturday (fallback rf)
  if(dow===0) return v.ru||v.rf||v.rw||0;           // Sunday (fallback rf)
  return v.rw||v.rf||0;                             // Mon-Thu
}
// Helper: find venue object by name in a city
function findVenueByName(city, venueName){
  if(!city||!venueName) return null;
  const list=VENUE_DB[city];
  if(!list) return null;
  return list.find(v=>v.n===venueName)||null;
}

function safeSetCost(sh, key, val){
  // Safely set cost amount if not user-edited
  if(!sh.costs[key]) return;
  if(sh.costs[key]._userEdited) return;
  sh.costs[key].amount=val;
}

// ── Step2: 按 艺人级别 × 城市 × 场馆 从 DB v3 自动拉取（新建项目/精简模型）──
// 只填未被用户手动改过的行（safeSetCost / _userEdited）。
function applyAutoPullV3(sh, city){
  if(!sh||!sh.costs) return;
  const hasDBcity = !!(city && VENUE_DB[city]);  // 仅限从场馆 DB 选中的城市
  if(!hasDBcity) return;   // [v3.7.28] 未选场馆 DB 城市 → 不自动填任何金额（不再塞 backline/buffer 等级别兜底值）
  const level=state.artistLevel||'Livehouse';
  applyPeopleHotel(sh);   // 演出当晚酒店四类（房间数=各类人数；房价=城市×档次）
  // [v3.7.35] 地面交通不再随城市自动填（无选择即出现金额的根因）；由用户在「地面交通」行选车型录入
  setUnitQty(sh,'wristband', DBV3.wristband, sh.capacity||0);   // [v3.7.30] 单价¥0.24 × 容量
  safeSetCost(sh,'insurance', DBV3.insurance[level]||4000);   // [v3.8.21] 保险默认¥4,000（Livehouse）
  // [v3.7.39] 票务佣金成本项已移除（平台抽成只在净票房公式 ×(1−平台费率−税) 扣一次，由「票务平台」下拉驱动）
  { const _blc=backlineLevelCost(); if(_blc!=null) safeSetCost(sh,'backline', _blc); }   // [v3.7.41] Backline 随制作级别
  // [v3.7.40] buffer 默认 0（不再随级别自动填 4000）；需要时手动填
  // [v3.7.28] 文化报批不再用级别默认（DBV3.mocPermit）；改由场馆 af 自动带出（applyVenueRef）
  const visaRate=(DBV3.visa[state.artistNationality]!==undefined?DBV3.visa[state.artistNationality]:DBV3.visa.other);
  setPerHead(sh,'visa', visaRate, (state.bandSize||0));
  // [v3.7.28] 安保改为随场馆 sf 自动带（applyVenueRef → 场地安保 sec_venue）；删掉 ¥400/人 × 容量/100 的通用估算
}
// 设置按人头成本（单价×人数），尊重 _userEdited
function setPerHead(sh, key, unit, qty){
  const c=sh.costs[key]; if(!c||c._userEdited) return;
  c.unitPrice=unit; c.quantity=qty;
  const ns=AMORTIZE_TOUR_KEYS[key]?((state.shows||[]).length||1):1;   // [v3.8.2] 签证一次性→÷场数
  c.amount=unit*qty/ns;
}
// 单价×数量（金额取整），尊重 _userEdited
function setUnitQty(sh, key, unit, qty){
  const c=sh.costs[key]; if(!c||c._userEdited) return;
  c.unitPrice=unit; c.quantity=qty; c.amount=Math.round(unit*qty);
}

// 改 Backline 配置 → 重算各场 backline（未手改的行）
function onBacklineConfig(key, val){
  if(!state.backlineConfig) state.backlineConfig={};
  if(key==='shared') state.backlineConfig.shared=val;
  else state.backlineConfig[key]=val===''?'':+val;
